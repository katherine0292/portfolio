<!doctype html>
<html lang="en" data-world="departure">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Portfolio Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;600&family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Bagel+Fat+One&family=Nunito:wght@500;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400;600&family=Kalam:wght@400;700&display=swap">
<style>
/*
  CONCEPT · "Next Step"
  Katherine designs for the moment a routine breaks. The portfolio itself is explainable:
  a WHY panel (after Wildling's MIND panel) narrates every layout decision, and a journey
  rail (after Transfer Coach) shows where the visitor is in the flow.
  Four worlds skin one flow: Boot → Hero → Work → Case → About → Contact.
  Each world commits to one look, so colours are set explicitly per world.
*/
:root{
  --bg:#F3F4F1; --fg:#111111; --muted:#5E605B; --line:#111111; --card:#FFFFFF;
  --accent:#FF5B14; --accent2:#FFB000; --ink-on-accent:#111111;
  --fd:"Archivo", "Arial Narrow", system-ui, sans-serif;
  --fb:"Archivo", system-ui, sans-serif;
  --fm:"JetBrains Mono", ui-monospace, monospace;
  --radius:0px;
  --gutter:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
/* D · Departure — Swiss signal, after Dennis Snellenberg + Daniel Spatzek */
html[data-world="departure"]{
  --bg:#F3F4F1; --fg:#111111; --muted:#5E605B; --line:#111111; --card:#FFFFFF;
  --accent:#FF5B14; --accent2:#FFB000; --ink-on-accent:#111111;
  --fd:"Archivo", "Arial Narrow", system-ui, sans-serif; --fb:"Archivo", system-ui, sans-serif; --fm:"JetBrains Mono", ui-monospace, monospace;
  --radius:0px; color-scheme:light;
}
/* B · Mind OS — cinematic glass, after Jason Yuan */
html[data-world="mind-os"]{
  --bg:#07080C; --fg:#ECEBF5; --muted:#8C8BA3; --line:rgba(236,235,245,.12); --card:rgba(255,255,255,.05);
  --accent:#B9A6FF; --accent2:#8EF0D0; --ink-on-accent:#07080C;
  --fd:"Geist", system-ui, sans-serif; --fb:"Geist", system-ui, sans-serif; --fm:"Geist Mono", ui-monospace, monospace;
  --radius:18px; color-scheme:dark;
}
/* C · Clay Island — a small world to walk around, after David Heckhoff + Luca */
html[data-world="clay-island"]{
  --bg:#DCE5CC; --fg:#3B2A20; --muted:#6F6150; --line:#3B2A20; --card:#FFF8EA;
  --accent:#8A5A3B; --accent2:#F2A65A; --ink-on-accent:#FFF8EA;
  --fd:"Bagel Fat One", "Arial Rounded MT Bold", system-ui, sans-serif; --fb:"Nunito", system-ui, sans-serif; --fm:"Nunito", system-ui, sans-serif;
  --radius:28px; color-scheme:light;
}
/* A · Field Notes — research board, after Queenie + Luca */
html[data-world="field-notes"]{
  --bg:#E8EDF1; --fg:#1B2A4A; --muted:#55657F; --line:#1B2A4A; --card:#FFFFFF;
  --accent:#2F5BEA; --accent2:#F7E463; --ink-on-accent:#FFFFFF;
  --fd:"Bricolage Grotesque", system-ui, sans-serif; --fb:"Instrument Sans", system-ui, sans-serif; --fm:"Kalam", "Comic Sans MS", cursive;
  --radius:4px; color-scheme:light;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--fb); font-size:16px; line-height:1.5; overflow-x:hidden; transition:background .4s, color .4s}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
h1,h2,h3{text-wrap:balance; margin:0}
p{margin:0}
.wrap{padding-left:var(--gutter); padding-right:var(--gutter-r)}
.inner{max-width:1240px; margin:0 auto}
.eyebrow{font-family:var(--fm); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)}

/* ─── Top bar ─────────────────────────────────────────── */
.topbar{position:fixed; inset:0 0 auto; z-index:50; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter-r) 12px var(--gutter); pointer-events:none}
.topbar > *{pointer-events:auto}
.mark{font-family:var(--fd); font-weight:800; font-size:15px; text-decoration:none; display:flex; align-items:center; gap:8px; mix-blend-mode:normal}
.mark i{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block; animation:pulse 2.4s infinite}
@keyframes pulse{50%{transform:scale(.6); opacity:.5}}
.topbar .meta{font-family:var(--fm); font-size:12px; color:var(--muted)}

/* ─── World switcher ──────────────────────────────────── */
.switcher{position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px));
  display:flex; gap:4px; padding:5px; border-radius:999px; background:#111; color:#fff; box-shadow:0 10px 40px rgba(0,0,0,.25); max-width:calc(100vw - 32px); overflow-x:auto}
.switcher button{border:0; background:transparent; color:#bbb; padding:9px 14px; border-radius:999px; font-family:"JetBrains Mono", monospace; font-size:12px; white-space:nowrap; display:flex; gap:6px; align-items:center}
.switcher button b{font-weight:600; color:#666}
.switcher button[aria-pressed="true"]{background:#fff; color:#111}
.switcher button[aria-pressed="true"] b{color:var(--accent)}
.switcher button:hover{color:#fff}
.switcher button[aria-pressed="true"]:hover{color:#111}

/* ─── Journey rail (after Transfer Coach) ─────────────── */
.rail{position:fixed; z-index:40; right:calc(16px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:0}
.rail button{border:0; background:none; display:flex; align-items:center; gap:10px; justify-content:flex-end; padding:7px 0; font-family:var(--fm); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.rail button span{opacity:0; transform:translateX(6px); transition:.25s}
.rail:hover button span, .rail button.on span{opacity:1; transform:none}
.rail button i{width:11px; height:11px; border-radius:50%; border:1.5px solid currentColor; position:relative; flex:none; transition:.25s}
.rail button:not(:last-child) i::after{content:""; position:absolute; left:50%; top:100%; width:1.5px; height:20px; background:currentColor; opacity:.35; transform:translateX(-50%)}
.rail button.on{color:var(--fg)}
.rail button.on i{background:var(--accent); border-color:var(--accent); transform:scale(1.25)}
.rail button.done i{background:currentColor}

/* ─── WHY panel (after Wildling's MIND panel) ─────────── */
.why{position:fixed; z-index:45; left:calc(16px + env(safe-area-inset-left,0px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); width:min(320px, calc(100vw - 32px));
  font-family:"JetBrains Mono", monospace; font-size:12px; line-height:1.55; color:#E9E9E4; background:rgba(17,17,17,.92); border-radius:14px; backdrop-filter:blur(10px);
  box-shadow:0 12px 40px rgba(0,0,0,.25); overflow:hidden}
.why header{display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-bottom:1px solid rgba(255,255,255,.1)}
.why header strong{letter-spacing:.14em; font-weight:600; display:flex; align-items:center; gap:8px}
.why header strong::before{content:""; width:7px; height:7px; border-radius:50%; background:#8EF0D0; box-shadow:0 0 10px #8EF0D0}
.why header button{background:none; border:0; color:#aaa; font-size:12px}
.why .body{padding:12px 14px 14px; display:grid; gap:8px}
.why .row{display:grid; grid-template-columns:86px 1fr; gap:8px}
.why .k{color:#7F7F78; text-transform:uppercase; letter-spacing:.08em; font-size:10.5px; padding-top:1px}
.why .v{min-width:0}
.why .cand{display:flex; flex-wrap:wrap; gap:4px}
.why .cand s{opacity:.45}
.why .cand em{font-style:normal; color:#111; background:#8EF0D0; padding:0 5px; border-radius:3px}
.why.min .body{display:none}
.why .typing::after{content:"▍"; animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* ─── Boot: an interrupted load (after HCI research) ──── */
.boot{position:fixed; inset:0; z-index:100; background:#0E0E0E; color:#F3F4F1; display:grid; place-items:center; font-family:"JetBrains Mono", monospace; transition:clip-path .9s cubic-bezier(.76,0,.24,1); clip-path:inset(0 0 0 0)}
.boot.out{clip-path:inset(0 0 100% 0)}
.boot .box{width:min(560px, calc(100vw - 32px)); display:grid; gap:18px}
.boot .count{font-family:"Archivo", sans-serif; font-variation-settings:"wdth" 125; font-weight:800; font-size:clamp(72px,18vw,180px); line-height:.85; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.boot .bar{height:3px; background:#2A2A2A; position:relative; overflow:hidden}
.boot .bar i{position:absolute; inset:0 auto 0 0; width:0; background:#FF5B14}
.boot .log{font-size:13px; color:#9A9A92; min-height:5.5em; white-space:pre-line}
.boot .log b{color:#FFB000; font-weight:400}
.boot.glitch .count{color:#FF5B14; animation:shake .25s 3}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.boot .skip{justify-self:start; background:none; border:1px solid #444; color:#ccc; border-radius:999px; padding:6px 12px; font-size:12px}

/* ─── Curtain between worlds (after Dennis Snellenberg) ─ */
.curtain{position:fixed; inset:-20vh 0; z-index:90; background:#111; color:#fff; transform:translateY(110%); display:grid; place-items:center; pointer-events:none;
  border-radius:50% 50% 0 0 / 14vh 14vh 0 0; transition:transform .7s cubic-bezier(.76,0,.24,1), border-radius .7s}
.curtain.in{transform:translateY(0); border-radius:0}
.curtain.leave{transform:translateY(-110%); border-radius:0 0 50% 50% / 0 0 14vh 14vh}
.curtain .t{text-align:center; display:grid; gap:10px; padding:0 16px}
.curtain .t h2{font-family:"Archivo", sans-serif; font-variation-settings:"wdth" 125; font-weight:800; font-size:clamp(40px,9vw,110px); letter-spacing:-.03em; line-height:.9}
.curtain .t p{font-family:"JetBrains Mono", monospace; font-size:12px; color:#999; letter-spacing:.12em; text-transform:uppercase}

/* ─── Cursor ──────────────────────────────────────────── */
.cursor{position:fixed; z-index:80; left:0; top:0; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:var(--accent); pointer-events:none;
  transition:width .25s, height .25s, margin .25s, background .25s; display:grid; place-items:center; font-family:var(--fm); font-size:11px; color:var(--ink-on-accent); mix-blend-mode:normal}
.cursor span{opacity:0; transition:opacity .2s; white-space:nowrap}
.cursor.big{width:76px; height:76px; margin:-38px 0 0 -38px}
.cursor.big span{opacity:1}
@media (pointer:coarse){.cursor{display:none}}

/* ─── Sections (shared) ───────────────────────────────── */
main{overflow-x:clip}
main section{position:relative}
.sec-head{display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap; padding-bottom:28px}
.sec-head h2{font-family:var(--fd); font-size:clamp(32px,5vw,64px); line-height:.95; letter-spacing:-.02em}

/* About / process — a real sequence, so numbered */
.about{padding-block:clamp(72px,10vw,140px)}
.about .lead{font-family:var(--fd); font-size:clamp(24px,3.2vw,42px); line-height:1.12; letter-spacing:-.01em; max-width:22ch}
.about .grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-top:48px}
.step{border-top:1.5px solid var(--line); padding-top:14px; display:grid; gap:8px; align-content:start}
.step .n{font-family:var(--fm); font-size:12px; color:var(--accent)}
.step h3{font-family:var(--fd); font-size:22px}
.step p{color:var(--muted); font-size:15px}
.step .ex{font-family:var(--fm); font-size:12px; color:var(--fg); opacity:.8}

.contact{padding-block:clamp(72px,10vw,140px) 160px; text-align:left}
.contact h2{font-family:var(--fd); font-size:clamp(44px,9vw,140px); line-height:.9; letter-spacing:-.03em}
.contact .row{display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-top:40px}
.magnet{display:inline-grid; place-items:center; width:156px; height:156px; border-radius:50%; background:var(--accent); color:var(--ink-on-accent); text-decoration:none; font-family:var(--fd); font-size:17px; text-align:center; transition:transform .25s cubic-bezier(.2,.8,.2,1); border:0}
.pill{border:1.5px solid var(--line); border-radius:999px; padding:12px 20px; text-decoration:none; background:transparent; font-family:var(--fm); font-size:13px}
.pill:hover{background:var(--fg); color:var(--bg)}
.footnote{margin-top:56px; font-family:var(--fm); font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap}

/* ════════════════════════════════════════════════════════
   WORLD D · DEPARTURE
   ════════════════════════════════════════════════════════ */
.d-hero{padding-block:120px 40px; overflow:hidden}
.d-hero .top{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:start}
.d-hero .top p{max-width:34ch; font-size:18px}
.d-name{font-family:"Archivo", sans-serif; font-weight:900; font-variation-settings:"wdth" 125; font-size:clamp(56px,15.2vw,236px); line-height:.82; letter-spacing:-.045em; margin-top:40px; white-space:nowrap}
.d-name span{display:inline-block; transition:font-variation-settings .5s, transform .5s}
.d-name .l2{display:block; padding-left:12vw}
.d-sub{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-top:28px; align-items:end}
.d-sub h3{font-family:"Archivo", sans-serif; font-variation-settings:"wdth" 75; font-weight:700; font-size:clamp(22px,3vw,36px); line-height:1.05; text-transform:uppercase}
.d-sub h3 em{font-style:normal; background:var(--accent); padding:0 .2em}
.ticker{overflow:hidden; border-block:1.5px solid var(--line); margin-top:48px; white-space:nowrap; font-family:var(--fm); font-size:13px; padding:10px 0; text-transform:uppercase}
.ticker div{display:inline-block; animation:tick 38s linear infinite}
.ticker span{margin-right:42px}
.ticker span::before{content:"●"; color:var(--accent); margin-right:12px}
@keyframes tick{to{transform:translateX(-50%)}}

.d-work{padding-block:80px}
.board{background:#121212; color:#F3F4F1; border-radius:6px; padding:clamp(14px,2vw,28px); font-family:var(--fm)}
.board .bh, .board .br{display:grid; grid-template-columns:52px minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,1fr) 40px; gap:16px; align-items:center}
.board .bh{font-size:11px; letter-spacing:.14em; color:#8A8A85; padding:0 12px 12px; border-bottom:1px solid #2B2B2B}
.board .br{padding:16px 12px; border-bottom:1px solid #222; text-decoration:none; position:relative; cursor:pointer; background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left; color:inherit}
.board .br:hover, .board .br:focus-visible{background:var(--accent); color:#111}
.board .br:hover .flap, .board .br:focus-visible .flap{color:#111; background:rgba(0,0,0,.08)}
.board .br .t{font-family:"Archivo", sans-serif; font-variation-settings:"wdth" 110; font-weight:800; font-size:clamp(20px,2.6vw,34px); letter-spacing:-.01em; line-height:1}
.board .br .c{font-size:12.5px; color:inherit; opacity:.75}
.flaps{display:flex; gap:2px; flex-wrap:wrap}
.flap{display:inline-grid; place-items:center; min-width:1.05em; height:1.6em; background:#1F1F1F; color:#FFB000; font-size:13px; border-radius:2px; position:relative; font-weight:600}
.flap::after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.6)}
.board .arrow{font-size:22px; justify-self:end; transition:transform .25s}
.board .br:hover .arrow{transform:translateX(4px) rotate(-45deg)}
.d-follow{position:fixed; z-index:30; left:0; top:0; width:min(360px,40vw); aspect-ratio:4/3; pointer-events:none; border-radius:4px; overflow:hidden; opacity:0; transform:translate(-50%,-50%) scale(.6); transition:opacity .25s, scale .25s; background:#222}
.d-follow.on{opacity:1}
.d-follow img{width:100%; height:100%; object-fit:cover}
.d-legend{display:flex; gap:20px; flex-wrap:wrap; margin-top:16px; font-family:var(--fm); font-size:12px; color:var(--muted)}

/* ════════════════════════════════════════════════════════
   WORLD B · MIND OS
   ════════════════════════════════════════════════════════ */
.aurora{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.aurora i{position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(90px); opacity:.42; animation:float 22s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:#6B4BFF; left:-15vmax; top:-20vmax}
.aurora i:nth-child(2){background:#1FB89A; right:-20vmax; top:10vmax; animation-delay:-7s; opacity:.28}
.aurora i:nth-child(3){background:#FF7AC6; left:30vw; bottom:-35vmax; animation-delay:-13s; opacity:.2}
@keyframes float{to{transform:translate(8vmax,6vmax) scale(1.15)}}
html[data-world="mind-os"] main{position:relative; z-index:1}
.m-hero{padding-block:140px 60px; text-align:center; display:grid; justify-items:center; gap:22px}
.m-hero .hello{font-family:var(--fm); font-size:12px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase}
.m-hero h1{font-weight:300; font-size:clamp(40px,7vw,96px); letter-spacing:-.045em; line-height:.98; max-width:14ch}
.m-hero h1 b{font-weight:600; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent}
.cmd{width:min(680px,100%); margin-top:18px; border-radius:18px; background:rgba(255,255,255,.06); border:1px solid var(--line); backdrop-filter:blur(24px); box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); text-align:left; overflow:hidden}
.cmd label{display:flex; align-items:center; gap:12px; padding:16px 18px}
.cmd label svg{flex:none; opacity:.6}
.cmd input{flex:1; min-width:0; background:none; border:0; outline:0; color:var(--fg); font:inherit; font-size:18px}
.cmd input::placeholder{color:var(--muted)}
.cmd kbd{font-family:var(--fm); font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:2px 6px}
.cmd .lenses{display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px 16px; border-top:1px solid var(--line)}
.lens{border:1px solid var(--line); background:rgba(255,255,255,.03); border-radius:999px; padding:6px 12px; font-size:13px; color:var(--muted)}
.lens[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.m-work{padding-block:40px 80px}
.windows{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:18px}
.win{border-radius:var(--radius); background:var(--card); border:1px solid var(--line); backdrop-filter:blur(20px); overflow:hidden; text-align:left; padding:0; display:flex; flex-direction:column;
  transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .4s, filter .4s, box-shadow .4s; box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.win:hover{transform:translateY(-6px); box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1)}
.win.dim{opacity:.18; filter:blur(2px) grayscale(1); transform:scale(.97)}
.win .bar{display:flex; align-items:center; gap:6px; padding:10px 12px; font-family:var(--fm); font-size:11px; color:var(--muted)}
.win .bar i{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.18)}
.win .bar span{margin-left:auto}
.win .shot{aspect-ratio:16/9; overflow:hidden; margin:0 10px; border-radius:10px}
.win .shot img{width:100%; height:100%; object-fit:cover; transition:transform .8s}
.win:hover .shot img{transform:scale(1.05)}
.win .txt{padding:14px 14px 16px; display:grid; gap:6px}
.win .txt h3{font-size:20px; font-weight:600; letter-spacing:-.02em}
.win .txt p{font-size:14px; color:var(--muted)}
.mind{font-family:var(--fm); font-size:11px; display:grid; gap:3px; margin-top:6px; padding:8px 10px; border-radius:10px; background:rgba(0,0,0,.25)}
.mind span{color:var(--muted)}
.mind b{font-weight:500; color:var(--accent2)}
.m-count{font-family:var(--fm); font-size:12px; color:var(--muted)}

/* ════════════════════════════════════════════════════════
   WORLD C · CLAY ISLAND
   ════════════════════════════════════════════════════════ */
html[data-world="clay-island"] body{background:linear-gradient(180deg,#CFE3E8 0, #DCE5CC 70vh, #DCE5CC 100%)}
.c-hero{padding-block:110px 40px; display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:24px; align-items:center; overflow:hidden}
.c-hero h1{font-family:var(--fd); font-weight:400; font-size:clamp(48px,7.5vw,108px); line-height:.92; color:var(--fg)}

  transform-style:preserve-3d; transform:rotateX(58deg) rotateZ(var(--rz,35deg)); transition:transform .1s linear}

.obj .bill:hover .tag, .obj .bill:focus-within .tag{opacity:1; transform:translateX(-50%) translateY(-2px)}
.c-work{padding-block:40px 80px}
.c-cards{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}

   WORLD A · FIELD NOTES

.f-hero{padding-block:120px 40px}
.f-board{position:relative; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; align-items:start}
.f-hero h1{font-family:var(--fd); font-weight:800; font-size:clamp(52px,9vw,136px); line-height:.86; letter-spacing:-.04em; position:relative}
.f-hero h1 .hl{background:linear-gradient(transparent 58%, var(--accent2) 58% 92%, transparent 92%); padding:0 .06em}
.hand{font-family:"Kalam", cursive; color:var(--accent); font-size:21px; line-height:1.25}
.f-anno{position:relative; margin-top:22px; display:flex; gap:12px; align-items:start; max-width:520px}
.f-anno svg{flex:none}
.f-q{font-size:19px; max-width:42ch; margin-top:22px}
.stickies{display:grid; gap:14px; padding-top:10px}
.sticky{padding:18px 18px 22px; font-family:"Kalam", cursive; font-size:20px; line-height:1.25; color:#1B2A4A; box-shadow:0 10px 18px -8px rgba(27,42,74,.35); position:relative}
.sticky small{display:block; font-family:"Instrument Sans", sans-serif; font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-bottom:6px}
.sticky:nth-child(1){background:#FFF1A8; transform:rotate(-2deg)}
.sticky:nth-child(2){background:#FAD0DA; transform:rotate(1.5deg) translateX(18px)}
.sticky:nth-child(3){background:#CFE7C2; transform:rotate(-1deg)}
.sticky::before{content:""; position:absolute; top:-9px; left:50%; width:16px; height:16px; margin-left:-8px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#FF8A8A,#C0392B); box-shadow:0 2px 3px rgba(0,0,0,.3)}
.f-work{padding-block:60px 80px}
.desk{position:relative; height:980px}
.card{position:absolute; width:260px; background:var(--card); padding:10px 10px 14px; box-shadow:0 14px 28px -12px rgba(27,42,74,.45); cursor:grab; touch-action:none; user-select:none; transition:box-shadow .2s, transform .25s}
.card:hover{transform:rotate(0deg) scale(1.03) !important; z-index:5}
.card.drag{cursor:grabbing; box-shadow:0 30px 50px -12px rgba(27,42,74,.5); transition:none; z-index:10}
.card .tape{position:absolute; top:-12px; left:50%; width:84px; height:24px; margin-left:-42px; background:rgba(247,228,99,.75); transform:rotate(-3deg)}
.card img{aspect-ratio:4/3; object-fit:cover; width:100%; pointer-events:none; filter:saturate(.9)}
.card h3{font-family:var(--fd); font-size:22px; margin-top:10px; letter-spacing:-.02em}
.card p{font-size:13.5px; color:var(--muted)}
.card .note{font-family:"Kalam", cursive; color:var(--accent); font-size:16px; margin-top:6px; line-height:1.2}
.card .open{position:absolute; right:10px; bottom:12px; border:1.5px solid var(--line); background:var(--card); border-radius:999px; width:32px; height:32px; font-size:15px}
.card .open:hover{background:var(--fg); color:var(--card)}
.f-help{display:flex; gap:10px; align-items:center}

/* ════════════════════════════════════════════════════════
   CASE STUDY OVERLAY (shared skeleton, themed per world)
   ════════════════════════════════════════════════════════ */
.case{position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; overscroll-behavior:contain; clip-path:circle(0 at var(--ox,50%) var(--oy,50%)); transition:clip-path .8s cubic-bezier(.76,0,.24,1); visibility:hidden}
html[data-world="field-notes"] .case{background-color:var(--bg); background-image:linear-gradient(#C9D6E2 1px, transparent 1px), linear-gradient(90deg,#C9D6E2 1px, transparent 1px); background-size:28px 28px}
html[data-world="clay-island"] .case{background:#EFE6D3}
.case.open{clip-path:circle(150% at var(--ox,50%) var(--oy,50%)); visibility:visible}
.case-bar{position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutter-r) 12px var(--gutter); background:var(--bg); border-bottom:1px solid var(--line)}

html[data-world="clay-island"] .case-bar{background:#EFE6D3}
.case-bar .crumb{font-family:var(--fm); font-size:12px; color:var(--muted)}
.case-bar .nav{display:flex; gap:8px}
.case-bar button{border:1.5px solid var(--line); background:transparent; border-radius:999px; padding:7px 14px; font-family:var(--fm); font-size:12px}
.case-bar button:hover{background:var(--fg); color:var(--bg)}
.case-cover{padding-block:56px 32px}
.case-cover .kick{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.stage-chip{font-family:var(--fm); font-size:12px; padding:4px 10px; border-radius:999px; background:var(--accent); color:var(--ink-on-accent)}
.case-cover h1{font-family:var(--fd); font-size:clamp(52px,10vw,150px); line-height:.86; letter-spacing:-.04em; margin-top:22px}
html[data-world="departure"] .case-cover h1{font-variation-settings:"wdth" 125; font-weight:900}
html[data-world="mind-os"] .case-cover h1{font-weight:300; letter-spacing:-.05em}
html[data-world="clay-island"] .case-cover h1{font-weight:400}
.case-cover .line{font-size:clamp(20px,2.4vw,30px); max-width:28ch; margin-top:18px; line-height:1.2}

.case-img{border-radius:var(--radius); overflow:hidden; margin-top:28px; border:1px solid var(--line)}

.toc{position:sticky; top:84px; align-self:start; display:grid; gap:6px; font-family:var(--fm); font-size:12px}

.chap{padding-bottom:64px; display:grid; gap:18px}
.chap .no{font-family:var(--fm); font-size:12px; color:var(--accent); letter-spacing:.1em}

.decision h3{font-family:var(--fd); font-size:19px; line-height:1.15}
.stats{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.stat{border-top:3px solid var(--accent); padding-top:12px; display:grid; gap:4px}

.stat span{color:var(--muted); font-size:14px}
.limit{border:1.5px dashed var(--line); border-radius:var(--radius); padding:18px 20px; display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; align-items:start; max-width:760px}
.limit .ic{font-family:var(--fm); font-size:12px; background:var(--accent2); color:#111; border-radius:999px; padding:3px 9px; white-space:nowrap}
.case-next{display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; padding-block:40px 120px; border-top:1px solid var(--line)}
.case-next button{border:0; background:none; text-align:left; padding:0}
.case-next .big{font-family:var(--fd); font-size:clamp(32px,6vw,80px); line-height:.9; letter-spacing:-.03em; display:block}
.case-next .big:hover{color:var(--accent)}
.placeholder{font-family:var(--fm); font-size:12px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius); padding:12px 14px}

/* ─── Responsive ──────────────────────────────────────── */
@media (max-width:900px){
  .about .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .c-hero{grid-template-columns:1fr}
  .c-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f-board{grid-template-columns:1fr}
  .chapters{grid-template-columns:1fr}
  .toc{display:none}
  .decisions,.stats{grid-template-columns:1fr}
  .rail{display:none}
  .board .bh{display:none}
  .board .br{grid-template-columns:40px minmax(0,1fr) 28px; row-gap:8px}
  .board .br .c{grid-column:2 / 3}
  .board .br .flaps{grid-column:2 / 3}
  .board .br .arrow{grid-row:1; grid-column:3}
  .d-follow{display:none}
  .desk{height:auto; display:grid; gap:28px; justify-items:center}
  .card{position:relative; left:auto !important; top:auto !important; width:min(320px,100%); cursor:pointer}
}
@media (max-width:560px){
  .about .grid{grid-template-columns:1fr}
  .c-cards{grid-template-columns:1fr}
  .cmeta{grid-template-columns:1fr}
  .d-name .l2{padding-left:0}
  .why{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .switcher button{padding:8px 10px}
  .switcher .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important}
}

  const p = P[i], n = P[(i+1)%P.length], prev = P[(i-1+P.length)%P.length];
  $("#case").innerHTML = `
  <div class="case-bar"><span class="crumb">03 · Case · ${String(i+1).padStart(2,"0")}/08</span>
    <div class="nav"><button type="button" data-case-go="${(i-1+P.length)%P.length}" aria-label="Previous: ${esc(prev.title)}">←</button><button type="button" data-case-go="${(i+1)%P.length}" aria-label="Next: ${esc(n.title)}">→</button><button type="button" id="caseClose">Close · Esc</button></div></div>
  <div class="wrap"><div class="inner">
    <div class="case-cover">
      <div class="kick"><span class="stage-chip">${esc(p.status)}</span><span class="eyebrow">${esc(p.cat)}</span></div>
      <h1 id="caseTitle">${esc(p.title)}</h1>
      <p class="line">${esc(p.line)}</p>
      <dl class="cmeta"><div><dt>Role</dt><dd>${esc(p.role)}</dd></div><div><dt>Tools</dt><dd>${esc(p.tools)}</dd></div><div><dt>Stage</dt><dd>${esc(p.stage)}</dd></div></dl>
      <div class="case-img"><img src="${IMG+p.img}" alt="${esc(p.title)} preview"></div>
    </div>
    <div class="chapters">
      <nav class="toc" aria-label="Chapters"><a href="#c1">01 Problem</a><a href="#c2">02 Decisions</a><a href="#c3">03 Evidence</a><a href="#c4">04 Not yet proven</a><a href="#c5">05 Media slots</a></nav>
      <div>
        <div class="chap" id="c1"><span class="no">01 · PROBLEM</span><h2>Where it breaks</h2><p>${esc(p.problem)}</p></div>
        <div class="chap" id="c2"><span class="no">02 · DECISIONS</span><h2>Decisions that matter</h2>
          <div class="decisions">${p.decisions.map(d => `<div class="decision"><span class="q">${esc(d[0])}</span><h3>${esc(d[1])}</h3></div>`).join("")}</div></div>
        <div class="chap" id="c3"><span class="no">03 · EVIDENCE</span><h2>What the source records</h2>
          <div class="stats">${p.stats.map(s => `<div class="stat"><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div></div>
        <div class="chap" id="c4"><span class="no">04 · NOT YET PROVEN</span><h2>Honest scope</h2>
          <div class="limit"><span class="ic">limit</span><p>${esc(p.limit)}</p></div></div>
        <div class="chap" id="c5"><span class="no">05 · MEDIA SLOTS</span><h2>To be laid out</h2>
          <p class="placeholder">Demo template: full-bleed video · before/after slider · prototype embed link · process photos go here in the real build.</p>
          <p><a class="pill" href="${p.live}" target="_blank" rel="noopener">Open the live project ↗</a></p></div>
      </div>
    </div>
    <div class="case-next"><span class="eyebrow">Next departure</span><button type="button" data-case-go="${(i+1)%P.length}"><span class="big">${esc(n.title)} →</span></button></div>
  </div></div>`;
}
function openCase(i, ev){
  caseIdx = i;
  const c = $("#case");
  if (ev && ev.clientX != null){ c.style.setProperty("--ox", ev.clientX+"px"); c.style.setProperty("--oy", ev.clientY+"px"); }
  renderCase(i);
  c.scrollTop = 0;
  c.classList.add("open");
  document.body.style.overflow = "hidden";
  setStep("case");
  setTimeout(() => $("#caseClose")?.focus({preventScroll:true}), 50);
  hideFollow();
}
function closeCase(){
  $("#case").classList.remove("open");
  document.body.style.overflow = "";
  caseIdx = -1;
  setStep("work");
}

/* ─── WHY panel ─── */
let whyTimer;
function setWhy(){
  const w = WHY[world][step]; if(!w) return;
  const cand = w.c.map(c => c === w.s ? `<em>${esc(c)}</em>` : `<s>${esc(c)}</s>`).join(" ");
  $("#whyBody").innerHTML = `
    <div class="row"><span class="k">step</span><span class="v">${esc(step)} · ${esc(WORLDS[world].name)}</span></div>
    <div class="row"><span class="k">candidates</span><span class="v cand">${cand}</span></div>
    <div class="row"><span class="k">reason</span><span class="v typing" id="whyR"></span></div>`;
  const el = $("#whyR"); let k = 0; clearInterval(whyTimer);
  if (reduce){ el.textContent = w.r; el.classList.remove("typing"); return; }
  whyTimer = setInterval(() => { el.textContent = w.r.slice(0, k += 3); if (k >= w.r.length){ clearInterval(whyTimer); setTimeout(()=>el.classList.remove("typing"),1200);} }, 18);
}
function setStep(s){
  if (s === step) return;
  step = s;
  const order = ["boot","hero","work","case","about","contact"];
  $$("#rail button").forEach(b => { const j = order.indexOf(b.dataset.step); b.classList.toggle("on", b.dataset.step === s); b.classList.toggle("done", j < order.indexOf(s)); });
  setWhy();
}
$("#whyToggle").addEventListener("click", e => { const w = $("#why"); w.classList.toggle("min"); e.target.textContent = w.classList.contains("min") ? "show" : "hide"; e.target.setAttribute("aria-expanded", !w.classList.contains("min")); });

/* ─── Mount a world ─── */
let io;
function mount(){
  document.documentElement.dataset.world = world;
  $("#aurora").hidden = world !== "mind-os";
  $("#stage").innerHTML = R[world]();
  $$(".switcher button").forEach(b => b.setAttribute("aria-pressed", b.dataset.world === world));
  io?.disconnect();
  io = new IntersectionObserver(es => { if (caseIdx >= 0 || step === "boot") return; es.forEach(e => { if (e.isIntersecting) setStep(e.target.dataset.step); }); }, {rootMargin:"-45% 0px -45% 0px"});
  $$("#stage [data-step]").forEach(s => io.observe(s));
  wire[world]?.();
  wireShared();
  const s = step; step = ""; setStep(s === "case" ? "hero" : s);
}

function switchWorld(w){
  if (w === world || !WORLDS[w]) return;
  if (caseIdx >= 0) closeCase();
  const c = $("#curtain");
  $("#curtainName").textContent = WORLDS[w].name;
  $("#curtainRef").textContent = WORLDS[w].ref;
  $("#curtainNote").textContent = WORLDS[w].note;
  if (reduce){ world = w; mount(); scrollTo(0,0); return; }
  c.classList.remove("leave"); c.classList.add("in");
  setTimeout(() => { world = w; mount(); scrollTo(0,0); try{ history.replaceState(null,"","#"+w); }catch(e){}
    c.classList.add("leave"); c.classList.remove("in");
    setTimeout(() => c.classList.remove("leave"), 800); }, 900);
}
$$(".switcher button").forEach(b => b.addEventListener("click", () => switchWorld(b.dataset.world)));
addEventListener("hashchange", () => { const h = location.hash.slice(1); if (WORLDS[h]) switchWorld(h); });

/* ─── Shared wiring ─── */
function wireShared(){
  $$("#stage [data-case]").forEach(el => el.addEventListener("click", e => { if (el.closest(".card")?.dataset.moved === "1") return; e.stopPropagation(); openCase(+el.dataset.case, e); }));
  $("#replay")?.addEventListener("click", () => { scrollTo(0,0); runBoot(); });
  const m = $(".magnet");
  if (m && matchMedia("(pointer:fine)").matches){
    m.addEventListener("pointermove", e => { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.35}px,${(e.clientY-r.top-r.height/2)*.35}px)`; });
    m.addEventListener("pointerleave", () => m.style.transform = "");
    m.addEventListener("pointerdown", () => { if (world === "clay-island") m.style.transform += " scale(.9,.82)"; });
  }
  $$("#stage [data-case], .magnet").forEach(el => { el.addEventListener("pointerenter", () => cur(true, el.classList.contains("magnet") ? "Say hi" : "Open")); el.addEventListener("pointerleave", () => cur(false)); });
}
$("#case").addEventListener("click", e => {
  const g = e.target.closest("[data-case-go]"); if (g){ caseIdx = +g.dataset.caseGo; renderCase(caseIdx); $("#case").scrollTop = 0; return; }
  if (e.target.closest("#caseClose")) closeCase();
  const a = e.target.closest(".toc a"); if (a){ e.preventDefault(); $("#case").querySelector(a.getAttribute("href"))?.scrollIntoView({behavior: reduce ? "auto" : "smooth"}); }
});
addEventListener("keydown", e => {
  if (e.key === "Escape" && caseIdx >= 0) closeCase();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ if (world !== "mind-os") switchWorld("mind-os"); setTimeout(()=>$("#cmdInput")?.focus(), world==="mind-os"?0:1000); e.preventDefault(); }
  if (/^[1-4]$/.test(e.key) && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) switchWorld(Object.keys(WORLDS)[+e.key-1]);
  if (caseIdx >= 0 && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ caseIdx = (caseIdx + (e.key === "ArrowRight" ? 1 : -1) + P.length) % P.length; renderCase(caseIdx); }
});
$$("#rail button").forEach(b => b.addEventListener("click", () => {
  const s = b.dataset.step;
  if (s === "boot") return runBoot();
  if (s === "case") return openCase(caseIdx >= 0 ? caseIdx : 0);
  if (caseIdx >= 0) closeCase();
  $("#s-"+s)?.scrollIntoView({behavior: reduce ? "auto" : "smooth"});
}));
$(".mark").addEventListener("click", e => { e.preventDefault(); if (caseIdx >= 0) closeCase(); scrollTo({top:0, behavior: reduce ? "auto" : "smooth"}); });

/* cursor + follow image */
const cursor = $("#cursor"), follow = $("#follow");
let mx = innerWidth/2, my = innerHeight/2, fx = mx, fy = my, cx = mx, cy = my;
addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; });
function cur(big, label){ cursor.classList.toggle("big", big); if (label) $("#cursorLabel").textContent = label; }
function hideFollow(){ follow.classList.remove("on"); }
(function loop(){
  cx += (mx-cx)*.35; cy += (my-cy)*.35; cursor.style.transform = `translate(${cx}px,${cy}px)`;
  fx += (mx-fx)*.12; fy += (my-fy)*.12; follow.style.left = fx+"px"; follow.style.top = fy+"px";
  requestAnimationFrame(loop);
})();

/* ─── Per-world wiring ─── */
const wire = {};
const FLAPCH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.";
function flap(el, text){
  el.innerHTML = [...text].map(() => `<span class="flap">&nbsp;</span>`).join("");
  const cells = $$(".flap", el);
  [...text].forEach((ch, i) => {
    if (reduce || ch === " "){ cells[i].innerHTML = ch === " " ? "&nbsp;" : ch; return; }
    let n = 6 + i*2 + Math.floor(Math.random()*6);
    const t = setInterval(() => { cells[i].textContent = --n <= 0 ? ch : FLAPCH[Math.floor(Math.random()*FLAPCH.length)]; if (n <= 0) clearInterval(t); }, 45);
  });
}
wire["departure"] = () => {
  const flaps = $$("[data-flap]");
  const fio = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ flap(e.target, e.target.dataset.flap); fio.unobserve(e.target); } }), {threshold:.6});
  flaps.forEach(f => { f.innerHTML = [...f.dataset.flap].map(c => `<span class="flap">${c===" "?"&nbsp;":c}</span>`).join(""); fio.observe(f); });
  $$(".board .br").forEach(r => {
    r.addEventListener("pointerenter", () => { $("#followImg").src = IMG + r.dataset.img; follow.classList.add("on"); flap($(".flaps", r), r.querySelector("[data-flap]").dataset.flap); });
    r.addEventListener("pointerleave", hideFollow);
  });
  const fit = () => { const n = $(".d-name"); if (!n) return; n.style.fontSize = "100px"; const w = n.scrollWidth, avail = n.parentElement.clientWidth; n.style.fontSize = Math.min(236, 100 * avail / w * .98) + "px"; };
  fit(); document.fonts?.ready.then(fit); addEventListener("resize", fit);
  $$(".d-name span").forEach(s => s.addEventListener("pointerenter", () => { if (!s.classList.contains("l2")){ s.style.fontVariationSettings = '"wdth" 62'; s.style.color = "var(--accent)"; setTimeout(()=>{ s.style.fontVariationSettings = ""; s.style.color=""; }, 700); } }));
};
wire["mind-os"] = () => {
  const input = $("#cmdInput"); let lens = null;
  const apply = () => {
    const q = input.value.trim().toLowerCase(); let n = 0;
    $$(".win").forEach(w => { const ok = (!q || w.dataset.q.includes(q)) && (!lens || w.dataset.lens === lens); w.classList.toggle("dim", !ok); n += ok; });
    $("#mCount").textContent = `${n} of 8 ${q||lens ? "match" : "running"}`;
  };
  input.addEventListener("input", apply);
  input.addEventListener("keydown", e => { if (e.key === "Enter"){ const first = $(".win:not(.dim)"); first?.scrollIntoView({behavior:"smooth", block:"center"}); } });
  $$(".lens").forEach(b => b.addEventListener("click", () => { lens = lens === b.dataset.lens ? null : b.dataset.lens; $$(".lens").forEach(x => x.setAttribute("aria-pressed", x.dataset.lens === lens)); apply(); }));
  if (!reduce){ const demo = ["evidence","voice","ios",""]; let d = 0; const t = setInterval(() => { if (world !== "mind-os" || document.activeElement === input || lens){ clearInterval(t); return; } input.placeholder = d < demo.length-1 ? `Ask the work… “${demo[d]}”` : "Ask the work… try “voice”, “iOS”, “evidence”"; d = (d+1) % demo.length; }, 2200); }
};
wire["clay-island"] = () => {
  const scene = $("#scene"), plane = $("#plane"); let rz = 35, drag = null, vel = 0;
  const set = () => plane.style.setProperty("--rz", rz+"deg");
  set();
  scene.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; drag = {x:e.clientX, rz}; scene.setPointerCapture(e.pointerId); });
  scene.addEventListener("pointermove", e => { if (!drag) return; const nrz = drag.rz + (e.clientX - drag.x) * .4; vel = nrz - rz; rz = nrz; set(); });
  const end = () => { if (!drag) return; drag = null; const glide = () => { if (Math.abs(vel) < .05) return; rz += vel; vel *= .92; set(); requestAnimationFrame(glide); }; if (!reduce) glide(); };
  scene.addEventListener("pointerup", end); scene.addEventListener("pointercancel", end);
  const turn = d => { const target = rz + d; const anim = () => { rz += (target - rz) * .15; set(); if (Math.abs(target - rz) > .3) requestAnimationFrame(anim); else { rz = target; set(); } }; reduce ? (rz = target, set()) : anim(); };
  $("#rotL").addEventListener("click", () => turn(-45)); $("#rotR").addEventListener("click", () => turn(45));
  if (!reduce){ const idle = () => { if (world !== "clay-island") return; if (!drag && Math.abs(vel) < .05 && step === "hero" && caseIdx < 0){ rz += .06; set(); } requestAnimationFrame(idle); }; idle(); }
};
wire["field-notes"] = () => {
  const desk = $("#desk"); let z = 10;
  $$(".card", desk).forEach(card => {
    let st = null;
    card.addEventListener("pointerdown", e => {
      if (innerWidth <= 900 || e.target.closest(".open")) return;
      st = {x:e.clientX, y:e.clientY, l:card.offsetLeft, t:card.offsetTop}; card.dataset.moved = "0";
      card.setPointerCapture(e.pointerId); card.classList.add("drag"); card.style.zIndex = ++z;
    });
    card.addEventListener("pointermove", e => {
      if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) card.dataset.moved = "1";
      const maxL = desk.clientWidth - card.offsetWidth;
      card.style.left = Math.max(0, Math.min(maxL, st.l + dx)) + "px"; card.style.top = Math.max(-20, st.t + dy) + "px";
    });
    const up = () => { if (!st) return; st = null; card.classList.remove("drag"); if (card.dataset.moved === "0") openCase(+card.dataset.card); setTimeout(() => card.dataset.moved = "0", 0); };
    card.addEventListener("pointerup", up); card.addEventListener("pointercancel", () => { st = null; card.classList.remove("drag"); });
  });
};

/* ─── Boot: load, get interrupted, resume ─── */
let bootRunning = false;
function runBoot(){
  if (caseIdx >= 0) closeCase();
  const b = $("#boot"), cnt = $("#bootCount"), bar = $("#bootBar"), log = $("#bootLog");
  b.classList.remove("out", "glitch"); bootRunning = true; step = ""; setStep("boot");
  const lines = [];
  const say = t => { lines.push(t); log.innerHTML = lines.slice(-4).join("\n"); };
  let v = 0, phase = 0;
  say("› restoring last session: Katherine Lin, portfolio");
  const done = () => { if (!bootRunning) return; bootRunning = false; b.classList.add("out"); step = ""; setStep("hero"); };
  $("#bootSkip").onclick = done;
  if (reduce){ cnt.textContent = "100"; bar.style.width = "100%"; say("› ready"); setTimeout(done, 400); return; }
  const tick = () => {
    if (!bootRunning) return;
    if (phase === 0){ v += 2 + Math.random()*3; if (v >= 62){ v = 62; phase = 1; b.classList.add("glitch"); say("<b>! interrupted at 62%. where was I?</b>"); setTimeout(() => { say("› last checkpoint found: 8 projects, 4 worlds"); setTimeout(() => { say("› next step: meet the work"); b.classList.remove("glitch"); phase = 2; tick(); }, 650); }, 750); }
    } else if (phase === 2){ v += 4; if (v >= 100){ v = 100; cnt.textContent = "100"; bar.style.width = "100%"; setTimeout(done, 350); return; } }
    cnt.textContent = String(Math.floor(v)).padStart(2,"0"); bar.style.width = v + "%";
    if (phase !== 1) setTimeout(tick, 40);
  };
  setTimeout(() => { say("› loading research, prototypes, evidence"); tick(); }, 350);
}

/* clock */
function clock(){ try{ $("#clock").textContent = "Sydney " + new Intl.DateTimeFormat("en-AU",{hour:"2-digit",minute:"2-digit",timeZone:"Australia/Sydney"}).format(new Date()) + " · demo"; }catch(e){} }
clock(); setInterval(clock, 30000);

/* start */
const h = location.hash.slice(1);
if (WORLDS[h]) world = h;
if (innerWidth < 700){ $("#why").classList.add("min"); $("#whyToggle").textContent = "show"; $("#whyToggle").setAttribute("aria-expanded","false"); }
mount();
runBoot();
</script>
</body>
</html>
