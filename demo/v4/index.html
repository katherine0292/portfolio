<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Gallery Walk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/*
  NEXT STEP · v4
  Three modes, one direction of travel:
    1. Gallery  – a lit corridor; every scroll gesture turns one page (one work).
    2. Board    – the Canvas layout: opening title, then a free pan / zoom board grouped by category,
                  with a bottom line. Pushing past the line turns the page.
    3. Closing  – process and contact.
  Warm graphite interior, spotlights; case pages stay on light paper.
  Committed to one look, so colours are explicit rather than theme-switched.
*/
:root{
  --room:#1F1D1B; --ink:#EEE9E1; --dim:#A39C92; --hair:rgba(238,233,225,.14);
  --paper:#F5F2EC; --fg:#161514; --muted:#6E6A64; --line:rgba(22,21,20,.12);
  --warm:255,222,176; --accent:#E9C38A;
  --sans:"Geist", "Helvetica Neue", Arial, sans-serif;
  --serif:"Instrument Serif", "Times New Roman", serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--room); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; overflow:hidden}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:1.5px solid var(--accent); outline-offset:4px}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance}
p,dl,dd{margin:0}
em{font-family:var(--serif); font-style:italic; font-weight:400}
.mono{font-family:var(--mono); font-size:12px; letter-spacing:.04em}
.eyebrow{text-transform:uppercase; letter-spacing:.14em}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:rgb(var(--l,var(--warm))); box-shadow:0 0 10px rgba(var(--l,var(--warm)),.8); flex:none}

/* chrome */
.top{position:fixed; z-index:50; inset:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:calc(14px + env(safe-area-inset-top,0px)) var(--gr) 14px var(--gl); pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-size:14px; text-decoration:none; font-weight:500}
.brand em{font-size:16px; color:var(--dim)}
.where{display:flex; align-items:center; gap:8px; color:var(--dim)}
.clock{justify-self:end; color:var(--dim)}
.rail{position:fixed; z-index:40; right:calc(18px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:grid; gap:12px}
.rail button{display:flex; align-items:center; justify-content:flex-end; gap:10px; font-family:var(--mono); font-size:11px; color:var(--dim)}
.rail button span{opacity:0; transform:translateX(6px); transition:.3s var(--out)}
.rail:hover button span{opacity:1; transform:none}
.rail button i{width:16px; height:1.5px; background:currentColor; opacity:.4; transition:.4s var(--out)}
.rail button.on{color:var(--ink)}
.rail button.on i{width:32px; opacity:1; background:var(--accent)}
.cursor{position:fixed; z-index:96; left:0; top:0; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--ink); pointer-events:none; transition:width .35s var(--out), height .35s var(--out), margin .35s var(--out); display:grid; place-items:center; color:var(--fg); font-family:var(--mono); font-size:11px}
.cursor span{opacity:0; transition:opacity .2s}
.cursor.big{width:84px; height:84px; margin:-42px}
.cursor.big span{opacity:1}
html.case-open .cursor{background:var(--fg); color:var(--paper)}
@media (pointer:coarse){.cursor{display:none}}

/* modes */
.mode{position:fixed; inset:0; opacity:0; visibility:hidden; transition:opacity .9s ease, visibility 0s .9s}
.mode.on{opacity:1; visibility:visible; transition:opacity .9s ease}

/* intro */
.intro{position:fixed; inset:0; z-index:100; background:#100F0E; display:grid; place-items:center; transition:opacity 1.1s ease, visibility 0s 1.1s}
.intro.out{opacity:0; visibility:hidden}
.intro::before{content:""; position:absolute; left:50%; top:0; width:min(900px,140vw); height:100%; transform:translateX(-50%); background:radial-gradient(ellipse 40% 60% at 50% 0, rgba(var(--warm),.22), transparent 70%); opacity:0; transition:opacity .5s}
.intro.on::before{opacity:1}
.intro.flick::before{animation:flick .7s steps(1) 1}
@keyframes flick{0%{opacity:.1}15%{opacity:1}30%{opacity:.05}45%{opacity:.8}60%{opacity:0}80%{opacity:.9}}
.intro .c{position:relative; display:grid; gap:16px; justify-items:center; text-align:center; padding:0 16px}
.intro .nm{font-family:var(--serif); font-size:clamp(52px,9vw,120px); line-height:1; opacity:.15; transition:opacity .8s}
.intro.on .nm{opacity:1}
.intro .ln{width:min(320px,70vw); height:1px; background:rgba(238,233,225,.15); position:relative}
.intro .ln i{position:absolute; inset:0 auto 0 0; width:0; background:rgb(var(--warm)); transition:width .7s var(--ease)}
.intro .lab{color:var(--dim); min-height:1.5em}

/* ═══ 1 · GALLERY ═══ */
.gal{overflow:hidden; perspective:1000px; perspective-origin:50% 46%; background:var(--room)}
.gal::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(circle at 50% 46%, rgba(24,22,20,1) 0, rgba(24,22,20,.85) 5%, rgba(24,22,20,0) 22%)}
.gal::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(12,11,10,.5) 100%)}
.g-room{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.g-yaw{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; z-index:1}
.g-cam{position:absolute; left:0; top:0; transform-style:preserve-3d}
.g-cam > *, .g-seg > *{position:absolute; left:0; top:0}
.g-seg{transform-style:preserve-3d}
.g-floor{background:
  linear-gradient(90deg, transparent calc(50% - 451px), rgba(var(--warm),.32) calc(50% - 451px) calc(50% - 449px), transparent calc(50% - 449px) calc(50% + 449px), rgba(var(--warm),.32) calc(50% + 449px) calc(50% + 451px), transparent calc(50% + 451px)),
  linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px) 0 0 / 100% 400px,
  linear-gradient(90deg, #171614, #1D1B19 30%, #24221F 50%, #1D1B19 70%, #171614)}
.g-ceil{background:#131211}
.g-wall{background:linear-gradient(0deg, rgba(var(--warm),.20) 0 2px, rgba(var(--warm),.05) 2px 36px, transparent 36px), linear-gradient(0deg, #1D1B19, #282522 65%, #221F1C)}
.g-title{width:1600px; margin-left:-800px; text-align:center; display:grid; gap:18px; justify-items:center; pointer-events:none}
.g-title .mono{font-size:17px; color:rgb(var(--l,var(--warm))); letter-spacing:.24em}
.g-title h1, .g-title h2{font-family:var(--serif); font-weight:400; line-height:.88; text-shadow:0 0 70px rgba(var(--l,var(--warm)),.28)}
.g-title h1{font-size:190px}
.g-title h2{font-size:112px}
.g-title p.s{font-size:26px; color:var(--dim)}
.g-cone{width:700px; margin-left:-350px; height:860px; clip-path:polygon(47% 0, 53% 0, 100% 100%, 0 100%); background:linear-gradient(180deg, rgba(var(--l),.20), rgba(var(--l),.05) 65%, rgba(var(--l),0)); pointer-events:none}
.g-pool{width:1000px; height:520px; margin:-260px 0 0 -500px; background:radial-gradient(ellipse at center, rgba(var(--l),.26), rgba(var(--l),.07) 40%, transparent 68%); pointer-events:none}
.g-fix{width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; background:rgb(var(--l)); box-shadow:0 0 26px 6px rgba(var(--l),.5)}
.gal:not(.lit) .g-cone, .gal:not(.lit) .g-pool, .gal:not(.lit) .g-fix{opacity:0 !important}
.g-cone, .g-pool, .g-fix{transition:opacity 1.2s}
.g-art{transform-origin:50% 0; cursor:pointer}
.g-art .bd{background:var(--paper); color:var(--fg); padding:22px 22px 24px; position:relative; box-shadow:0 50px 80px -30px rgba(0,0,0,.7); transition:transform .7s var(--out)}
.g-art .bd::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(var(--l),.14), transparent 35%)}
.g-art:hover .bd{transform:translateY(-14px)}
.g-art img{width:100%; aspect-ratio:16/10; object-fit:cover}
.g-art .cap{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:16px}
.g-art h3{font-family:var(--serif); font-weight:400; font-size:42px; line-height:1}
.g-art.feat h3{font-size:52px}
.g-art .cap .mono{color:var(--muted); text-align:right}
.g-art .badge{position:absolute; top:-14px; left:22px; background:var(--fg); color:var(--paper); font-family:var(--mono); font-size:12px; padding:5px 10px; letter-spacing:.08em}
.g-art .legs{position:absolute; top:100%; left:0; right:0; height:140px; pointer-events:none}
.g-art .legs::before, .g-art .legs::after{content:""; position:absolute; top:0; bottom:0; width:2px; background:#4A453F}
.g-art .legs::before{left:20%} .g-art .legs::after{right:20%}
.g-plan{position:absolute; z-index:5; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:130px; display:grid; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.g-plan .bar, .g-plan .lb{display:grid; grid-template-columns:4fr 4fr 3fr 1.4fr; gap:3px}
.g-plan .bar{position:relative; height:4px}
.g-plan .bar span{background:rgba(var(--l),.35); border-radius:2px}
.g-plan .bar i{position:absolute; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--ink); box-shadow:0 0 12px rgba(var(--warm),.9); transition:left .9s var(--ease)}
.g-hint{position:absolute; z-index:5; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); color:var(--dim); white-space:nowrap; transition:opacity .4s}

/* side card */
.info{position:fixed; z-index:45; top:50%; width:min(390px, 34vw); transform:translateY(-46%); display:grid; gap:14px; padding:24px; border-radius:18px; background:rgba(24,22,20,.86); border:1px solid var(--hair); opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s, transform .7s var(--out)}
.info.r{right:calc(72px + env(safe-area-inset-right,0px))} .info.l{left:calc(40px + env(safe-area-inset-left,0px))}
.info.show{opacity:1; visibility:visible; transition:opacity .45s, transform .7s var(--out); transform:translateY(-50%)}
.info .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--dim)}
.info .feat{margin-left:auto; color:var(--fg); background:rgb(var(--l)); padding:2px 8px; border-radius:999px; font-size:11px}
.info h2{font-family:var(--serif); font-weight:400; font-size:clamp(40px,4vw,58px); line-height:.95}
.info .ln{color:var(--dim); font-size:16px}
.info dl{display:grid; border-top:1px solid var(--hair)}
.info dl div{display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--hair)}
.info dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); padding-top:3px}
.info dd{font-size:14.5px}
.info .go{justify-self:start; display:inline-flex; gap:10px; align-items:center; background:var(--ink); color:var(--fg); padding:11px 18px; border-radius:999px; font-size:14px}
.info .go:hover{background:rgb(var(--l))}
.info > *{transition:opacity .5s, transform .6s var(--out)}
.info:not(.show) > *{opacity:0; transform:translateY(10px)}
.info.show > *:nth-child(2){transition-delay:.05s} .info.show > *:nth-child(3){transition-delay:.1s} .info.show > *:nth-child(4){transition-delay:.15s} .info.show > *:nth-child(5){transition-delay:.2s}
.info.guide{left:calc(40px + env(safe-area-inset-left,0px)); top:auto; bottom:calc(40px + env(safe-area-inset-bottom,0px)); transform:translateY(10px); width:min(420px, calc(100vw - 32px))}
.info.guide.show{transform:none}
.guide ol{list-style:none; margin:0; padding:0; display:grid; border-top:1px solid var(--hair)}
.guide li{display:grid; grid-template-columns:auto 34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hair); font-size:15px}
.guide li small{color:var(--dim); font-family:var(--mono); font-size:11px}
.guide li .f{grid-column:3 / 5; color:var(--dim); font-size:12.5px; margin-top:-4px}
.info.roomc{left:50%; top:auto; bottom:calc(48px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); width:min(560px, calc(100vw - 32px)); text-align:center; justify-items:center}
.info.roomc.show{transform:translate(-50%,0)}

/* ═══ 2 · BOARD (Canvas layout) ═══ */
.cv{overflow:hidden; touch-action:none; cursor:grab; background-color:var(--room); background-image:radial-gradient(circle, rgba(238,233,225,.12) 1px, transparent 1.4px)}
.cv::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 55% at 50% 0, rgba(var(--warm),.08), transparent 70%), radial-gradient(ellipse 75% 70% at 50% 50%, transparent 60%, rgba(12,11,10,.45) 100%)}
.cv.drag{cursor:grabbing}
.cv-plane{position:absolute; left:0; top:0; transform-origin:0 0}
.cv-plane.moving{will-change:transform}
.cb{position:absolute}
.cb-title{width:1500px; padding-top:150px}
.cb-title .mono{font-size:18px; color:var(--dim)}
.cb-title h1{font-size:220px; line-height:.86; letter-spacing:-.065em; margin-top:30px}
.cb-title h1 em{font-size:240px; letter-spacing:-.03em; color:rgb(var(--warm))}
.cb-title p.l{font-size:34px; line-height:1.25; color:var(--dim); max-width:30ch; margin-top:44px; letter-spacing:-.01em}
.cb-go{margin-top:48px; display:inline-flex; gap:14px; align-items:center; background:var(--ink); color:var(--fg); border-radius:999px; padding:22px 34px; font-size:24px}
.cb-sec{width:2900px; display:grid; gap:14px; padding-top:40px; border-top:2px solid rgba(var(--l),.6)}
.cb-sec .mono{font-size:20px; color:rgb(var(--l)); letter-spacing:.24em; display:flex; align-items:center; gap:14px}
.cb-sec .mono .dot{width:14px; height:14px}
.cb-sec h2{font-family:var(--serif); font-weight:400; font-size:150px; line-height:.9}
.cb-sec p{font-size:32px; color:var(--dim); max-width:46ch}
.cb-p{display:flex; gap:56px; align-items:flex-start; cursor:pointer}
.cb-p figure{margin:0; flex:none; width:860px; border-radius:18px; overflow:hidden; box-shadow:0 60px 90px -50px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05); transition:transform .8s var(--out), box-shadow .6s; position:relative}
.cb-p figure img{width:100%; aspect-ratio:16/10; object-fit:cover}
.cb-p figure .badge{position:absolute; top:18px; left:18px; background:rgb(var(--l)); color:var(--fg); font-family:var(--mono); font-size:16px; padding:6px 12px; border-radius:999px}
.cb-p:hover figure{transform:translateY(-12px); box-shadow:0 80px 100px -50px rgba(0,0,0,.85), 0 0 0 2px rgba(var(--l),.6)}
.cb-t{width:480px; flex:none; display:grid; gap:18px}
.cb-t .mono{font-size:15px; color:var(--dim)}
.cb-t h3{font-size:84px; line-height:.92; letter-spacing:-.05em}
.cb-t .ln{font-family:var(--serif); font-size:34px; line-height:1.1; color:rgb(var(--l))}
.cb-t dl{display:grid; border-top:1px solid var(--hair)}
.cb-t dl div{display:grid; grid-template-columns:110px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--hair); font-size:17px}
.cb-t dt{font-family:var(--mono); font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; padding-top:3px}
.cb-t .pr{font-size:19px; color:var(--dim)}
.cb-t ol{list-style:none; margin:0; padding:0}
.cb-t li{display:grid; grid-template-columns:110px 1fr; gap:12px; font-size:17px; border-top:1px solid var(--hair); padding:10px 0}
.cb-t li span{font-family:var(--mono); font-size:13px; color:var(--dim); padding-top:3px}
.cb-st{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--ink); padding-top:14px}
.cb-st b{display:block; font-family:var(--serif); font-weight:400; font-size:52px; line-height:1}
.cb-st span{font-size:13px; color:var(--dim); line-height:1.3; display:block}
.cb-lim{font-size:16px; border-left:2px solid rgb(var(--l)); padding-left:14px}
.cb-open{justify-self:start; font-family:var(--mono); font-size:15px; border:1px solid var(--ink); border-radius:999px; padding:12px 20px}
.cb-open:hover{background:var(--ink); color:var(--fg)}
.cb-end{width:2900px; display:grid; gap:20px; justify-items:center; text-align:center; padding-top:30px; border-top:2px dashed rgba(238,233,225,.35)}
.cb-end .mono{font-size:20px; color:var(--dim); letter-spacing:.2em}
.cb-end p{font-family:var(--serif); font-size:80px; line-height:1}
.cv-chips{position:absolute; z-index:6; top:calc(56px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; border-radius:999px; background:rgba(24,22,20,.86); border:1px solid var(--hair); max-width:calc(100vw - 32px); overflow-x:auto}
.cv-chips button{display:inline-flex; gap:8px; align-items:center; padding:7px 13px; border-radius:999px; font-size:13px; color:var(--dim); white-space:nowrap}
.cv-chips button:hover, .cv-chips button.on{background:var(--ink); color:var(--fg)}
.cv-ui{position:absolute; z-index:6; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:10px; justify-items:end}
.cv-ctl{display:flex; gap:2px; padding:3px; border-radius:999px; background:rgba(24,22,20,.86); border:1px solid var(--hair)}
.cv-ctl button{min-width:34px; height:30px; border-radius:999px; font-family:var(--mono); font-size:12px; padding:0 10px}
.cv-ctl button:hover{background:var(--ink); color:var(--fg)}
.cv-map{position:relative; width:96px; height:144px; border-radius:12px; background:rgba(24,22,20,.86); border:1px solid var(--hair); overflow:hidden; cursor:pointer}
.cv-map i{position:absolute; background:rgba(238,233,225,.18); border-radius:2px}
.cv-map i.s{background:rgba(var(--l),.7)}
.cv-map b{position:absolute; border:1.5px solid var(--ink); border-radius:3px}
.cv-hint{position:absolute; z-index:6; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); color:var(--dim); white-space:nowrap; transition:opacity .5s}
.cv-edge{position:absolute; z-index:6; left:50%; transform:translate(-50%,0); display:grid; gap:8px; justify-items:center; color:var(--ink); opacity:0; transition:opacity .3s; pointer-events:none}
.cv-edge.bot{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.cv-edge.topE{top:calc(110px + env(safe-area-inset-top,0px))}
.cv-edge .track{width:180px; height:2px; background:var(--hair); border-radius:2px; overflow:hidden}
.cv-edge .track i{display:block; height:100%; width:0; background:rgb(var(--warm))}

/* page turn */
.turn{position:fixed; inset:-20vh 0; z-index:80; background:#2A2622; transform:translateY(110%); border-radius:50% 50% 0 0 / 14vh 14vh 0 0; pointer-events:none; transition:transform .85s var(--ease), border-radius .85s var(--ease)}
.turn.in{transform:translateY(0); border-radius:0}
.turn.up{transform:translateY(-110%); border-radius:0 0 50% 50% / 0 0 14vh 14vh}
.turn.noanim{transition:none}

/* ═══ 3 · CLOSING ═══ */
.tail{overflow-y:auto; overscroll-behavior:contain; background:linear-gradient(180deg,#2A2622 0, var(--room) 70vh)}
.wrap{padding-left:var(--gl); padding-right:var(--gr)}
.inner{max-width:1320px; margin:0 auto}
.back{display:inline-flex; gap:10px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--dim); border:1px solid var(--hair); border-radius:999px; padding:8px 14px; margin-top:calc(80px + env(safe-area-inset-top,0px))}
.back:hover{color:var(--ink); border-color:var(--ink)}
.ab{padding-block:60px 60px}
.ab-lead{font-size:clamp(30px,4.4vw,64px); line-height:1.05; letter-spacing:-.035em; max-width:21ch; margin-top:22px}
.ab-steps{list-style:none; margin:64px 0 0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:28px}
.ab-steps li{border-top:1px solid var(--ink); padding-top:16px; display:grid; gap:8px; align-content:start}
.ab-steps span{font-family:var(--mono); font-size:12px; color:var(--dim)}
.ab-steps h3{font-size:22px; letter-spacing:-.02em}

.cs-slots div:first-child{grid-row:span 2}
.cs-live{font-family:var(--mono); font-size:13px; border-bottom:1px solid var(--fg); text-decoration:none; justify-self:start}
.cs-next{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:end; width:100%; text-align:left; padding:48px 0 120px; border-top:1px solid var(--line)}

  .cs-next{grid-template-columns:1fr}
}
@media (max-width:700px){

  .clock{display:none}
  .where{display:none}
  .gal{perspective-origin:50% 34%}

  .info, .info.r, .info.l{left:var(--gl); right:var(--gr); width:auto; top:auto; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateY(12px); padding:16px; gap:10px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}

/* ═════════ 1 · GALLERY ═════════ */
const PERS = 1000, HW = 1000, CH = 860, FLOOR = CH/2, PANEL_BOTTOM = 290, SEGLEN = 1600;
let ITEMS = [], GLEN = 0;
function galPlan(){
  const mob = innerWidth < 700; ITEMS = []; let Z = 600, g = 0;
  ITEMS.push({k:"entrance", Z, D:1650, x:0, yaw:0});
  Z += 1500;
  ROOMS.forEach((r, ri) => {
    r.Z = Z; ITEMS.push({k:"room", r:ri, Z, D:1500, x:0, yaw:0}); Z += 1500;
    P.forEach((p, i) => { if (p.room !== ri) return;
      const side = g++ % 2 ? 1 : -1; p.side = side; p.px = mob ? 0 : side * (p.feat ? 320 : 380); p.Z = Z; p.w = p.feat ? 620 : 520;
      ITEMS.push({k:"panel", i, Z, D: mob ? (p.feat ? 1800 : 1600) : (p.feat ? 1200 : 1100), x:p.px * .25, yaw: mob ? 0 : side * 2.5}); Z += 1400; });
    Z += 200;
  });
  GLEN = Z + 1600;
  ITEMS.forEach(it => it.cz = it.Z - it.D + PERS);
}
function galBuild(){
  galPlan();
  const plane = (cls, w, h, tf, extra="") => `<div class="${cls}" style="width:${w}px;height:${h}px;margin:${-h/2}px 0 0 ${-w/2}px;transform:${tf};${extra}"></div>`;
  let s = "";
  // the corridor is built from short segments so the browser never paints one enormous layer
  s += `<div class="g-title" data-z="600" style="transform:translate3d(0,-250px,-600px)"><p class="mono">SELECTED WORK · 2024 – 2026 · SYDNEY</p><h1>Katherine Lin</h1><p class="s">AI product design · UX research · interaction<br>Three rooms, eight works.</p></div>`;
  s += `<div class="g-fix" data-z="700" style="--l:var(--warm);transform:translate3d(0,${-FLOOR+2}px,-700px) rotateX(-90deg)"></div><div class="g-pool" data-z="700" style="--l:var(--warm);transform:translate3d(0,${FLOOR-1}px,-700px) rotateX(90deg)"></div>`;
  ROOMS.forEach((r, ri) => {
    s += `<div class="g-title" data-z="${r.Z}" style="--l:${r.l};transform:translate3d(0,-345px,${-r.Z}px)"><p class="mono">ROOM ${r.n} · ${P.filter(p=>p.room===ri).length} WORKS</p><h2>${esc(r.name)}</h2></div>`;
    s += `<div class="g-fix" data-z="${r.Z}" style="--l:${r.l};transform:translate3d(0,${-FLOOR+2}px,${-r.Z}px) rotateX(-90deg)"></div><div class="g-pool" data-z="${r.Z}" style="--l:${r.l};transform:translate3d(0,${FLOOR-1}px,${-r.Z}px) rotateX(90deg)"></div>`;
  });
  P.forEach((p, i) => {
    s += `<div class="g-cone" data-z="${p.Z}" style="--l:${L(p)};transform:translate3d(${p.px}px,${-FLOOR}px,${-p.Z - 60}px)"></div>`;
    s += `<div class="g-pool" data-z="${p.Z}" style="--l:${L(p)};transform:translate3d(${p.px}px,${FLOOR-1}px,${-p.Z}px) rotateX(90deg)"></div>`;
    s += `<div class="g-fix" data-z="${p.Z}" style="--l:${L(p)};transform:translate3d(${p.px}px,${-FLOOR+2}px,${-p.Z}px) rotateX(-90deg)"></div>`;
    s += `<div class="g-art${p.feat?" feat":""}" data-i="${i}" style="--l:${L(p)};width:${p.w}px" role="button" tabindex="0" aria-label="Open ${esc(p.title)}">
      <div class="bd">${p.feat ? `<span class="badge">FEATURED</span>` : ""}<img src="${IMG+p.img}" alt="${esc(p.title)}">
      <div class="cap"><h3>${esc(p.title)}</h3><span class="mono">ROOM ${ROOMS[p.room].n}<br>${esc(p.type.split(" · ")[0])}</span></div></div><div class="legs"></div></div>`;
  });
  $("#gCam").innerHTML = s;
  $("#planBar").innerHTML = ROOMS.map(r => `<span style="--l:${r.l}"></span>`).join("") + `<span style="--l:var(--warm)"></span><i id="planDot"></i>`;
  G.arts = $$(".g-art"); G.zs = $$("#gCam [data-z]").filter(el => !el.classList.contains("g-art"));
  G.pose = () => P.map((p,i) => `translate3d(${p.px - p.w/2}px,${PANEL_BOTTOM - G.arts[i].offsetHeight}px,${-p.Z}px) rotateY(${-p.side*9}deg)`);
  const place = () => { const t = G.pose(); G.arts.forEach((a,i) => a.style.transform = t[i]); G.dirty = true; };
  place(); document.fonts?.ready.then(place);
  G.arts.forEach((a,i) => { a.addEventListener("click", () => openCase(i, $("img", a).getBoundingClientRect())); a.addEventListener("keydown", e => { if (e.key === "Enter") openCase(i, $("img", a).getBoundingClientRect()); }); hoverCursor(a, "View"); });
  G.cache = new Map();
}
const G = {s:0, from:0, to:0, t0:0, dur:1, anim:false, push:0, pushFrom:0, pushTo:0, pushT0:0, pushAnim:false, yaw:0, pitch:0, dirty:true, lastK:-1};
const setS = (el, prop, v) => { const key = el; let c = G.cache.get(key); if (!c){ c = {}; G.cache.set(key, c); } if (c[prop] !== v){ c[prop] = v; el.style[prop] = v; } };
function galGo(k, instant){
  k = clamp(k, 0, ITEMS.length - 1);
  if (instant || reduce){ G.s = G.to = k; G.anim = false; G.dirty = true; return; }
  G.from = G.s; G.to = k; G.t0 = performance.now(); G.dur = 1300 + Math.min(1400, Math.max(0, Math.abs(k - G.s) - 1) * 260); G.anim = true;
}
function galPushTo(v){ G.pushFrom = G.push; G.pushTo = v; G.pushT0 = performance.now(); G.pushAnim = true; }
function galFrame(now){
  if (G.anim){ const t = clamp((now - G.t0) / G.dur); G.s = lerp(G.from, G.to, eio(t)); if (t >= 1){ G.anim = false; G.s = G.to; } G.dirty = true; }
  if (G.pushAnim){ const t = clamp((now - G.pushT0) / 1100); G.push = lerp(G.pushFrom, G.pushTo, eio(t)); if (t >= 1) G.pushAnim = false; G.dirty = true; }
  const nx = fine ? (mx / innerWidth - .5) : 0, ny = fine ? (my / innerHeight - .5) : 0;
  const n = ITEMS.length, k0 = Math.min(n - 2, Math.floor(G.s)), fr = clamp(G.s - k0), A = ITEMS[k0], B = ITEMS[k0 + 1];
  const yawT = lerp(A.yaw, B.yaw, fr) + nx * 4, pitchT = -ny * 2.5;
  if (Math.abs(yawT - G.yaw) > .01 || Math.abs(pitchT - G.pitch) > .01){ G.yaw += (yawT - G.yaw) * .06; G.pitch += (pitchT - G.pitch) * .06; G.dirty = true; }
  if (!G.dirty || mode !== "gal" && !G.pushAnim) return;
  G.dirty = false;
  const camZ = lerp(A.cz, B.cz, fr) + G.push * 900, camX = lerp(A.x, B.x, fr);
  $("#gYaw").style.transform = `rotateX(${G.pitch.toFixed(3)}deg) rotateY(${G.yaw.toFixed(3)}deg)`;
  $("#gCam").style.transform = `translate3d(${(-camX).toFixed(1)}px,0,${camZ.toFixed(1)}px)`;
  // only what sits ahead of the viewer, within the fog, is painted
  drawRoom(camX, camZ, G.yaw, G.pitch);
  G.zs.forEach(el => { const D = PERS + +el.dataset.z - camZ; const op = el.classList.contains("g-title") ? clamp((D - 350) / 450) : clamp((D - 200) / 400) * (D < 9000 ? 1 : 0);
    setS(el, "opacity", op.toFixed(2)); setS(el, "visibility", op > .01 ? "visible" : "hidden"); });
  G.arts.forEach((a,i) => { const D = PERS + P[i].Z - camZ; const op = clamp((D - 260) / 340) * (D < 9000 ? 1 : 0); setS(a, "opacity", op.toFixed(2)); setS(a, "visibility", op > .01 ? "visible" : "hidden"); });
  $("#planDot") && ($("#planDot").style.left = (clamp(G.s / (n - 1)) * 76) + "%");
}
function galUI(){
  const k = Math.round(G.to), it = ITEMS[k], info = $("#info");
  const resting = mode === "gal" && !G.anim && !G.pushAnim && introDone && caseIdx < 0;

/* The room shell (floor, walls, ceiling, runway lights) is drawn on a 2D canvas with the same
   projection CSS uses for the panels, so it lines up exactly but costs a few polygons per frame. */
const RC = {ctx:null, w:0, h:0, oy:.46};
function roomSize(){
  const cv = $("#gRoom"), dpr = Math.min(devicePixelRatio || 1, 1.5);
  RC.w = innerWidth; RC.h = innerHeight; cv.width = RC.w * dpr; cv.height = RC.h * dpr;
  RC.ctx = cv.getContext("2d"); RC.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  RC.oy = parseFloat(getComputedStyle($("#gal")).perspectiveOrigin.split(" ")[1]) / RC.h || .46; G.dirty = true;
}
function drawRoom(camX, camZ, yaw, pitch){
  const c = RC.ctx; if (!c) return;
  const W = RC.w, H = RC.h, oy = RC.oy * H, NEAR = PERS - 30;
  const ya = yaw * Math.PI/180, pa = pitch * Math.PI/180, cyw = Math.cos(ya), syw = Math.sin(ya), cp = Math.cos(pa), sp = Math.sin(pa);
  const view = (x, y, Z) => { const X = x - camX, Y = y, Zc = -Z + camZ;
    const x1 = X*cyw + Zc*syw, z1 = -X*syw + Zc*cyw;          // rotateY
    const y2 = Y*cp - z1*sp, z2 = Y*sp + z1*cp;               // rotateX
    return [x1, y2, z2]; };
  const proj = v => { const f = PERS / (PERS - v[2]); return [W/2 + v[0]*f, oy + (H/2 + v[1] - oy)*f]; };
  const poly = (pts, fill) => {
    let vs = pts.map(p => view(p[0], p[1], p[2])), out = [];
    for (let k = 0; k < vs.length; k++){ const a = vs[k], b = vs[(k+1) % vs.length], ina = a[2] < NEAR, inb = b[2] < NEAR;
      if (ina) out.push(a);
      if (ina !== inb){ const t = (NEAR - a[2]) / (b[2] - a[2]); out.push([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, NEAR]); } }
    if (out.length < 3) return;
    c.beginPath(); out.forEach((v, k) => { const q = proj(v); k ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath(); c.fillStyle = fill; c.fill();
  };
  const z0 = camZ - PERS - 400, z1 = camZ + 9000;
  c.fillStyle = "#1A1816"; c.fillRect(0, 0, W, H);

  poly([[-HW,-FLOOR,z0],[-HW,FLOOR,z0],[-HW,FLOOR,z1],[-HW,-FLOOR,z1]], "#24211E");
  poly([[HW,-FLOOR,z0],[HW,FLOOR,z0],[HW,FLOOR,z1],[HW,-FLOOR,z1]], "#24211E");
  poly([[-HW,FLOOR,z0],[HW,FLOOR,z0],[HW,FLOOR,z1],[-HW,FLOOR,z1]], "#191816");
  poly([[-450,FLOOR,z0],[450,FLOOR,z0],[450,FLOOR,z1],[-450,FLOOR,z1]], "#211F1C");
  // wall base glow and runway light strips
  [-HW, HW].forEach(x => { poly([[x,FLOOR-36,z0],[x,FLOOR,z0],[x,FLOOR,z1],[x,FLOOR-36,z1]], "rgba(255,222,176,.05)"); poly([[x,FLOOR-3,z0],[x,FLOOR,z0],[x,FLOOR,z1],[x,FLOOR-3,z1]], "rgba(255,222,176,.28)"); });
  [-450, 450].forEach(x => poly([[x-2,FLOOR,z0],[x+2,FLOOR,z0],[x+2,FLOOR,z1],[x-2,FLOOR,z1]], "rgba(255,222,176,.30)"));
  // floor joints, fading with distance
  for (let Z = Math.ceil(z0 / 400) * 400; Z < z1; Z += 400){ const a = clamp(1 - (Z - camZ) / 7000) * .05; if (a <= .004) continue; poly([[-HW,FLOOR,Z],[HW,FLOOR,Z],[HW,FLOOR,Z+3],[-HW,FLOOR,Z+3]], `rgba(255,255,255,${a.toFixed(3)})`); }
}

/* ═════════ 2 · BOARD (Canvas) ═════════ */
const C = {cam:{x:0,y:0,s:.5}, anim:null, state:"opening", blocks:[], over:0, under:0, lastPan:0, bounds:null, focusI:-1};
function cvBuild(){

    <figure>${p.feat ? `<span class="badge">Featured</span>` : ""}<img src="${IMG+p.img}" alt="${esc(p.title)}"></figure>
    <div class="cb-t"><p class="mono">${pad(i+1)} — ROOM ${ROOMS[p.room].n} · ${esc(p.type)}</p><h3>${esc(p.title)}</h3><p class="ln">${esc(p.line)}</p>
      <dl><div><dt>Context</dt><dd>${esc(p.context)}</dd></div><div><dt>Role</dt><dd>${esc(p.roleS)}</dd></div><div><dt>Stage</dt><dd>${esc(p.stageS)}</dd></div></dl>

      <div class="cb-st">${p.stats.map(s => `<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div>
      <p class="cb-lim">${esc(p.limit)}</p><button class="cb-open" type="button" data-open="${i}">Open full case ↗</button></div></article>`;

    <div class="cb cb-title" data-b="title"><p class="mono eyebrow">AI product design · UX research · interaction · Sydney</p>
      <h1>Katherine Lin<br><em>designs the next step.</em></h1>
      <p class="l">When information is uncertain, an interface gets in the way, or a routine breaks. Eight works in three rooms, laid out on one board.</p>
      <button class="cb-go" type="button" id="cvGo">See the board ↓</button></div>
    ${ROOMS.map((r, ri) => `<div class="cb cb-sec" data-b="sec${ri}" style="--l:${r.l}"><span class="mono"><span class="dot"></span>ROOM ${r.n} · ${P.filter(p=>p.room===ri).length} WORKS</span><h2>${esc(r.name)}</h2><p>${esc(r.look)}</p></div>
      ${P.map((p,i) => p.room === ri ? proj(p,i) : "").join("")}`).join("")}

  $("#cvChips").innerHTML = `<button type="button" data-j="title">Top</button>${ROOMS.map((r,ri) => `<button type="button" data-j="sec${ri}" style="--l:${r.l}"><span class="dot"></span>${r.n} · ${esc(r.short)}</button>`).join("")}<button type="button" data-j="tail">Process & contact ↓</button>`;

  $$("[data-open]", $("#cvPlane")).forEach(b => b.addEventListener("click", e => { e.stopPropagation(); const i = +b.dataset.open; openCase(i, $(`.cb-p[data-i="${i}"] img`).getBoundingClientRect()); }));
  $$(".cb-p").forEach(el => hoverCursor(el, "Zoom"));
  $("#cvGo").addEventListener("click", cvReveal);
  $$("#cvChips button").forEach(b => b.addEventListener("click", () => { const j = b.dataset.j; if (j === "tail") return toTail(); C.state = "free"; cvJump(j); }));

function cvLayout(){
  // title, then for each room: header, then its works in two staggered columns; the end line closes the board
  const el = b => $(`[data-b="${b}"]`, $("#cvPlane"));
  const place = (e, x, y) => { e.style.left = x + "px"; e.style.top = y + "px"; };
  let y = 0; place(el("title"), 0, y); y += el("title").offsetHeight + 420;
  ROOMS.forEach((r, ri) => {
    const sec = el("sec"+ri); place(sec, 0, y); y += sec.offsetHeight + 120;
    const works = $$(".cb-p", $("#cvPlane")).filter(e => P[+e.dataset.i].room === ri);
    let cy = [y, y + 300];
    works.forEach((w, k) => { const col = k % 2; place(w, col ? 1520 : 0, cy[col]); cy[col] += w.offsetHeight + 180; });
    y = Math.max(...cy) + 260;
  });
  place(el("end"), 0, y);
  C.blocks = $$(".cb", $("#cvPlane")).map(e => ({el:e, x:e.offsetLeft, y:e.offsetTop, w:e.offsetWidth, h:e.offsetHeight, b:e.dataset.b || "p", i: e.dataset.i != null ? +e.dataset.i : -1}));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; C.blocks.forEach(b => { x0=Math.min(x0,b.x); y0=Math.min(y0,b.y); x1=Math.max(x1,b.x+b.w); y1=Math.max(y1,b.y+b.h); });
  C.bounds = {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
const vw = () => innerWidth, vh = () => innerHeight;
const cvFit = (r, k=.86) => ({x:r.x + r.w/2, y:r.y + r.h/2, s:Math.min(vw()*k / r.w, vh()*k / r.h)});
const cvBoardScale = () => Math.min(vw() * (vw() < 700 ? .94 : .78) / C.bounds.w, .62);
function cvLimits(s){
  const B = C.bounds, padT = 140 / s, padB = 120 / s;
  let minY = B.y - padT + vh()/2/s, maxY = B.y + B.h + padB - vh()/2/s; if (maxY < minY) maxY = minY = (minY + maxY) / 2;
  let minX = B.x - 160/s + vw()/2/s, maxX = B.x + B.w + 160/s - vw()/2/s; if (maxX < minX) maxX = minX = B.x + B.w/2;
  return {minX, maxX, minY, maxY};
}
function cvFly(to, dur){
  const from = {...C.cam}; const dist = Math.hypot(to.x - from.x, to.y - from.y);
  const k = clamp(dist * Math.min(from.s, to.s) / Math.min(vw(), vh()), 0, 3);
  dur = reduce ? 0 : (dur || 1100 + Math.min(700, dist * .08));
  const t0 = performance.now(); $("#cvPlane").classList.add("moving");
  C.anim = now => { const t = dur ? clamp((now - t0) / dur) : 1, e = eio(t);
    C.cam.x = lerp(from.x, to.x, e); C.cam.y = lerp(from.y, to.y, e);
    C.cam.s = Math.exp(lerp(Math.log(from.s), Math.log(to.s), e)) / (1 + k * .45 * Math.sin(Math.PI * t));
    if (t >= 1){ C.anim = null; $("#cvPlane").classList.remove("moving"); } };
}
function cvReveal(){
  C.state = "free"; $("#cvHint").style.opacity = 0;
  const s = cvBoardScale(); const lim = cvLimits(s);
  cvFly({x:C.bounds.x + C.bounds.w/2, y:lim.minY + 260/s, s}, 1500);
}
function cvJump(b){
  const blk = C.blocks.find(x => x.b === b); if (!blk) return;
  const s = Math.max(C.cam.s, cvBoardScale()); const lim = cvLimits(s);
  cvFly({x:clamp(C.bounds.x + C.bounds.w/2, lim.minX, lim.maxX), y:clamp(blk.y + vh()/2/s - 110/s, lim.minY, lim.maxY), s});
}
function cvFocus(i){ C.focusI = i; const b = C.blocks.find(x => x.i === i); cvFly(cvFit(b, .9)); }
function cvApply(){
  const c = C.cam, R = 140;
  const rub = (-Math.min(C.over, R*2) * .35 + Math.min(C.under, R*2) * .35);
  const tx = vw()/2 - c.x*c.s, ty = vh()/2 - c.y*c.s + rub;
  $("#cvPlane").style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${c.s.toFixed(4)})`;
  let g = 48 * c.s; while (g < 14) g *= 4;
  const cv = $("#cv"); cv.style.backgroundSize = `${g}px ${g}px`; cv.style.backgroundPosition = `${tx}px ${ty}px`;
  const TH = 420;
  $("#edgeBot").style.opacity = C.over > 4 ? 1 : 0; $("#edgeBot i").style.width = clamp(C.over / TH) * 100 + "%";
  $("#edgeTop").style.opacity = C.under > 4 ? 1 : 0; $("#edgeTop i").style.width = clamp(C.under / TH) * 100 + "%";
  if (C.vp){ const B = C.bounds, k = Math.min(96 / B.w, 144 / B.h), ox = (96 - B.w*k)/2, oy = (144 - B.h*k)/2, w = vw()/c.s, h = vh()/c.s;
    Object.assign(C.vp.style, {left:(ox + (c.x - w/2 - B.x)*k)+"px", top:(oy + (c.y - h/2 - B.y)*k)+"px", width:(w*k)+"px", height:(h*k)+"px"}); }
  // section chip follows the view
  let cur = "title"; C.blocks.forEach(b => { if ((b.b === "title" || b.b.startsWith("sec")) && b.y < c.y) cur = b.b; });
  $$("#cvChips button").forEach(b => b.classList.toggle("on", b.dataset.j === cur));
  if (mode === "cv"){ const ri = cur.startsWith("sec") ? +cur.slice(3) : -1; setWhereText(ri >= 0 ? `The board · Room ${ROOMS[ri].n}` : "The board", ri >= 0 ? ROOMS[ri].l : null); rail(ri >= 0 ? "board" : "board"); }
}
function cvDrawMap(){
  const B = C.bounds, k = Math.min(96 / B.w, 144 / B.h), ox = (96 - B.w*k)/2, oy = (144 - B.h*k)/2;
  $("#cvMap").innerHTML = C.blocks.map(b => `<i class="${b.b.startsWith("sec") ? "s" : ""}" style="--l:${b.b.startsWith("sec") ? ROOMS[+b.b.slice(3)].l : "0,0,0"};left:${ox+(b.x-B.x)*k}px;top:${oy+(b.y-B.y)*k}px;width:${Math.max(2,b.w*k)}px;height:${Math.max(2,b.h*k)}px"></i>`).join("") + `<b></b>`;
  C.vp = $("#cvMap b");
}
function cvPan(dx, dy){
  const c = C.cam, lim = cvLimits(c.s);
  c.x = clamp(c.x + dx / c.s, lim.minX, lim.maxX);
  const ny = c.y + dy / c.s;
  if (ny > lim.maxY){ C.over += (ny - lim.maxY) * c.s; c.y = lim.maxY; } else if (ny < lim.minY){ C.under += (lim.minY - ny) * c.s; c.y = lim.minY; } else { c.y = ny; C.over = Math.max(0, C.over - Math.abs(dy)); C.under = Math.max(0, C.under - Math.abs(dy)); }
  C.lastPan = performance.now();
}
function cvZoomAt(px, py, f){
  const c = C.cam, wx = c.x + (px - vw()/2) / c.s, wy = c.y + (py - vh()/2) / c.s;
  const ns = clamp(c.s * f, cvBoardScale() * .6, 2.2); c.x = wx - (px - vw()/2) / ns; c.y = wy - (py - vh()/2) / ns; c.s = ns;
  const lim = cvLimits(ns); c.x = clamp(c.x, lim.minX, lim.maxX); c.y = clamp(c.y, lim.minY, lim.maxY);
}
function cvFrame(now){
  if (mode !== "cv") return;
  if (C.anim) C.anim(now);
  const TH = 420;
  if (now - C.lastPan > 240){
    if (C.over >= TH){ C.over = 0; toTail(); }
    else if (C.under >= TH){ C.under = 0; toGallery(); }
    else { C.over *= .82; C.under *= .82; if (C.over < .5) C.over = 0; if (C.under < .5) C.under = 0; }
  }
  cvApply();
}
function cvInput(){
  const view = $("#cv");
  const pts = new Map(); let moved = 0, pinch = null, lastY = 0;
  view.addEventListener("pointerdown", e => { if (e.target.closest("button,a") || mode !== "cv") return; pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); view.setPointerCapture(e.pointerId); moved = 0; C.anim = null; view.classList.add("drag");
    if (pts.size === 2){ const [a,b] = [...pts.values()]; pinch = {d:Math.hypot(a.x-b.x, a.y-b.y)}; } });
  view.addEventListener("pointermove", e => { const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 2 && pinch){ pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); const [a,b] = [...pts.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y); cvZoomAt((a.x+b.x)/2, (a.y+b.y)/2, d / pinch.d); pinch.d = d; moved = 99; return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y; moved += Math.abs(dx) + Math.abs(dy);
    if (C.state === "opening"){ if (moved > 40 && dy < 0){ pts.clear(); cvReveal(); } return; }
    cvPan(-dx, -dy * (e.pointerType === "touch" ? 1.6 : 1)); pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) view.classList.remove("drag");
    if (moved < 6 && e.type === "pointerup" && C.state === "free"){ const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".cb-p"); if (el){ const i = +el.dataset.i;
      const zoomed = C.cam.s > cvBoardScale() * 1.6;
      if (C.focusI === i && zoomed) openCase(i, $("img", el).getBoundingClientRect()); else cvFocus(i); } } };
  view.addEventListener("pointerup", up); view.addEventListener("pointercancel", up);
  $("#cvFit").addEventListener("click", () => { C.state = "free"; const s = cvBoardScale(); cvFly({x:C.bounds.x + C.bounds.w/2, y:clamp(C.cam.y, cvLimits(s).minY, cvLimits(s).maxY), s}, 700); });
  $("#cvIn").addEventListener("click", () => cvFly({...C.cam, s:Math.min(2.2, C.cam.s*1.6)}, 500));
  $("#cvOut").addEventListener("click", () => cvFly({...C.cam, s:Math.max(cvBoardScale()*.6, C.cam.s/1.6)}, 500));
  $("#cvMap").addEventListener("click", e => { C.state = "free"; const r = $("#cvMap").getBoundingClientRect(), B = C.bounds, k = Math.min(96 / B.w, 144 / B.h), ox = (96 - B.w*k)/2, oy = (144 - B.h*k)/2;
    const s = Math.max(C.cam.s, cvBoardScale()), lim = cvLimits(s); cvFly({x:clamp(B.x + (e.clientX - r.left - ox)/k, lim.minX, lim.maxX), y:clamp(B.y + (e.clientY - r.top - oy)/k, lim.minY, lim.maxY), s}); });
}

/* ═════════ 3 · CLOSING ═════════ */
function tailBuild(){
  $("#tail").innerHTML = `<div class="wrap"><div class="inner">
    <button class="back" type="button" id="backBoard">↑ Back to the board</button>
    <section class="ab" id="s-about"><p class="mono eyebrow" style="color:var(--dim)">Process</p>
      <p class="ab-lead">I design for the moment information is uncertain, an interface gets in the way, or a routine <em>breaks</em>.</p>
      <ol class="ab-steps">
        <li><span>01</span><h3>Research</h3><p>Find where the routine breaks and which cue helps people resume.</p><small>15 interviews · 356 coded entries</small></li>
        <li><span>02</span><h3>Decide</h3><p>Turn evidence into a decision a person can make on the spot.</p><small>“Stay or switch?” at Central</small></li>
        <li><span>03</span><h3>Prototype</h3><p>Build it for real, from SwiftUI to p5.js to Python tooling.</p><small>119 replay tests · 38 screens</small></li>
        <li><span>04</span><h3>Show the evidence</h3><p>Report what was measured, and name what is not proven yet.</p><small>“0 gold items”, stated plainly</small></li>
      </ol>
      <div class="caps"><h3>Capabilities, and where to see them</h3>${CAPS.map(c => `<div class="r"><p>${esc(c[0])}</p><div>${c[1].map(id => { const p = P[idx(id)]; return `<button type="button" data-open="${idx(id)}" style="--l:${L(p)}"><span class="dot"></span>${esc(p.title)}</button>`; }).join("")}</div></div>`).join("")}</div>
    </section>
    <section class="ct" id="s-contact"><p class="mono eyebrow" style="color:var(--dim)">Contact</p>
      <h2 class="ct-h">Let’s talk about<br><em>the next step.</em></h2>
      <div class="ct-row"><a class="ct-btn mag" href="https://github.com/katherine0292" target="_blank" rel="noopener"><i></i>Get in touch</a>
        <a class="ct-link" href="https://github.com/katherine0292" target="_blank" rel="noopener">GitHub ↗</a>
        <button class="ct-link" type="button" id="replay">Walk the gallery again ↺</button></div>
      <div class="ct-foot mono"><span>Shangcheng Lin (Katherine)</span><span>AI product design · UX research · Interaction</span><span>Gallery walk demo · v4</span></div></section>
  </div></div>`;
  $("#backBoard").addEventListener("click", () => toBoard(true));
  $("#replay").addEventListener("click", () => { toGallery(true); galGo(0, true); runIntro(); });
  $$("#tail [data-open]").forEach(b => { b.addEventListener("click", () => openCase(+b.dataset.open, null)); });
  $$(".mag").forEach(m => { if (!fine) return; m.addEventListener("pointermove", e => { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.4}px)`; }); m.addEventListener("pointerleave", () => m.style.transform = ""); });
}

/* ═════════ mode changes ═════════ */
function setMode(m){ mode = m; ["gal","cv","tail"].forEach(id => $("#"+id).classList.toggle("on", id === m)); if (m !== "gal") $("#info").classList.remove("show"); G.dirty = true; }
function toBoard(fromBelow){
  if (fromBelow){ // turn the page back down onto the board, at its end line
    pageTurn(() => { setMode("cv"); C.state = "free"; const s = Math.max(C.cam.s, cvBoardScale()); C.cam = {x:C.bounds.x + C.bounds.w/2, y:cvLimits(s).maxY, s}; C.over = C.under = 0; }, true); return; }
  // from the gallery: walk on through the end of the corridor into the board's opening title
  galPushTo(1);
  setTimeout(() => { setMode("cv"); C.state = "opening"; C.over = C.under = 0; $("#cvHint").style.opacity = 1;
    const t = C.blocks.find(b => b.b === "title"); const f = cvFit(t, .8); C.cam = {...f, s:f.s * 1.08}; cvFly(f, 1200); setWhereText("The board", null); rail("board"); }, reduce ? 0 : 450);
}
function toGallery(instant){
  setMode("gal"); galPushTo(0); if (instant){ G.push = 0; G.pushAnim = false; }
  galGo(ITEMS.length - 1, true); G.lastK = -1;
}
function toTail(){ pageTurn(() => { setMode("tail"); $("#tail").scrollTop = 0; setWhereText("Process & contact", null); rail("tail"); }); }
function pageTurn(mid, reverse){
  const t = $("#turn");
  if (reduce){ mid(); return; }
  // forward: the curtain rises from below and leaves upward; reverse: it falls from above and leaves downward
  t.classList.add("noanim"); t.classList.remove("in","up"); if (reverse) t.classList.add("up"); t.getBoundingClientRect(); t.classList.remove("noanim");
  requestAnimationFrame(() => { t.classList.remove("up"); t.classList.add("in"); });
  setTimeout(() => { mid(); t.classList.remove("in"); if (!reverse) t.classList.add("up"); }, 850);
  setTimeout(() => { t.classList.add("noanim"); t.classList.remove("up","in"); t.getBoundingClientRect(); t.classList.remove("noanim"); }, 1800);
}

/* where / rail */
function setWhereText(t, l){ $("#whereT").textContent = t; $("#where").style.setProperty("--l", l || "var(--warm)"); }
function setWhere(it){
  if (mode !== "gal") return;
  if (it.k === "entrance"){ setWhereText("Entrance", null); rail("g0"); return; }
  const ri = it.k === "room" ? it.r : P[it.i].room; setWhereText(`Room ${ROOMS[ri].n} · ${ROOMS[ri].short}`, ROOMS[ri].l); rail("r" + ri);
}
function rail(g){ $$("#rail button").forEach(b => b.classList.toggle("on", b.dataset.go === g)); }
$$("#rail button").forEach(b => b.addEventListener("click", () => { closeCase(); const g = b.dataset.go;
  if (g === "g0" || g.startsWith("r")){ const k = g === "g0" ? 0 : ITEMS.findIndex(it => it.k === "room" && it.r === +g.slice(1)); if (mode !== "gal") toGallery(true); galGo(k); return; }
  if (g === "board"){ if (mode === "gal") toBoard(); else if (mode === "tail") toBoard(true); return; }
  if (g === "tail" && mode !== "tail") toTail(); }));
$("#brand").addEventListener("click", e => { e.preventDefault(); closeCase(); if (mode !== "gal") toGallery(true); galGo(0); });

/* ═════════ input: one gesture, one page ═════════ */
let wLast = 0, wAcc = 0, wUsed = false, wStepAt = 0, tailUp = 0, tailUpAt = 0;
function step(dir){
  if (mode === "gal"){
    if (G.pushAnim) return;
    const last = ITEMS.length - 1;
    if (dir > 0 && G.to >= last) return toBoard();
    galGo(G.to + dir);
  } else if (mode === "cv" && C.state === "opening"){
    if (dir > 0) cvReveal(); else toGallery();
  }
}
addEventListener("wheel", e => {
  if (caseIdx >= 0 || !introDone) return;
  if (mode === "tail"){
    const t = $("#tail"), now = performance.now(); if (now - tailUpAt > 300) tailUp = 0; tailUpAt = now;
    if (t.scrollTop <= 0 && e.deltaY < 0){ tailUp += -e.deltaY; if (tailUp > 380){ tailUp = 0; toBoard(true); } } else tailUp = 0; return; }
  e.preventDefault();
  if (mode === "cv" && C.state === "free"){
    if (e.ctrlKey || e.metaKey) return cvZoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .01));
    C.anim = null; return cvPan(e.deltaX, e.deltaY);
  }
  const now = performance.now();
  if (now - wLast > 220){ wAcc = 0; wUsed = false; }
  wLast = now;
  if (wUsed && now - wStepAt < 1250) return;
  wAcc += e.deltaY;
  if (Math.abs(wAcc) > 28){ wUsed = true; wStepAt = now; step(Math.sign(wAcc)); wAcc = 0; }
}, {passive:false});
let tY = null;
addEventListener("touchstart", e => { tY = e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => { if (tY == null || caseIdx >= 0 || !introDone) return; const dy = tY - e.changedTouches[0].clientY; tY = null;
  if (mode === "gal" && Math.abs(dy) > 45) step(Math.sign(dy));
  if (mode === "tail" && $("#tail").scrollTop <= 0 && dy < -80) toBoard(true); }, {passive:true});
addEventListener("keydown", e => {
  if (e.key === "Escape") return closeCase();
  if (caseIdx >= 0){ if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ caseIdx = (caseIdx + (e.key === "ArrowRight" ? 1 : 7)) % 8; $("#case").innerHTML = caseHTML(caseIdx); } return; }
  const down = ["ArrowDown","PageDown"," "].includes(e.key), up = ["ArrowUp","PageUp"].includes(e.key);
  if (mode === "gal" || (mode === "cv" && C.state === "opening")){ if (down || up){ e.preventDefault(); step(down ? 1 : -1); } }
  else if (mode === "cv"){ if (down || up){ e.preventDefault(); cvPan(0, (down ? 1 : -1) * vh() * .6); } }
});

/* ═════════ loop ═════════ */
function loop(now){
  requestAnimationFrame(loop);
  cx += (mx-cx)*.3; cy += (my-cy)*.3; curEl.style.transform = `translate(${cx}px,${cy}px)`;
  galFrame(now); if (mode === "gal") galUI(); cvFrame(now);
}

/* intro: lights on, flicker, resume */
function runIntro(){
  closeCase(); introDone = false;
  const it = $("#intro"), bar = $("#inBar"), lab = $("#inLab");
  it.classList.remove("out","on","flick"); bar.style.width = "0"; lab.textContent = "Lighting the gallery";
  $("#gal").classList.remove("lit");
  const fin = () => { it.classList.add("out"); introDone = true; G.lastK = -1; setTimeout(() => $("#gal").classList.add("lit"), 250); };
  if (reduce){ it.classList.add("on"); bar.style.width = "100%"; setTimeout(fin, 300); return; }
  setTimeout(() => { it.classList.add("on"); bar.style.width = "62%"; }, 150);
  setTimeout(() => { it.classList.add("flick"); lab.textContent = "Power interrupted at 62% · resuming"; }, 1000);
  setTimeout(() => { it.classList.remove("flick"); lab.textContent = "Three rooms · eight works"; bar.style.width = "100%"; }, 1800);
  setTimeout(fin, 2500);
}
const clock = () => { try { $("#clock").textContent = "Sydney " + new Intl.DateTimeFormat("en-AU", {hour:"2-digit", minute:"2-digit", timeZone:"Australia/Sydney"}).format(new Date()); } catch(e){} };
clock(); setInterval(clock, 30000);

roomSize(); galBuild(); cvBuild(); cvInput(); tailBuild(); cvDrawMap();
{ const t = C.blocks.find(b => b.b === "title"); C.cam = cvFit(t, .8); }
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const k = G.to; roomSize(); galBuild(); galGo(k, true); cvLayout(); cvDrawMap(); G.lastK = -1; }, 250); });
requestAnimationFrame(loop);
runIntro();
</script>
