<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Exhibition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/*
  NEXT STEP · v3 Exhibition
  Layout: a lit runway gallery in three rooms (one per category), each work stops the camera and
  a side card explains it; the last room folds every work onto one wall, then a flat overview board.
  Palette: warm graphite interior lit by spotlights. The case pages stay on light paper.
  Committed to one look, so colours are explicit rather than theme-switched.
*/
:root{
  --room:#1F1D1B; --wall:#2A2724; --floor:#191816; --ceil:#141312;
  --ink:#EEE9E1; --dim:#A39C92; --hair:rgba(238,233,225,.14);
  --paper:#F5F2EC; --fg:#161514; --muted:#6E6A64; --line:rgba(22,21,20,.12);
  --warm:255,222,176; --accent:#E9C38A;
  --sans:"Geist", "Helvetica Neue", Arial, sans-serif;
  --serif:"Instrument Serif", "Times New Roman", serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--room); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; overflow-x:hidden}
html.lock body{overflow:hidden}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:1.5px solid var(--accent); outline-offset:4px}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance}
p,dl,dd{margin:0}
em{font-family:var(--serif); font-style:italic; font-weight:400}
.mono{font-family:var(--mono); font-size:12px; letter-spacing:.04em}
.eyebrow{text-transform:uppercase; letter-spacing:.14em}
.wrap{padding-left:var(--gl); padding-right:var(--gr)}
.inner{max-width:1320px; margin:0 auto}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:rgb(var(--l,var(--warm))); box-shadow:0 0 10px rgba(var(--l,var(--warm)),.8); flex:none}

/* ── chrome ── */
.top{position:fixed; z-index:50; inset:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:calc(14px + env(safe-area-inset-top,0px)) var(--gr) 14px var(--gl); pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-size:14px; text-decoration:none; font-weight:500}
.brand em{font-size:16px; color:var(--dim)}
.where{display:flex; align-items:center; gap:8px; color:var(--dim); transition:opacity .4s}
.top .clock{justify-self:end; color:var(--dim)}
.rail{position:fixed; z-index:40; right:calc(18px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:grid; gap:12px}
.rail button{display:flex; align-items:center; justify-content:flex-end; gap:10px; font-family:var(--mono); font-size:11px; color:var(--dim)}
.rail button span{opacity:0; transform:translateX(6px); transition:.3s var(--out)}
.rail:hover button span{opacity:1; transform:none}
.rail button i{width:16px; height:1.5px; background:currentColor; opacity:.4; transition:.4s var(--out)}
.rail button.on{color:var(--ink)}
.rail button.on i{width:32px; opacity:1; background:var(--accent)}
.cursor{position:fixed; z-index:96; left:0; top:0; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--ink); pointer-events:none; transition:width .35s var(--out), height .35s var(--out), margin .35s var(--out); display:grid; place-items:center; color:var(--fg); font-family:var(--mono); font-size:11px}
.cursor span{opacity:0; transition:opacity .2s}
.cursor.big{width:84px; height:84px; margin:-42px}
.cursor.big span{opacity:1}
html.lock .cursor{background:var(--fg); color:var(--paper)}
@media (pointer:coarse){.cursor{display:none}}

/* ── intro: lights on, flicker, resume ── */
.intro{position:fixed; inset:0; z-index:100; background:#100F0E; display:grid; place-items:center; transition:opacity 1.2s ease, visibility 0s 1.2s}
.intro.out{opacity:0; visibility:hidden}
.intro::before{content:""; position:absolute; left:50%; top:0; width:min(900px,140vw); height:100%; transform:translateX(-50%); background:radial-gradient(ellipse 40% 60% at 50% 0, rgba(var(--warm),.22), transparent 70%); opacity:0; transition:opacity .5s}
.intro.on::before{opacity:1}
.intro.flick::before{animation:flick .7s steps(1) 1}
@keyframes flick{0%{opacity:.1}15%{opacity:1}30%{opacity:.05}45%{opacity:.8}60%{opacity:0}80%{opacity:.9}}
.intro .c{position:relative; display:grid; gap:16px; justify-items:center; text-align:center; padding:0 16px}
.intro .nm{font-family:var(--serif); font-size:clamp(52px,9vw,120px); line-height:1; opacity:.15; transition:opacity .8s}
.intro.on .nm{opacity:1}
.intro .ln{width:min(320px,70vw); height:1px; background:rgba(238,233,225,.15); position:relative}
.intro .ln i{position:absolute; inset:0 auto 0 0; width:0; background:rgb(var(--warm)); transition:width .7s var(--ease)}
.intro .lab{color:var(--dim); min-height:1.5em}

/* ═══ GALLERY SCENE ═══ */
.g-scroll{position:relative}
.g-sticky{isolation:isolate; position:sticky; top:0; height:100vh; height:100dvh; overflow:hidden; perspective:1000px; perspective-origin:50% 46%; background:var(--room)}
.g-sticky::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(circle at 50% 46%, rgba(26,24,22,1) 0, rgba(26,24,22,.8) 5%, rgba(26,24,22,0) 22%)}
.g-sticky::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, rgba(12,11,10,.55) 100%)}
.flash{position:absolute; inset:0; z-index:3; pointer-events:none; opacity:0; background:radial-gradient(ellipse at 50% 30%, rgba(var(--fl,var(--warm)),.35), rgba(var(--fl,var(--warm)),.05) 70%)}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.g-yaw{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; z-index:1}
.g-cam{position:absolute; left:0; top:0; transform-style:preserve-3d; will-change:transform}
.g-cam > *{position:absolute; left:0; top:0}
.g-floor{background:
  linear-gradient(90deg, transparent calc(50% - 452px), rgba(var(--warm),.55) calc(50% - 452px) calc(50% - 449px), transparent calc(50% - 449px) calc(50% + 449px), rgba(var(--warm),.55) calc(50% + 449px) calc(50% + 452px), transparent calc(50% + 452px)),
  linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, transparent 1px) 0 0 / 100% 700px,
  linear-gradient(90deg, #161513, #1C1A18 28%, #23211E 40%, #26231F 50%, #23211E 60%, #1C1A18 72%, #161513)}
.g-ceil{background:
  linear-gradient(90deg, transparent calc(50% - 402px), #2B2825 calc(50% - 402px) calc(50% - 396px), transparent calc(50% - 396px) calc(50% + 396px), #2B2825 calc(50% + 396px) calc(50% + 402px), transparent calc(50% + 402px)),
  #121110}
.g-wall{background:linear-gradient(0deg, rgba(var(--warm),.28) 0 2px, rgba(var(--warm),.06) 2px 40px, transparent 40px), linear-gradient(0deg, #1E1C19, #292623 60%, #24211E)}
.g-endwall{background:radial-gradient(ellipse 60% 70% at 50% 40%, #3A3530, #2A2622 70%)}
.g-title{width:1600px; margin-left:-800px; text-align:center; display:grid; gap:20px; justify-items:center}
.g-title .mono{font-size:17px; color:var(--dim)}
.g-title h1{font-family:var(--serif); font-weight:400; font-size:190px; line-height:.86; text-shadow:0 0 60px rgba(var(--warm),.25)}
.g-title p.s{font-size:26px; color:var(--dim)}
.g-portal{pointer-events:none}
.g-portal .pc{position:absolute; background:linear-gradient(180deg,#34302B,#2A2622); box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.g-portal .edge{position:absolute; box-shadow:0 0 0 2px rgba(var(--l),.65), 0 0 40px rgba(var(--l),.35), inset 0 0 60px rgba(var(--l),.15)}
.g-portal .sign{position:absolute; left:0; right:0; text-align:center; display:grid; gap:6px; color:var(--ink)}
.g-portal .sign .mono{font-size:18px; color:rgb(var(--l)); letter-spacing:.3em}
.g-portal .sign h2{font-family:var(--serif); font-weight:400; font-size:76px; line-height:1}
.g-portal .num{position:absolute; font-family:var(--serif); font-size:420px; line-height:.8; color:rgba(var(--l),.07); text-align:center}
.g-cone{width:760px; margin-left:-380px; height:900px; clip-path:polygon(47% 0, 53% 0, 100% 100%, 0 100%); background:linear-gradient(180deg, rgba(var(--l),.30), rgba(var(--l),.07) 70%, rgba(var(--l),.02)); filter:blur(8px); pointer-events:none; transition:opacity 1.2s}
.g-pool{width:1100px; height:560px; margin:-280px 0 0 -550px; background:radial-gradient(ellipse at center, rgba(var(--l),.30), rgba(var(--l),.08) 40%, transparent 68%); pointer-events:none; transition:opacity 1.2s}
.g-fix{width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; background:rgb(var(--l)); box-shadow:0 0 30px 8px rgba(var(--l),.55); transition:opacity 1.2s}
.scene:not(.lit) .g-cone, .scene:not(.lit) .g-pool, .scene:not(.lit) .g-fix{opacity:0 !important}
.g-art{transform-origin:50% 0; transform-style:preserve-3d; cursor:pointer}
.g-art .bd{background:var(--paper); color:var(--fg); padding:22px 22px 24px; position:relative; box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 50px 80px -30px rgba(0,0,0,.7), 0 -10px 80px -10px rgba(var(--l),.18); transition:transform .7s var(--out), box-shadow .7s}
.g-art .bd::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(var(--l),.16), transparent 35%, transparent 70%, rgba(0,0,0,.10))}
.g-art:hover .bd{transform:translateY(-14px); box-shadow:0 0 0 1px rgba(255,255,255,.06), 0 70px 90px -30px rgba(0,0,0,.75), 0 -10px 100px -10px rgba(var(--l),.32)}
.g-art img{width:100%; aspect-ratio:16/10; object-fit:cover}
.g-art .cap{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:16px}
.g-art h3{font-family:var(--serif); font-weight:400; font-size:42px; line-height:1}
.g-art .cap .mono{color:var(--muted); text-align:right}
.g-art.feat h3{font-size:54px}
.g-art .badge{position:absolute; top:-14px; left:22px; background:var(--fg); color:var(--paper); font-family:var(--mono); font-size:12px; padding:5px 10px; letter-spacing:.08em}
.g-art .legs{position:absolute; top:100%; left:0; right:0; height:160px; pointer-events:none}
.g-art .legs::before, .g-art .legs::after{content:""; position:absolute; top:0; bottom:0; width:2px; background:linear-gradient(#5A544C,#3A3631)}
.g-art .legs::before{left:20%} .g-art .legs::after{right:20%}
.g-art.board .legs{opacity:0}
.g-head{width:400px; display:grid; gap:4px; pointer-events:none}
.g-head .mono{color:rgb(var(--l)); font-size:13px; letter-spacing:.2em}
.g-head h3{font-family:var(--serif); font-weight:400; font-size:34px; line-height:1}
.g-head.sm h3{display:none}
.g-head.sm .mono{font-size:22px; letter-spacing:.1em}
.g-wash{width:700px; height:900px; margin-left:-350px; background:radial-gradient(ellipse 50% 60% at 50% 0, rgba(var(--l),.22), transparent 70%); pointer-events:none}

/* HUD inside the sticky scene */
.info{position:fixed; z-index:45; top:50%; width:min(390px, 34vw); transform:translateY(-46%); display:grid; gap:14px; padding:24px; border-radius:18px; background:rgba(24,22,20,.84); border:1px solid var(--hair); opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s, transform .7s var(--out)}
.info.r{right:calc(72px + env(safe-area-inset-right,0px))} .info.l{left:calc(40px + env(safe-area-inset-left,0px))}
.info.show{opacity:1; visibility:visible; transition:opacity .45s, transform .7s var(--out); transform:translateY(-50%)}
.info .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--dim)}
.info .feat{margin-left:auto; color:var(--fg); background:rgb(var(--l)); padding:2px 8px; border-radius:999px; font-size:11px}
.info h2{font-family:var(--serif); font-weight:400; font-size:clamp(40px,4vw,58px); line-height:.95}
.info .ln{color:var(--dim); font-size:16px}
.info dl{display:grid; gap:0; border-top:1px solid var(--hair)}
.info dl div{display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--hair)}
.info dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); padding-top:3px}
.info dd{font-size:14.5px}
.info .go{justify-self:start; display:inline-flex; gap:10px; align-items:center; background:var(--ink); color:var(--fg); padding:11px 18px; border-radius:999px; font-size:14px}
.info .go:hover{background:rgb(var(--l))}
.info > *{transition:opacity .5s, transform .6s var(--out)}
.info:not(.show) > *{opacity:0; transform:translateY(10px)}
.info.show > *:nth-child(2){transition-delay:.05s} .info.show > *:nth-child(3){transition-delay:.1s} .info.show > *:nth-child(4){transition-delay:.15s} .info.show > *:nth-child(5){transition-delay:.2s} .info.show > *:nth-child(6){transition-delay:.25s}
.info.guide{left:calc(40px + env(safe-area-inset-left,0px)); top:auto; bottom:calc(40px + env(safe-area-inset-bottom,0px)); transform:translateY(10px); width:min(420px, calc(100vw - 32px))}
.info.guide.show{transform:none}
.guide ol{list-style:none; margin:0; padding:0; display:grid; border-top:1px solid var(--hair)}
.guide li{display:grid; grid-template-columns:auto 34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--hair); font-size:15px}
.guide li small{color:var(--dim); font-family:var(--mono); font-size:11px}
.guide li .f{grid-column:3 / 5; color:var(--dim); font-size:12.5px; margin-top:-4px}
.info.roomc{left:50%; top:auto; bottom:calc(48px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); width:min(560px, calc(100vw - 32px)); text-align:center; justify-items:center}
.info.roomc.show{transform:translate(-50%,0)}
.info.boardc{left:50%; top:auto; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); width:auto; padding:10px 18px; border-radius:999px}
.info.boardc.show{transform:translate(-50%,0)}
.plan{position:absolute; z-index:5; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:120px; display:grid; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.plan .bar{position:relative; height:4px; display:grid; grid-template-columns:3fr 3fr 2fr 1fr; gap:3px}
.plan .bar span{background:rgba(var(--l),.35); border-radius:2px}
.plan .bar i{position:absolute; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--ink); box-shadow:0 0 12px rgba(var(--warm),.9)}
.plan .lb{display:grid; grid-template-columns:3fr 3fr 2fr 1fr; gap:3px}
.hint{position:absolute; z-index:5; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); color:var(--dim); white-space:nowrap; transition:opacity .4s}

/* ═══ OVERVIEW BOARD ═══ */
.ov{position:relative; padding-block:120px 80px; background:linear-gradient(180deg, #2A2622 0, var(--room) 600px)}
.ov-head{display:grid; grid-template-columns:minmax(0,1.2fr) minmax(0,1fr); gap:32px; align-items:end}
.ov-head h2{font-size:clamp(44px,6.4vw,96px); line-height:.92; letter-spacing:-.05em}
.ov-head p{color:var(--dim); max-width:44ch}
.ov-filter{display:flex; flex-wrap:wrap; gap:8px; margin-top:28px}
.ov-filter button{border:1px solid var(--hair); border-radius:999px; padding:8px 14px; font-size:13px; color:var(--dim); display:inline-flex; gap:8px; align-items:center}
.ov-filter button[aria-pressed="true"]{background:var(--ink); color:var(--fg); border-color:var(--ink)}
.ov-cols{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:28px; margin-top:56px; align-items:start}
.ov-col{display:grid; gap:18px; align-content:start; position:relative; padding:24px 18px 18px; border-radius:20px; background:radial-gradient(ellipse 70% 260px at 50% 0, rgba(var(--l),.14), transparent 80%), rgba(255,255,255,.02); border:1px solid var(--hair); transition:opacity .5s, filter .5s}
.ov-col.dim{opacity:.22; filter:grayscale(1)}
.ov-col > header{display:grid; gap:6px; padding-bottom:8px}
.ov-col > header .mono{color:rgb(var(--l)); letter-spacing:.2em; display:flex; align-items:center; gap:8px}
.ov-col > header h3{font-family:var(--serif); font-weight:400; font-size:36px; line-height:1}
.ov-col > header p{color:var(--dim); font-size:14px}
.card{background:var(--paper); color:var(--fg); border-radius:12px; overflow:hidden; display:grid; text-align:left; transition:transform .5s var(--out), box-shadow .5s; box-shadow:0 30px 50px -30px rgba(0,0,0,.8)}
.card:hover{transform:translateY(-6px); box-shadow:0 40px 60px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(var(--l),.6)}
.card img{width:100%; aspect-ratio:16/9; object-fit:cover}
.card .cb{padding:16px 16px 18px; display:grid; gap:8px}
.card .k{display:flex; justify-content:space-between; gap:8px; color:var(--muted)}
.card .k b{font-weight:500; color:var(--fg); background:rgba(var(--l),.9); padding:1px 8px; border-radius:999px}
.card h4{font-size:24px; letter-spacing:-.03em; line-height:1.05}
.card.feat h4{font-size:30px}
.card .ln{font-size:14px; color:var(--muted)}
.card dl{display:grid; border-top:1px solid var(--line); margin-top:4px}
.card dl div{display:grid; grid-template-columns:62px minmax(0,1fr); gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px}
.card dt{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; padding-top:2px}
.card .open{font-family:var(--mono); font-size:12px; margin-top:4px}
.caps{margin-top:72px; border-top:1px solid var(--hair)}
.caps h3{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; padding:20px 0 8px}
.caps .r{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:20px; padding:14px 0; border-bottom:1px solid var(--hair); align-items:center}
.caps .r p{font-size:18px; letter-spacing:-.01em}
.caps .r div{display:flex; flex-wrap:wrap; gap:8px}
.caps .r button{border:1px solid var(--hair); border-radius:999px; padding:5px 12px; font-size:13px; display:inline-flex; align-items:center; gap:8px}
.caps .r button:hover{border-color:var(--ink)}

/* process + contact */
.ab{padding-block:120px 60px}
.ab-lead{font-size:clamp(28px,4vw,56px); line-height:1.06; letter-spacing:-.035em; max-width:21ch; margin-top:22px}
.ab-steps{list-style:none; margin:64px 0 0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:28px}
.ab-steps li{border-top:1px solid var(--ink); padding-top:16px; display:grid; gap:8px; align-content:start}
.ab-steps span{font-family:var(--mono); font-size:12px; color:var(--dim)}
.ab-steps h3{font-size:22px; letter-spacing:-.02em}
.ab-steps p{color:var(--dim); font-size:15px}
.ab-steps small{font-family:var(--mono); font-size:11.5px; color:var(--accent)}
.ct{padding-block:80px 120px}
.ct-h{font-size:clamp(52px,10vw,160px); line-height:.9; letter-spacing:-.055em; margin-top:20px}
.ct-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; margin-top:44px}
.ct-btn{display:inline-flex; align-items:center; gap:12px; background:var(--ink); color:var(--fg); text-decoration:none; padding:18px 26px; border-radius:999px; transition:transform .4s var(--out)}
.ct-btn i{width:8px; height:8px; border-radius:50%; background:#C48A3A}
.ct-link{font-family:var(--mono); font-size:13px; text-decoration:none; border-bottom:1px solid var(--hair); padding-bottom:2px}
.ct-foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:90px; color:var(--dim); border-top:1px solid var(--hair); padding-top:16px}

/* ═══ CASE · light paper, same template for every project ═══ */
.case{position:fixed; inset:0; z-index:70; overflow-y:auto; overscroll-behavior:contain; background:var(--paper); color:var(--fg); opacity:0; visibility:hidden; transition:opacity .5s, visibility 0s .6s; color-scheme:light}
.case.open{opacity:1; visibility:visible; transition:opacity .5s}
.cs{padding:0 var(--gr) 0 var(--gl)}
.cs-in{max-width:1180px; margin:0 auto}
.cs-bar{position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px; background:var(--paper)}
.cs-bar .mono{color:var(--muted); display:flex; align-items:center; gap:8px}
.cs-bar .nav{display:flex; gap:6px}
.cs-bar button{border:1px solid var(--line); border-radius:999px; height:36px; min-width:36px; padding:0 14px; font-family:var(--mono); font-size:12px}
.cs-bar button:hover{background:var(--fg); color:var(--paper)}
.cs-cover{margin:18px 0 0; border-radius:16px; overflow:hidden; background:#ddd}
.cs-cover img{width:100%; aspect-ratio:2/1; object-fit:cover}
.cs-head{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:40px; align-items:end; padding:48px 0 40px}
.cs-head h1{font-size:clamp(56px,9vw,150px); line-height:.86; letter-spacing:-.065em}
.cs-head .ln{font-family:var(--serif); font-size:clamp(26px,2.8vw,40px); line-height:1.1; margin-top:20px; max-width:20ch}
.cs-meta div{display:grid; grid-template-columns:90px minmax(0,1fr); gap:12px; border-top:1px solid var(--line); padding:10px 0}
.cs-meta dt{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); padding-top:3px}
.cs-meta dd{font-size:15px}
.cs-row{display:grid; grid-template-columns:220px minmax(0,1fr); gap:32px; padding:40px 0; border-top:1px solid var(--line)}
.cs-row h4{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:400}
.cs-row .big{font-size:clamp(22px,2.4vw,32px); line-height:1.25; letter-spacing:-.02em; max-width:34ch}
.cs-dec{list-style:none; margin:0; padding:0}
.cs-dec li{display:grid; grid-template-columns:40px 140px minmax(0,1fr); gap:16px; padding:16px 0; border-bottom:1px solid var(--line); font-size:19px; align-items:baseline}
.cs-dec li span{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-dec li b{font-weight:500; font-size:13px; font-family:var(--mono); color:#8A5A1E}
.cs-st{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
.cs-st b{display:block; font-family:var(--serif); font-weight:400; font-size:clamp(52px,6vw,92px); line-height:.9}
.cs-st span{color:var(--muted); font-size:14px; display:block; margin-top:8px}
.cs-lim{font-size:19px; max-width:52ch; border-left:2px solid #C48A3A; padding-left:16px}
.cs-slots{display:grid; grid-template-columns:2fr 1fr; grid-auto-rows:180px; gap:12px}
.cs-slots div{border:1px dashed rgba(22,21,20,.25); border-radius:14px; display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; padding:8px}
.cs-slots div:first-child{grid-row:span 2}
.cs-live{font-family:var(--mono); font-size:13px; border-bottom:1px solid var(--fg); text-decoration:none; justify-self:start}
.cs-next{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:end; width:100%; text-align:left; padding:48px 0 120px; border-top:1px solid var(--line)}
.cs-next small{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-next strong{display:block; font-weight:500; font-size:clamp(40px,6vw,96px); line-height:.9; letter-spacing:-.055em; transition:transform .6s var(--out)}
.cs-next:hover strong{transform:translateX(16px)}
.cs-next img{border-radius:10px; aspect-ratio:4/3; object-fit:cover}
.case.open .rv{animation:rise 1s var(--out) both; animation-delay:calc(var(--d,0) * 70ms + 300ms)}
@keyframes rise{from{opacity:0; transform:translateY(46px)}}
.flip{position:fixed; z-index:95; object-fit:cover; pointer-events:none; transition:left .95s var(--ease), top .95s var(--ease), width .95s var(--ease), height .95s var(--ease), border-radius .95s var(--ease)}

@media (max-width:1000px){
  .ov-cols{grid-template-columns:1fr; gap:22px}
  .ov-head{grid-template-columns:1fr}
  .ab-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{display:none}
  .cs-head{grid-template-columns:1fr}
  .cs-row{grid-template-columns:1fr; gap:14px}
  .cs-st{grid-template-columns:1fr}
  .cs-dec li{grid-template-columns:32px minmax(0,1fr)}
  .cs-dec li b, .cs-dec li em{grid-column:2}
  .cs-next{grid-template-columns:1fr}
  .caps .r{grid-template-columns:1fr; gap:10px}
}
@media (max-width:700px){
  .top{grid-template-columns:1fr auto}
  .top .clock{display:none}
  .g-sticky{perspective-origin:50% 34%}
  .g-sticky::before{background:radial-gradient(circle at 50% 34%, rgba(26,24,22,1) 0, rgba(26,24,22,.8) 5%, rgba(26,24,22,0) 22%)}
  .info, .info.r, .info.l{left:var(--gl); right:var(--gr); width:auto; top:auto; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateY(12px); padding:16px; gap:10px}
  .info.show{transform:none}
  .info h2{font-size:36px}
  .info dl div:nth-child(n+3){display:none}
  .info.guide{bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  .info.roomc, .info.boardc{left:var(--gl); right:var(--gr); width:auto; transform:translateY(10px)}
  .info.roomc.show, .info.boardc.show{transform:none}
  .plan, .hint{display:none}
  .ab-steps{grid-template-columns:1fr}
  .cs-slots{grid-template-columns:1fr; grid-auto-rows:120px}
  .cs-slots div:first-child{grid-row:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>

 {id:"wildling", room:0, title:"Wildling", line:"Meet a creature whose choices you can understand.",

const $$ = (s,r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

        <div class="k mono"><span>${esc(p.type)}</span>${p.feat?"<b>Featured</b>":""}</div><h4>${esc(p.title)}</h4><p class="ln">${esc(p.line)}</p>
        <dl><div><dt>Context</dt><dd>${esc(p.context)}</dd></div><div><dt>Role</dt><dd>${esc(p.roleS)}</dd></div><div><dt>Stage</dt><dd>${esc(p.stageS)}</dd></div></dl>
        <span class="open">Case study →</span></div></button>`).join("")}</div>`).join("")}</div>
    <div class="caps"><h3>Capabilities, and where to see them</h3>${CAPS.map(c => `<div class="r"><p>${esc(c[0])}</p><div>${c[1].map(id => { const p = P[idx(id)]; return `<button type="button" data-open="${idx(id)}" style="--l:${L(p)}"><span class="dot"></span>${esc(p.title)}</button>`; }).join("")}</div></div>`).join("")}</div>
  </div></section>`;
}
const aboutHTML = () => `<section class="ab wrap" data-step="about" id="s-about"><div class="inner">
  <p class="mono eyebrow" style="color:var(--dim)">Process</p>
  <p class="ab-lead">I design for the moment information is uncertain, an interface gets in the way, or a routine <em>breaks</em>.</p>
  <ol class="ab-steps">
    <li><span>01</span><h3>Research</h3><p>Find where the routine breaks and which cue helps people resume.</p><small>15 interviews · 356 coded entries</small></li>
    <li><span>02</span><h3>Decide</h3><p>Turn evidence into a decision a person can make on the spot.</p><small>“Stay or switch?” at Central</small></li>
    <li><span>03</span><h3>Prototype</h3><p>Build it for real, from SwiftUI to p5.js to Python tooling.</p><small>119 replay tests · 38 screens</small></li>
    <li><span>04</span><h3>Show the evidence</h3><p>Report what was measured, and name what is not proven yet.</p><small>“0 gold items”, stated plainly</small></li>
  </ol></div></section>`;
const contactHTML = () => `<section class="ct wrap" data-step="contact" id="s-contact"><div class="inner">
  <p class="mono eyebrow" style="color:var(--dim)">Contact</p>
  <h2 class="ct-h">Let’s talk about<br><em>the next step.</em></h2>
  <div class="ct-row"><a class="ct-btn mag" href="https://github.com/katherine0292" target="_blank" rel="noopener"><i></i>Get in touch</a>
    <a class="ct-link" href="https://github.com/katherine0292" target="_blank" rel="noopener">GitHub ↗</a>
    <button class="ct-link" type="button" id="replay">Walk the exhibition again ↺</button></div>
  <div class="ct-foot mono"><span>Shangcheng Lin (Katherine)</span><span>AI product design · UX research · Interaction</span><span>Exhibition demo · v3</span></div>
</div></section>`;

function build(){
  const SEG = innerHeight * 1.05;
  $("#stage").innerHTML = `<section class="g-scroll" id="gScroll" style="height:${(ITEMS.length-1)*SEG + innerHeight}px">
    <div class="g-sticky scene" id="scene">
      <div class="g-yaw" id="gYaw"><div class="g-cam" id="gCam">${sceneHTML()}</div></div>
      <div class="flash" id="flash"></div>
      <div class="plan" aria-hidden="true"><div class="lb"><span>I</span><span>II</span><span>III</span><span>All</span></div><div class="bar">${ROOMS.map(r=>`<span style="--l:${r.l}"></span>`).join("")}<span style="--l:var(--warm)"></span><i id="planDot"></i></div></div>
      <p class="hint mono" id="hint">Scroll to walk ↓</p>
    </div></section>${overviewHTML()}${aboutHTML()}${contactHTML()}`;
  return SEG;
}

/* ── case (light paper template) ── */
function caseHTML(i){
  const p = P[i], n = P[(i+1)%P.length], r = ROOMS[p.room];
  return `<div class="cs"><div class="cs-in">
  <div class="cs-bar"><span class="mono" style="--l:${r.l}"><span class="dot"></span>Room ${r.n} · ${esc(r.name)} · ${pad(i+1)} / 08</span>
    <div class="nav"><button type="button" data-go="${(i+7)%8}" aria-label="Previous project">←</button><button type="button" data-go="${(i+1)%8}" aria-label="Next project">→</button><button type="button" data-close>Back to exhibition</button></div></div>
  <figure class="cs-cover"><img src="${IMG+p.img}" alt="${esc(p.title)}"></figure>
  <header class="cs-head"><div><h1 class="rv">${esc(p.title)}</h1><p class="ln rv" style="--d:1">${esc(p.line)}</p></div>
    <dl class="cs-meta rv" style="--d:2"><div><dt>Type</dt><dd>${esc(p.type)}</dd></div><div><dt>Context</dt><dd>${esc(p.context)}</dd></div><div><dt>Role</dt><dd>${esc(p.role)}</dd></div><div><dt>Tools</dt><dd>${esc(p.tools)}</dd></div><div><dt>Stage</dt><dd>${esc(p.stage)}</dd></div></dl></header>
  <section class="cs-row rv" style="--d:3"><h4>01 · Problem</h4><p class="big">${esc(p.problem)}</p></section>
  <section class="cs-row rv" style="--d:4"><h4>02 · Decisions</h4><ol class="cs-dec">${p.decisions.map((d,k)=>`<li><span>${pad(k+1)}</span><b>${esc(d[0])}</b><em style="font-family:var(--sans);font-style:normal">${esc(d[1])}</em></li>`).join("")}</ol></section>
  <section class="cs-row rv" style="--d:5"><h4>03 · Evidence</h4><div class="cs-st">${p.stats.map(s=>`<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div></section>
  <section class="cs-row rv" style="--d:6"><h4>04 · Not yet proven</h4><p class="cs-lim">${esc(p.limit)}</p></section>
  <section class="cs-row rv" style="--d:7"><h4>05 · Media slots</h4><div style="display:grid;gap:16px"><div class="cs-slots"><div>Prototype film<br>16:9 autoplay, muted</div><div>Before / after</div><div>Process wall</div></div><a class="cs-live" href="${p.live}" target="_blank" rel="noopener">Open the live project ↗</a></div></section>
  <button class="cs-next" type="button" data-go="${(i+1)%8}"><span><small>Next work · Room ${ROOMS[n.room].n}</small><strong>${esc(n.title)} →</strong></span><img src="${IMG+n.img}" alt=""></button>
  </div></div>`;
}
function openCase(i, rect){
  caseIdx = i; const c = $("#case");
  c.innerHTML = caseHTML(i); c.scrollTop = 0;
  document.documentElement.classList.add("lock");
  cursor(false);
  requestAnimationFrame(() => {
    c.classList.add("open");
    const cover = $(".cs-cover img", c);
    if (rect && !reduce){
      cover.style.opacity = 0;
      const r2 = cover.getBoundingClientRect();
      const fl = new Image(); fl.src = IMG + P[i].img; fl.className = "flip"; fl.alt = "";
      Object.assign(fl.style, {left:rect.left+"px", top:rect.top+"px", width:rect.width+"px", height:rect.height+"px", borderRadius:"4px"});
      document.body.appendChild(fl); fl.getBoundingClientRect();
      Object.assign(fl.style, {left:r2.left+"px", top:r2.top+"px", width:r2.width+"px", height:r2.height+"px", borderRadius:"16px"});
      setTimeout(() => { cover.style.opacity = 1; fl.remove(); }, 980);
    }
    setTimeout(() => $("[data-close]", c)?.focus({preventScroll:true}), 60);
  });
}
function closeCase(){ if (caseIdx < 0) return; $("#case").classList.remove("open"); document.documentElement.classList.remove("lock"); caseIdx = -1; }
$("#case").addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ caseIdx = +g.dataset.go; $("#case").innerHTML = caseHTML(caseIdx); $("#case").scrollTop = 0; return; }
  if (e.target.closest("[data-close]")) closeCase();
});

/* ── cursor ── */
const curEl = $("#cursor"); let mx = innerWidth/2, my = innerHeight/2, cx = mx, cy = my;
addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; }, {passive:true});
function cursor(big, label){ curEl.classList.toggle("big", !!big); if (label) $("#curLab").textContent = label; }
(function loop(){ cx += (mx-cx)*.3; cy += (my-cy)*.3; curEl.style.transform = `translate(${cx}px,${cy}px)`; requestAnimationFrame(loop); })();

/* ── the walk ── */
let SEG, raf, sNow = 0, sTarget = 0, lastK = -1, showK = -1, curRoom = -1, board = null, ac;
function boardLayout(){
  const vw = innerWidth, vh = innerHeight, mob = vw < 700;
  const W = Math.min(vw * (mob ? .94 : .86), 1460), gap = mob ? 10 : 40, cw = (W - gap*2) / 3;
  const topY = -vh/2 + (mob ? 120 : 150), headH = mob ? 34 : 74, avail = vh - (mob ? 120 : 150) - (mob ? 110 : 80) - headH;
  const arts = $$(".g-art"), cols = [[],[],[]];
  P.forEach((p,i) => cols[p.room].push(i));
  let need = 0;
  const sz = cols.map(col => { let h = 0; col.forEach((i,k) => { const s = cw / P[i].w; h += arts[i].offsetHeight * s + (k ? 14 : 0); }); need = Math.max(need, h); return h; });
  const f = Math.min(1, avail / need);
  const out = [];
  cols.forEach((col, c) => {
    const cxm = -W/2 + cw/2 + c*(cw+gap); let y = topY + headH;
    col.forEach(i => { const s = cw / P[i].w * f; out[i] = {x: cxm - P[i].w/2, y, z:-ZB, ry:0, s}; y += arts[i].offsetHeight * s + 14*f; });
    const hd = $(`.g-head[data-r="${c}"]`); hd.classList.toggle("sm", mob); hd.style.width = (mob ? cw / .45 : cw) + "px"; hd.style.transform = `translate3d(${cxm - cw/2}px,${topY}px,${-ZB + 2}px) scale(${mob ? .45 : 1})`; hd.style.transformOrigin = "0 0";
    $(`.g-wash[data-r="${c}"]`).style.transform = `translate3d(${cxm}px,${-CH/2}px,${-ZB + 1}px)`;
  });
  return out;
}
function start(){
  ac?.abort(); ac = new AbortController(); const signal = ac.signal;
  cancelAnimationFrame(raf);
  plan(); SEG = build();
  const sec = $("#gScroll"), cam = $("#gCam"), yawEl = $("#gYaw"), arts = $$(".g-art"), info = $("#info");
  const portals = $$(".g-portal"), ents = $$(".g-ent");
  const cones = $$(".g-cone[data-i]"), pools = $$(".g-pool[data-i]"), fixes = $$(".g-fix[data-i]"), heads = $$(".g-head"), washes = $$(".g-wash"), title = $("#gTitle");
  const corridor = () => P.map((p,i) => ({x:p.px - p.w/2, y:PANEL_BOTTOM - arts[i].offsetHeight, z:-p.Z, ry:-p.side*8, s:1}));
  let C = corridor(); board = boardLayout();
  document.fonts?.ready.then(() => { C = corridor(); board = boardLayout(); });
  if (introDone) $("#scene").classList.add("lit");
  const scrollToStop = (k, smooth=true) => scrollTo({top: sec.offsetTop + k * SEG, behavior: smooth && !reduce ? "smooth" : "auto"});
  const onScroll = () => { const r = sec.getBoundingClientRect(); sTarget = clamp(-r.top / SEG, 0, ITEMS.length - 1); };
  addEventListener("scroll", onScroll, {signal, passive:true}); onScroll(); sNow = sTarget;
  // soft snap: each scroll lands on the next stop, like turning a page
  let snapT;
  addEventListener("scroll", () => { clearTimeout(snapT); snapT = setTimeout(() => {
    if (caseIdx >= 0) return; const r = sec.getBoundingClientRect(); if (r.bottom < innerHeight * .9) return;
    const s = -r.top / SEG, k = Math.round(s); if (k < 0 || k > ITEMS.length - 1) return;
    if (Math.abs(s - k) > .015 && Math.abs(s - k) < .45) scrollToStop(k); }, 170); }, {signal, passive:true});
  const openFrom = i => openCase(i, $("img", arts[i]).getBoundingClientRect());
  arts.forEach((a,i) => { a.addEventListener("click", () => openFrom(i), {signal}); a.addEventListener("keydown", e => { if (e.key === "Enter") openFrom(i); }, {signal});
    a.addEventListener("pointerenter", () => cursor(true, "View"), {signal}); a.addEventListener("pointerleave", () => cursor(false), {signal}); });
  $$("[data-open]").forEach(b => { b.addEventListener("click", () => { const im = $("img", b); openCase(+b.dataset.open, im ? im.getBoundingClientRect() : null); }, {signal});
    b.addEventListener("pointerenter", () => cursor(true, "Open"), {signal}); b.addEventListener("pointerleave", () => cursor(false), {signal}); });
  $$(".ov-filter button").forEach(b => b.addEventListener("click", () => { const f = +b.dataset.f;
    $$(".ov-filter button").forEach(x => x.setAttribute("aria-pressed", x === b)); $$(".ov-col").forEach(c => c.classList.toggle("dim", f >= 0 && +c.dataset.r !== f)); }, {signal}));
  $("#replay").addEventListener("click", () => { scrollTo(0,0); runIntro(); }, {signal});
  $$(".mag").forEach(m => { if (!fine) return; m.addEventListener("pointermove", e => { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.4}px)`; }, {signal}); m.addEventListener("pointerleave", () => m.style.transform = "", {signal}); });
  // rail
  $$("#rail button").forEach(b => b.addEventListener("click", () => { closeCase(); const g = b.dataset.go;
    if (g === "entrance") return scrollToStop(0);
    if (g.startsWith("room")) return scrollToStop(ITEMS.findIndex(it => it.k === "room" && it.r === +g.slice(4)));
    if (g === "board") return scrollToStop(ITEMS.length - 1);
    $("#s-" + g)?.scrollIntoView({behavior: reduce ? "auto" : "smooth"}); }, {signal}));
  const rail = g => $$("#rail button").forEach(b => b.classList.toggle("on", b.dataset.go === g));
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) rail(e.target.dataset.step === "board" ? "board" : e.target.dataset.step); }), {rootMargin:"-50% 0px -50% 0px"});
  $$("#stage .ab, #stage .ct, #s-over").forEach(s => io.observe(s));
  signal.addEventListener("abort", () => io.disconnect());
  addEventListener("keydown", e => { if (e.key === "Escape") closeCase();
    if (caseIdx < 0 && (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "ArrowUp" || e.key === "PageUp")){ const r = sec.getBoundingClientRect(); const s = -r.top / SEG;
      if (s >= -.1 && s <= ITEMS.length - 1.1 && !(e.key.endsWith("Up") && s < .1)){ e.preventDefault(); scrollToStop(clamp(Math.round(s) + (e.key.endsWith("Down") ? 1 : -1), 0, ITEMS.length - 1)); } }
    if (caseIdx >= 0 && (e.key === "ArrowRight" || e.key === "ArrowLeft")){ caseIdx = (caseIdx + (e.key === "ArrowRight" ? 1 : 7)) % 8; $("#case").innerHTML = caseHTML(caseIdx); } }, {signal});
  let tb = 0, yaw = 0, pitch = 0, prevCam = 0, last = performance.now();
  const tf = o => `translate3d(${o.x}px,${o.y}px,${o.z}px) rotateY(${o.ry}deg) scale(${o.s})`;
  const frame = now => {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(.1, (now - last) / 1000) * 60; last = now;
    sNow += (sTarget - sNow) * (reduce ? 1 : 1 - Math.pow(1 - .1, dt));
    const n = ITEMS.length, k0 = Math.min(n - 2, Math.floor(sNow)), fr = clamp(sNow - k0), e = sstep(fr), A = ITEMS[k0], B = ITEMS[k0 + 1];
    const camZ = lerp(A.cz, B.cz, e), camX = lerp(A.x, B.x, e), yawS = lerp(A.yaw, B.yaw, e);
    tb = B.k === "board" ? eio(clamp((fr - .25) / .75)) : (A.k === "board" ? 1 : 0);
    const nx = fine ? (mx / innerWidth - .5) : 0, ny = fine ? (my / innerHeight - .5) : 0;
    const k = 1 - Math.pow(1 - .06, dt);
    yaw += ((yawS + nx * 5) * (1 - tb) - yaw) * k; pitch += ((-ny * 3) * (1 - tb) - pitch) * k;
    yawEl.style.transform = `rotateX(${pitch}deg) rotateY(${yaw}deg)`;
    cam.style.transform = `translate3d(${-camX}px,0,${camZ}px)`;
    // works: corridor pose → board pose
    arts.forEach((a,i) => {
      const t = eio(clamp((tb - i*.03) / (1 - 7*.03)));
      const c = C[i], b = board[i] || c;
      const o = {x:lerp(c.x,b.x,t), y:lerp(c.y,b.y,t), z:lerp(c.z,b.z,t), ry:lerp(c.ry,b.ry,t), s:lerp(c.s,b.s,t)};
      a.style.transform = tf(o);
      const D = PERS - o.z - camZ; const op = clamp((D - 260) / 340);
      a.style.opacity = op; a.style.visibility = op < .01 ? "hidden" : "visible";
      a.classList.toggle("board", t > .5);
      const lo = (1 - tb) * clamp((PERS + P[i].Z - camZ - 200) / 400);
      const vis = lo > .01 && PERS + P[i].Z - camZ > 120 ? "visible" : "hidden";
      [cones[i], pools[i], fixes[i]].forEach(el => { el.style.opacity = lo; el.style.visibility = vis; });
    });
    heads.forEach(h => h.style.opacity = clamp((tb - .55) / .45)); washes.forEach(w => w.style.opacity = tb);
    const tOp = clamp((PERS + 600 - camZ - 300) / 500); title.style.opacity = tOp; title.style.visibility = tOp > .01 ? "visible" : "hidden";
    ents.forEach(el => el.style.visibility = PERS + 700 - camZ > 120 ? "visible" : "hidden");
    portals.forEach(el => el.style.visibility = PERS + +el.dataset.z - camZ > 40 ? "visible" : "hidden");
    // crossing a doorway changes the room light
    ROOMS.forEach((r, ri) => { const at = r.Z + PERS - 200; if ((prevCam < at && camZ >= at) || (prevCam >= at && camZ < at)){ const fl = $("#flash"); fl.style.setProperty("--fl", camZ >= at ? r.l : (ri ? ROOMS[ri-1].l : "255,222,176")); fl.classList.remove("go"); void fl.offsetWidth; if (!reduce) fl.classList.add("go"); } });
    prevCam = camZ;
    let room = -1; ROOMS.forEach((r, ri) => { if (camZ > r.Z - 1400) room = ri; }); if (B.k === "board" && fr > .5 || A.k === "board") room = 3;
    if (room !== curRoom){ curRoom = room; $("#whereT").textContent = room < 0 ? "Entrance" : room === 3 ? "Overview · all rooms" : `Room ${ROOMS[room].n} · ${ROOMS[room].short}`; $("#where").style.setProperty("--l", room >= 0 && room < 3 ? ROOMS[room].l : "var(--warm)"); }
    $("#planDot").style.left = (clamp(sNow / (n - 1)) * 100) + "%";
    // side card: visible only while the camera rests at a stop
    const kN = Math.round(sNow), rest = Math.abs(sNow - kN) < .2 && introDone && caseIdx < 0;
    const secR = sec.getBoundingClientRect(); const inScene = secR.bottom > innerHeight * .6;
    if (kN !== lastK){ lastK = kN; renderInfo(ITEMS[kN]); }
    info.classList.toggle("show", rest && inScene);
    $("#hint").style.opacity = sNow < .3 ? 1 : 0;
    if (inScene){ const it = ITEMS[kN]; rail(it.k === "entrance" ? "entrance" : it.k === "board" ? "board" : `room${it.k === "room" ? it.r : P[it.i].room}`); }
  };
  const renderInfo = it => {
    info.className = "info";
    if (it.k === "entrance"){ info.classList.add("guide"); info.innerHTML = guideHTML(); return; }
    if (it.k === "room"){ const r = ROOMS[it.r]; info.classList.add("roomc"); info.style.setProperty("--l", r.l);
      info.innerHTML = `<div class="row1 mono eyebrow"><span class="dot"></span>Room ${r.n} · ${P.filter(p=>p.room===it.r).length} works</div><h2>${esc(r.name)}</h2><p class="ln">${esc(r.look)}</p><p class="mono" style="color:var(--dim)">${P.filter(p=>p.room===it.r).map(p=>esc(p.title)).join("  ·  ")}</p>`; return; }
    if (it.k === "board"){ info.classList.add("boardc"); info.innerHTML = `<span class="mono">Every work, by room · scroll for the full overview ↓</span>`; return; }
    const p = P[it.i], r = ROOMS[p.room];
    info.classList.add(p.side < 0 || innerWidth < 700 ? "r" : "l"); info.style.setProperty("--l", r.l);
    info.innerHTML = `<div class="row1 mono"><span class="dot"></span>Room ${r.n} · ${esc(r.short)} · ${pad(it.i+1)}/08${p.feat ? `<span class="feat">Featured</span>` : ""}</div>
      <h2>${esc(p.title)}</h2><p class="ln">${esc(p.line)}</p>
      <dl><div><dt>Type</dt><dd>${esc(p.type)}</dd></div><div><dt>Context</dt><dd>${esc(p.context)}</dd></div><div><dt>My role</dt><dd>${esc(p.roleS)}</dd></div><div><dt>Stage</dt><dd>${esc(p.stageS)}</dd></div></dl>
      <button type="button" class="go" data-ic="${it.i}">Open case study →</button>`;
    $("[data-ic]", info).addEventListener("click", () => openFrom(it.i));
  };
  raf = requestAnimationFrame(frame);
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const s = sNow; start(); scrollTo(0, $("#gScroll").offsetTop + s * SEG); }, 250); }, {signal});
}

/* ── intro: lights come on, flicker, resume ── */
function runIntro(){
  closeCase(); introDone = false;
  const it = $("#intro"), bar = $("#inBar"), lab = $("#inLab");
  it.classList.remove("out","on","flick"); bar.style.width = "0"; lab.textContent = "Lighting the exhibition";
  $("#scene")?.classList.remove("lit");
  const fin = () => { it.classList.add("out"); introDone = true; lastK = -1; setTimeout(() => $("#scene")?.classList.add("lit"), 250); };
  if (reduce){ it.classList.add("on"); bar.style.width = "100%"; setTimeout(fin, 300); return; }
  setTimeout(() => { it.classList.add("on"); bar.style.width = "62%"; }, 150);
  setTimeout(() => { it.classList.add("flick"); lab.textContent = "Power interrupted at 62% · resuming"; }, 1000);
  setTimeout(() => { it.classList.remove("flick"); lab.textContent = "Three rooms · eight works"; bar.style.width = "100%"; }, 1800);
  setTimeout(fin, 2500);
}
$("#brand").addEventListener("click", e => { e.preventDefault(); closeCase(); scrollTo({top:0, behavior:reduce?"auto":"smooth"}); });
const clock = () => { try { $("#clock").textContent = "Sydney " + new Intl.DateTimeFormat("en-AU", {hour:"2-digit", minute:"2-digit", timeZone:"Australia/Sydney"}).format(new Date()); } catch(e){} };
clock(); setInterval(clock, 30000);

start(); runIntro();
</script>
