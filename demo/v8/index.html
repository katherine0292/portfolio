<!doctype html>
<html lang="en" data-theme="aura">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Aura Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap">
<style>
/*
  NEXT STEP · v4
  Three modes, one direction of travel:
    1. Gallery  – a lit corridor; every scroll gesture turns one page (one work).
    2. Board    – the Canvas layout: opening title, then a free pan / zoom board grouped by category,
                  with a bottom line. Pushing past the line turns the page.
    3. Closing  – process and contact.
  Warm graphite interior, spotlights; case pages stay on light paper.
  Committed to one look, so colours are explicit rather than theme-switched.
*/
:root{
  --room:#1F1D1B; --ink:#EEE9E1; --dim:#A39C92; --hair:rgba(238,233,225,.14);
  --paper:#F5F2EC; --fg:#161514; --muted:#6E6A64; --line:rgba(22,21,20,.12);
  --warm:255,222,176; --accent:#E9C38A;
  --fog:24,22,20; --vig:rgba(12,11,10,.5); --cardbg:rgba(24,22,20,.86); --cardink:#EEE9E1; --carddim:#A39C92; --cardhair:rgba(238,233,225,.14); --cardsolid:#181614;
  --board:#F5F2EC; --legs:#4A453F; --grid:rgba(238,233,225,.12); --hair2:rgba(238,233,225,.35); --turn:#2A2622; --shadow:rgba(0,0,0,.8);
  --accentText:rgb(255,222,176); --introbg:#100F0E; --cvglow:rgba(255,222,176,.08);
  --blurf:blur(18px) brightness(.62); --defocus:blur(7px) brightness(.5); --defocus2:blur(5px) opacity(.3);
  --sans:"Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  --serif:"Instrument Serif", "Noto Serif SC", "Songti SC", "Times New Roman", serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
/* Light: a daylight gallery, warm white walls */
html[data-theme="light"]{
  --room:#ECEAE6; --ink:#1A1917; --dim:#6F6B64; --hair:rgba(26,25,23,.12);
  --fog:236,234,230; --vig:rgba(150,140,125,.16); --cardbg:rgba(252,251,249,.94); --cardink:#1A1917; --carddim:#6F6B64; --cardhair:rgba(26,25,23,.1); --cardsolid:#FCFBF9;
  --board:#FFFFFF; --legs:#B8B2A8; --grid:rgba(26,25,23,.13); --hair2:rgba(26,25,23,.3); --turn:#DDD8D0; --shadow:rgba(60,50,40,.28);
  --accentText:#B4642A; --introbg:#F4F2EE; --cvglow:rgba(255,236,210,.5);
  --blurf:blur(18px) brightness(1.04) saturate(.9); --defocus:blur(7px) opacity(.42); --defocus2:blur(5px) opacity(.3); color-scheme:light}
/* Vivid: each room painted in one saturated colour */
html[data-theme="vivid"]{
  --room:#2B44FF; --ink:#FFFFFF; --dim:rgba(255,255,255,.78); --hair:rgba(255,255,255,.25);
  --fog:255,90,54; --vig:rgba(0,0,0,.16); --cardbg:rgba(255,255,255,.97); --cardink:#111111; --carddim:#5A5A5A; --cardhair:rgba(0,0,0,.1); --cardsolid:#FFFFFF;
  --board:#FFFFFF; --legs:rgba(255,255,255,.7); --grid:rgba(255,255,255,.22); --hair2:rgba(255,255,255,.5); --turn:#FF5A36; --shadow:rgba(0,0,40,.35);
  --accentText:#FFD23F; --introbg:#FF5A36; --cvglow:rgba(255,255,255,.06); --labc:var(--ink); --secline:rgba(255,255,255,.6);
  --blurf:blur(18px) saturate(1.15); --defocus:blur(7px) opacity(.55); --defocus2:blur(5px) opacity(.3)}
/* Aura: soft light-grey ground, glowing gradient blooms behind the work */
html[data-theme="aura"]{
  --room:#EFEFEF; --ink:#1A1A1A; --dim:#6B6B6B; --hair:rgba(0,0,0,.1);
  --fog:239,239,239; --vig:transparent; --cardbg:rgba(255,255,255,.84); --cardink:#1A1A1A; --carddim:#6B6B6B; --cardhair:rgba(0,0,0,.08); --cardsolid:#FFFFFF;
  --board:#FFFFFF; --legs:#CFCFCF; --grid:rgba(0,0,0,.09); --hair2:rgba(0,0,0,.25); --turn:#F6D2B8; --shadow:rgba(120,60,30,.18);
  --accentText:#F06A3C; --introbg:#EFEFEF; --cvglow:transparent;
  --blurf:blur(20px) saturate(1.1); --defocus:blur(8px) opacity(.5); --defocus2:blur(5px) opacity(.3); color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0; height:100%}
body{background:var(--room); color:var(--ink); font-family:var(--sans); font-size:16px; line-height:1.5; overflow:hidden}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:1.5px solid var(--accent); outline-offset:4px}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance}
p,dl,dd{margin:0}
em{font-family:var(--serif); font-style:italic; font-weight:400}
.mono{font-family:var(--mono); font-size:12px; letter-spacing:.04em}
.eyebrow{text-transform:uppercase; letter-spacing:.14em}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:rgb(var(--l,var(--warm))); box-shadow:0 0 10px rgba(var(--l,var(--warm)),.8); flex:none}

/* chrome */
.top{position:fixed; z-index:50; inset:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:16px; padding:calc(14px + env(safe-area-inset-top,0px)) var(--gr) 14px var(--gl); pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-size:14px; text-decoration:none; font-weight:500}
.brand em{font-size:16px; color:var(--dim)}
.where{display:flex; align-items:center; gap:8px; color:var(--dim)}
.clock{justify-self:end; color:var(--dim)}
.rail{position:fixed; z-index:40; right:calc(18px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:grid; gap:12px}
.rail button{display:flex; align-items:center; justify-content:flex-end; gap:10px; font-family:var(--mono); font-size:11px; color:var(--dim)}
.rail button span{opacity:0; transform:translateX(6px); transition:.3s var(--out)}
.rail:hover button span{opacity:1; transform:none}
.rail button i{width:16px; height:1.5px; background:currentColor; opacity:.4; transition:.4s var(--out)}
.rail button.on{color:var(--ink)}
.rail button.on i{width:32px; opacity:1; background:var(--accent)}
.cursor{position:fixed; z-index:96; left:0; top:0; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--ink); pointer-events:none; transition:width .35s var(--out), height .35s var(--out), margin .35s var(--out); display:grid; place-items:center; color:var(--room); font-family:var(--mono); font-size:11px}
.cursor span{opacity:0; transition:opacity .2s}
.cursor.big{width:84px; height:84px; margin:-42px}
.cursor.big span{opacity:1}
html.case-open .cursor{background:var(--fg); color:var(--paper)}
@media (pointer:coarse){.cursor{display:none}}

/* modes */
.mode{position:fixed; inset:0; opacity:0; visibility:hidden; transition:opacity .9s ease, visibility 0s .9s}
.mode.on{opacity:1; visibility:visible; transition:opacity .9s ease}

/* intro */
.intro{position:fixed; inset:0; z-index:100; background:var(--introbg); display:grid; place-items:center; transition:opacity 1.1s ease, visibility 0s 1.1s}
.intro.out{opacity:0; visibility:hidden}
.intro::before{content:""; position:absolute; left:50%; top:0; width:min(900px,140vw); height:100%; transform:translateX(-50%); background:radial-gradient(ellipse 40% 60% at 50% 0, rgba(var(--warm),.22), transparent 70%); opacity:0; transition:opacity .5s}
.intro.on::before{opacity:1}
.intro.flick::before{animation:flick .7s steps(1) 1}
@keyframes flick{0%{opacity:.1}15%{opacity:1}30%{opacity:.05}45%{opacity:.8}60%{opacity:0}80%{opacity:.9}}
.intro .c{position:relative; display:grid; gap:16px; justify-items:center; text-align:center; padding:0 16px}
.intro .nm{font-family:var(--serif); font-size:clamp(52px,9vw,120px); line-height:1; opacity:.15; transition:opacity .8s}
.intro.on .nm{opacity:1}
.intro .ln{width:min(320px,70vw); height:1px; background:rgba(238,233,225,.15); position:relative}
.intro .ln i{position:absolute; inset:0 auto 0 0; width:0; background:rgb(var(--warm)); transition:width .7s var(--ease)}
.intro .lab{color:var(--dim); min-height:1.5em}

/* ═══ 1 · GALLERY ═══ */
.gal{overflow:hidden; perspective:1000px; perspective-origin:50% 46%; background:var(--room)}
.gal::before{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(circle at 50% 46%, rgba(var(--fog),1) 0, rgba(var(--fog),.85) 5%, rgba(var(--fog),0) 22%)}
.gal::after{content:""; position:absolute; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse 75% 70% at 50% 50%, transparent 55%, var(--vig) 100%)}
#gal::before{display:none}
.g-room{position:absolute; inset:0; width:100%; height:100%; z-index:0}
.g-yaw{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d; z-index:1}
.g-cam{position:absolute; left:0; top:0; transform-style:preserve-3d}
.g-cam > *, .g-seg > *{position:absolute; left:0; top:0}
.g-seg{transform-style:preserve-3d}
.g-floor{background:
  linear-gradient(90deg, transparent calc(50% - 451px), rgba(var(--warm),.32) calc(50% - 451px) calc(50% - 449px), transparent calc(50% - 449px) calc(50% + 449px), rgba(var(--warm),.32) calc(50% + 449px) calc(50% + 451px), transparent calc(50% + 451px)),
  linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px) 0 0 / 100% 400px,
  linear-gradient(90deg, #171614, #1D1B19 30%, #24221F 50%, #1D1B19 70%, #171614)}
.g-ceil{background:#131211}
.g-wall{background:linear-gradient(0deg, rgba(var(--warm),.20) 0 2px, rgba(var(--warm),.05) 2px 36px, transparent 36px), linear-gradient(0deg, #1D1B19, #282522 65%, #221F1C)}
.g-title{width:1600px; margin-left:-800px; text-align:center; display:grid; gap:18px; justify-items:center; pointer-events:none}
.g-title .mono{font-size:17px; color:var(--labc, rgb(var(--l,var(--warm)))); letter-spacing:.24em}
.g-title h1, .g-title h2{font-family:var(--serif); font-weight:400; line-height:.88; text-shadow:0 0 70px rgba(var(--l,var(--warm)),.28)}
.g-title h1{font-size:190px}
.g-title h2{font-size:112px}
.g-title p.s{font-size:26px; color:var(--dim)}
.g-title .mb{display:none}
html[data-theme="aura"] .g-title .mono{color:var(--dim)}
@media (max-width:700px){ .g-title .mb{display:inline} .g-title h1{font-size:170px} .g-title p.s{font-size:32px} }
.cs-bar .sm{display:none}
@media (max-width:700px){ .cs-bar .sm{display:inline} }
.g-cone{width:700px; margin-left:-350px; height:860px; clip-path:polygon(47% 0, 53% 0, 100% 100%, 0 100%); background:linear-gradient(180deg, rgba(var(--l),.20), rgba(var(--l),.05) 65%, rgba(var(--l),0)); pointer-events:none}
.g-pool{width:1000px; height:520px; margin:-260px 0 0 -500px; background:radial-gradient(ellipse at center, rgba(var(--l),.26), rgba(var(--l),.07) 40%, transparent 68%); pointer-events:none}
.g-fix{width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; background:rgb(var(--l)); box-shadow:0 0 26px 6px rgba(var(--l),.5)}
.gal:not(.lit) .g-cone, .gal:not(.lit) .g-pool, .gal:not(.lit) .g-fix{opacity:0 !important}
.g-cone, .g-pool, .g-fix{transition:opacity 1.2s}
.g-art{transform-origin:50% 0; cursor:pointer; display:block; color:inherit; text-decoration:none}
.info .go, .cb-open, .caps .r a{text-decoration:none}
:lang(zh) em{font-style:normal}
:lang(zh) .cb-title h1 em{font-size:200px; letter-spacing:-.01em}
:lang(zh) .g-plan .lb span{white-space:nowrap}
:lang(zh) .g-plan{width:150px}
:lang(zh) .eyebrow, :lang(zh) .mono{letter-spacing:.06em}
.cb-end{cursor:pointer; color:inherit; background:none}
.cb-end:hover p{color:var(--accentText)}
.g-art .bd{background:var(--board); color:var(--fg); padding:22px 22px 24px; position:relative; box-shadow:0 50px 80px -30px rgba(0,0,0,.7); transition:transform .7s var(--out)}
.g-art .bd::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg, rgba(var(--l),.14), transparent 35%)}
.g-art:hover .bd{transform:translateY(-14px)}
.g-art img{width:100%; aspect-ratio:16/10; object-fit:cover}
.g-art .cap{display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-top:16px}
.g-art h3{font-family:var(--serif); font-weight:400; font-size:42px; line-height:1}
.g-art.feat h3{font-size:52px}
.g-art .cap .mono{color:var(--muted); text-align:right}
.g-art .badge{position:absolute; z-index:1; top:34px; left:34px; background:var(--fg); color:var(--paper); font-family:var(--mono); font-size:12px; padding:5px 10px; letter-spacing:.08em}
.g-art .legs{position:absolute; top:100%; left:0; right:0; height:140px; pointer-events:none}
.g-art .legs::before, .g-art .legs::after{content:""; position:absolute; top:0; bottom:0; width:2px; background:var(--legs)}
.g-art .legs::before{left:20%} .g-art .legs::after{right:20%}
.g-plan{position:absolute; z-index:5; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); width:130px; display:grid; gap:6px; font-family:var(--mono); font-size:10.5px; color:var(--dim)}
.g-plan .bar, .g-plan .lb{display:grid; grid-template-columns:4fr 4fr 3fr 1.4fr; gap:3px}
.g-plan .bar{position:relative; height:4px}
.g-plan .bar span{background:rgba(var(--l),.35); border-radius:2px}
.g-plan .bar i{position:absolute; top:50%; width:10px; height:10px; margin:-5px; border-radius:50%; background:var(--ink); box-shadow:0 0 12px rgba(var(--warm),.9); transition:left .9s var(--ease)}
.g-hint{position:absolute; z-index:5; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); color:var(--dim); white-space:nowrap; transition:opacity .4s}

/* side card */
.info{position:fixed; z-index:45; top:50%; width:min(390px, 34vw); transform:translateY(-46%); display:grid; gap:14px; padding:24px; border-radius:18px; background:var(--cardbg); color:var(--cardink); border:1px solid var(--cardhair); box-shadow:0 20px 60px -30px var(--shadow); opacity:0; visibility:hidden; transition:opacity .45s, visibility 0s .45s, transform .7s var(--out)}
.info.r{right:calc(72px + env(safe-area-inset-right,0px))} .info.l{left:calc(40px + env(safe-area-inset-left,0px))}
.info.show{opacity:1; visibility:visible; transition:opacity .45s, transform .7s var(--out); transform:translateY(-50%)}
.info .row1{display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:var(--carddim)}
.info .feat{margin-left:auto; color:var(--fg); background:rgb(var(--l)); padding:2px 8px; border-radius:999px; font-size:11px}
.info h2{font-family:var(--serif); font-weight:400; font-size:clamp(40px,4vw,58px); line-height:.95}
.info .ln{color:var(--carddim); font-size:16px}
.info dl{display:grid; border-top:1px solid var(--cardhair)}
.info dl div{display:grid; grid-template-columns:78px minmax(0,1fr); gap:12px; padding:9px 0; border-bottom:1px solid var(--cardhair)}
.info dt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--carddim); padding-top:3px}
.info dd{font-size:14.5px}
.info .go{justify-self:start; display:inline-flex; gap:10px; align-items:center; background:var(--cardink); color:var(--cardsolid); padding:11px 18px; border-radius:999px; font-size:14px}
.info .go:hover{background:rgb(var(--l))}
.info .gos{display:flex; flex-wrap:wrap; gap:8px}
.info .go.alt{background:transparent; color:var(--cardink); box-shadow:inset 0 0 0 1px var(--cardink)}
.info .go.alt:hover{background:var(--cardink); color:var(--cardsolid)}
.cb-gos{display:flex; flex-wrap:wrap; gap:12px}
.cb-open.alt{border-style:dashed}
img[src$="wildling-portfolio.webp"]{object-position:left center}
.info > *{transition:opacity .5s, transform .6s var(--out)}
.info:not(.show) > *{opacity:0; transform:translateY(10px)}
.info.show > *:nth-child(2){transition-delay:.05s} .info.show > *:nth-child(3){transition-delay:.1s} .info.show > *:nth-child(4){transition-delay:.15s} .info.show > *:nth-child(5){transition-delay:.2s}
.info.guide{left:calc(40px + env(safe-area-inset-left,0px)); top:auto; bottom:calc(40px + env(safe-area-inset-bottom,0px)); transform:translateY(10px); width:min(420px, calc(100vw - 32px))}
.info.guide.show{transform:none}
.guide ol{list-style:none; margin:0; padding:0; display:grid; border-top:1px solid var(--cardhair)}
.guide li{display:grid; grid-template-columns:auto 34px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--cardhair); font-size:15px}
.guide li small{color:var(--carddim); font-family:var(--mono); font-size:11px}
.guide li .f{grid-column:3 / 5; color:var(--carddim); font-size:12.5px; margin-top:-4px}
.info.roomc{left:50%; top:auto; bottom:calc(48px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,10px); width:min(560px, calc(100vw - 32px)); text-align:center; justify-items:center}
.info.roomc.show{transform:translate(-50%,0)}

/* ═══ 2 · BOARD (Canvas layout) ═══ */
.cv{overflow:hidden; touch-action:none; cursor:grab; background-color:var(--room); background-image:radial-gradient(circle, var(--grid) 1px, transparent 1.4px)}
.cv::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 55% at 50% 0, var(--cvglow), transparent 70%), radial-gradient(ellipse 75% 70% at 50% 50%, transparent 60%, var(--vig) 100%)}
.cv.drag{cursor:grabbing}
.cv-plane{position:absolute; left:0; top:0; transform-origin:0 0}
.cv-plane.moving{will-change:transform}
.cb{position:absolute}
.cb-title{width:1500px; padding-top:150px}
.cb-title .mono{font-size:18px; color:var(--dim)}
.cb-title h1{font-size:220px; line-height:.86; letter-spacing:-.065em; margin-top:30px}
.cb-title h1 em{font-size:240px; letter-spacing:-.03em; color:var(--accentText)}
.cb-title p.l{font-size:34px; line-height:1.25; color:var(--dim); max-width:30ch; margin-top:44px; letter-spacing:-.01em}
.cb-go{margin-top:48px; display:inline-flex; gap:14px; align-items:center; background:var(--ink); color:var(--room); border-radius:999px; padding:22px 34px; font-size:24px}
.cb-sec{width:2900px; display:grid; gap:14px; padding-top:40px; border-top:2px solid var(--secline, rgba(var(--l),.6))}
.cb-sec .mono{font-size:20px; color:var(--labc, rgb(var(--l))); letter-spacing:.24em; display:flex; align-items:center; gap:14px}
.cb-sec .mono .dot{width:14px; height:14px}
.cb-sec h2{font-family:var(--serif); font-weight:400; font-size:150px; line-height:.9}
.cb-sec p{font-size:32px; color:var(--dim); max-width:46ch}
.cb-p{display:flex; gap:56px; align-items:flex-start; cursor:pointer}
.cb-p figure{margin:0; flex:none; width:860px; border-radius:18px; overflow:hidden; box-shadow:0 60px 90px -50px var(--shadow), 0 0 0 1px rgba(255,255,255,.05); transition:transform .8s var(--out), box-shadow .6s; position:relative}
.cb-p figure img{width:100%; aspect-ratio:16/10; object-fit:cover}
.cb-p figure .badge{position:absolute; top:18px; left:18px; background:rgb(var(--l)); color:var(--fg); font-family:var(--mono); font-size:16px; padding:6px 12px; border-radius:999px}
.cb-p:hover figure{transform:translateY(-12px); box-shadow:0 80px 100px -50px var(--shadow), 0 0 0 2px rgba(var(--l),.6)}
.cb-t{width:480px; flex:none; display:grid; gap:18px}
.cb-t .mono{font-size:15px; color:var(--dim)}
.cb-t h3{font-size:84px; line-height:.92; letter-spacing:-.05em}
.cb-t .ln{font-family:var(--serif); font-size:34px; line-height:1.1; color:var(--labc, rgb(var(--l)))}
.cb-t dl{display:grid; border-top:1px solid var(--hair)}
.cb-t dl div{display:grid; grid-template-columns:110px 1fr; gap:12px; padding:9px 0; border-bottom:1px solid var(--hair); font-size:17px}
.cb-t dt{font-family:var(--mono); font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; padding-top:3px}
.cb-t .pr{font-size:19px; color:var(--dim)}
.cb-t ol{list-style:none; margin:0; padding:0}
.cb-t li{display:grid; grid-template-columns:110px 1fr; gap:12px; font-size:17px; border-top:1px solid var(--hair); padding:10px 0}
.cb-t li span{font-family:var(--mono); font-size:13px; color:var(--dim); padding-top:3px}
.cb-st{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--ink); padding-top:14px}
.cb-st b{display:block; font-family:var(--serif); font-weight:400; font-size:52px; line-height:1}
.cb-st span{font-size:13px; color:var(--dim); line-height:1.3; display:block}
.cb-lim{font-size:16px; border-left:2px solid rgb(var(--l)); padding-left:14px}
.cb-open{justify-self:start; font-family:var(--mono); font-size:15px; border:1px solid var(--ink); border-radius:999px; padding:12px 20px}
.cb-open:hover{background:var(--ink); color:var(--room)}
.cb-end{width:2900px; display:grid; gap:20px; justify-items:center; text-align:center; padding-top:30px; border-top:2px dashed var(--hair2)}
.cb-end .mono{font-size:20px; color:var(--dim); letter-spacing:.2em}
.cb-end p{font-family:var(--serif); font-size:80px; line-height:1}
.cv.mob .cb-title{width:760px}
.cv.mob .cb-title h1{font-size:150px} .cv.mob .cb-title h1 em{font-size:160px} .cv.mob .cb-title p.l{font-size:40px} .cv.mob .cb-title .mono{font-size:22px}
.cv.mob .cb-go{font-size:30px; padding:26px 40px}
.cv.mob .cb-sec, .cv.mob .cb-end{width:760px}
.cv.mob .cb-sec h2{font-size:112px} .cv.mob .cb-sec p{font-size:34px} .cv.mob .cb-end p{font-size:62px}
.cv.mob .cb-p{flex-direction:column; gap:30px}
.cv.mob .cb-p figure{width:760px}
.cv.mob .cb-t{width:760px; gap:22px}
.cv.mob .cb-t .mono{font-size:22px} .cv.mob .cb-t h3{font-size:100px} .cv.mob .cb-t .ln{font-size:46px}
.cv.mob .cb-t dl div, .cv.mob .cb-t li{font-size:27px; grid-template-columns:160px 1fr}
.cv.mob .cb-t dt, .cv.mob .cb-t li span{font-size:19px}
.cv.mob .cb-t .pr{font-size:28px} .cv.mob .cb-st b{font-size:72px} .cv.mob .cb-st span{font-size:19px}
.cv.mob .cb-lim{font-size:25px} .cv.mob .cb-open{font-size:23px; padding:16px 26px}
.cv-chips{position:absolute; z-index:6; top:calc(56px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--cardbg); border:1px solid var(--cardhair); max-width:calc(100vw - 32px); overflow-x:auto}
.cv-chips button{display:inline-flex; gap:8px; align-items:center; padding:7px 13px; border-radius:999px; font-size:13px; color:var(--carddim); white-space:nowrap}
.cv-chips button:hover, .cv-chips button.on{background:var(--cardink); color:var(--cardsolid)}
.cv-ui{position:absolute; z-index:6; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:10px; justify-items:end}
.cv-ctl{display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--cardbg); color:var(--cardink); border:1px solid var(--cardhair)}
.cv-ctl button{min-width:34px; height:30px; border-radius:999px; font-family:var(--mono); font-size:12px; padding:0 10px}
.cv-ctl button:hover{background:var(--cardink); color:var(--cardsolid)}
.cv-map{position:relative; width:96px; height:144px; border-radius:12px; background:var(--cardbg); border:1px solid var(--cardhair); overflow:hidden; cursor:pointer}
.cv-map i{position:absolute; background:var(--cardhair); border-radius:2px}
.cv-map i.s{background:rgba(var(--l),.7)}
.cv-map b{position:absolute; border:1.5px solid var(--cardink); border-radius:3px}
.cv-hint{position:absolute; z-index:6; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); color:var(--dim); white-space:nowrap; transition:opacity .5s}
.cv-edge{position:absolute; z-index:6; left:50%; transform:translate(-50%,0); display:grid; gap:8px; justify-items:center; color:var(--ink); opacity:0; transition:opacity .3s; pointer-events:none}
.cv-edge.bot{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.cv-edge.topE{top:calc(110px + env(safe-area-inset-top,0px))}
.cv-edge .track{width:180px; height:2px; background:var(--hair); border-radius:2px; overflow:hidden}
.cv-edge .track i{display:block; height:100%; width:0; background:rgb(var(--warm))}

/* colour switch */
.themes{justify-self:end; display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--cardbg); border:1px solid var(--cardhair)}
.themes button{font-family:var(--mono); font-size:11px; padding:5px 10px; border-radius:999px; color:var(--carddim)}
.themes button[aria-pressed="true"]{background:var(--cardink); color:var(--cardsolid)}

/* chapter: when the camera rests at a room, the hall blurs and the room title takes the centre */
.chapter{position:fixed; z-index:44; inset:0; display:grid; place-content:center; justify-items:center; text-align:center; gap:20px; padding:0 var(--gr) 0 var(--gl); pointer-events:none; opacity:0; transition:opacity .6s}
.chapter.show{opacity:1}
.chapter > *{transform:translateY(18px); transition:transform .9s var(--out)}
.chapter.show > *{transform:none}
.chapter.show > *:nth-child(2){transition-delay:.06s} .chapter.show > *:nth-child(3){transition-delay:.12s} .chapter.show > *:nth-child(4){transition-delay:.18s}
.chapter .mono{font-size:13px; letter-spacing:.3em; color:var(--labc, rgb(var(--l)))}
.chapter h2{font-family:var(--serif); font-weight:400; font-size:clamp(56px,9vw,150px); line-height:.9; max-width:13ch}
.chapter .lk{font-size:clamp(17px,1.6vw,22px); color:var(--dim); max-width:40ch}
.chapter .ws{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:8px}
.chapter.show .ws{pointer-events:auto}
.chapter .ws button{border:1px solid var(--hair2); border-radius:999px; padding:9px 16px; font-size:14px; display:inline-flex; gap:8px; align-items:center}
.chapter .ws button:hover{background:var(--ink); color:var(--room)}
.chapter .ws b{font-weight:500; font-family:var(--mono); font-size:11px; color:var(--labc, rgb(var(--l)))}
#gal{transition:opacity .9s ease, visibility 0s .9s, filter .8s var(--out)}
#gal.on{transition:opacity .9s ease, filter .8s var(--out)}
#gal.chap{filter:var(--blurf)}
.g-room{transition:filter .7s var(--out)}
.g-art{transition:filter .7s var(--out)}
#gal.focusing .g-room{filter:blur(2.5px)}
#gal.focusing .g-art:not(.focus), #gal.ent .g-art{filter:var(--defocus)}
.cb{transition:filter .6s var(--out), opacity .6s var(--out)}
.cv.focusing .cb:not(.focus){filter:var(--defocus2)}
.cv:not(.focusing) .cv-plane:has(.cb-p:hover) .cb-p:not(:hover){opacity:.55}

/* aura blooms */
.g-aura{width:1700px; height:1500px; margin:-750px 0 0 -850px; pointer-events:none; display:none;
  background:radial-gradient(closest-side at 38% 58%, rgba(var(--a1),.95), rgba(var(--a1),0)), radial-gradient(closest-side at 64% 38%, rgba(var(--a2),.9), rgba(var(--a2),0)), radial-gradient(closest-side at 52% 50%, rgba(var(--a3),.75), rgba(var(--a3),0))}
html[data-theme="aura"] .g-aura{display:none}
html[data-theme="aura"] .g-cone, html[data-theme="aura"] .g-fix, html[data-theme="aura"] .g-pool{display:none}
html[data-theme="aura"] .intro::after{content:""; position:fixed; inset:-20%; pointer-events:none;
  background:radial-gradient(closest-side at 32% 42%, rgba(255,110,80,.5), transparent), radial-gradient(closest-side at 68% 60%, rgba(255,205,85,.5), transparent), radial-gradient(closest-side at 55% 28%, rgba(255,150,70,.35), transparent);
  animation:drift 26s ease-in-out infinite alternate}
html[data-theme="aura"] .intro .c{z-index:1}
.tail > .wrap{position:relative}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}

/* glow: a flat light layer under the work, never over it; it settles behind the work in focus
   and its blooms lean toward the pointer */
@property --c{syntax:'<color>'; inherits:false; initial-value:#ff8a60}
.glow{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; opacity:.62}
.tail .glow{position:fixed}
.glow i{position:absolute; left:0; top:0; width:1000px; height:1000px; margin:-500px 0 0 -500px; border-radius:50%;
  background:radial-gradient(closest-side, var(--c), color-mix(in srgb, var(--c) 0%, transparent)); will-change:transform; transition:--c 1.2s ease}

/* page turn */
.turn{position:fixed; inset:-20vh 0; z-index:80; background:var(--turn); transform:translateY(110%); border-radius:50% 50% 0 0 / 14vh 14vh 0 0; pointer-events:none; transition:transform .85s var(--ease), border-radius .85s var(--ease)}
.turn.in{transform:translateY(0); border-radius:0}
.turn.up{transform:translateY(-110%); border-radius:0 0 50% 50% / 0 0 14vh 14vh}
.turn.noanim{transition:none}

/* ═══ 3 · CLOSING ═══ */
.tail{overflow-y:auto; overscroll-behavior:contain; background:linear-gradient(180deg,var(--turn) 0, var(--room) 70vh)}
.wrap{padding-left:var(--gl); padding-right:var(--gr)}
.inner{max-width:1320px; margin:0 auto}
.back{display:inline-flex; gap:10px; align-items:center; font-family:var(--mono); font-size:12px; color:var(--dim); border:1px solid var(--hair); border-radius:999px; padding:8px 14px; margin-top:calc(80px + env(safe-area-inset-top,0px))}
.back:hover{color:var(--ink); border-color:var(--ink)}
.ab{padding-block:60px 60px}
.ab-lead{font-size:clamp(30px,4.4vw,64px); line-height:1.05; letter-spacing:-.035em; max-width:21ch; margin-top:22px}
.ab-steps{list-style:none; margin:64px 0 0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:28px}
.ab-steps li{border-top:1px solid var(--ink); padding-top:16px; display:grid; gap:8px; align-content:start}
.ab-steps span{font-family:var(--mono); font-size:12px; color:var(--dim)}
.ab-steps h3{font-size:22px; letter-spacing:-.02em}
.ab-steps p{color:var(--dim); font-size:15px}
.ab-steps small{font-family:var(--mono); font-size:11.5px; color:var(--accentText)}
.caps{margin-top:72px; border-top:1px solid var(--hair)}
.caps h3{font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:400; padding:20px 0 8px}
.caps .r{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:20px; padding:14px 0; border-bottom:1px solid var(--hair); align-items:center}
.caps .r p{font-size:18px}
.caps .r div{display:flex; flex-wrap:wrap; gap:8px}
.caps .r a, .caps .r button{border:1px solid var(--hair); border-radius:999px; padding:5px 12px; font-size:13px; display:inline-flex; align-items:center; gap:8px}
.caps .r a:hover{border-color:var(--ink)}
.ct{padding-block:80px 120px}
.ct-h{font-size:clamp(52px,10vw,160px); line-height:.9; letter-spacing:-.055em; margin-top:20px}
.ct-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; margin-top:44px}
.ct-btn{display:inline-flex; align-items:center; gap:12px; background:var(--ink); color:var(--room); text-decoration:none; padding:18px 26px; border-radius:999px; transition:transform .4s var(--out)}
.ct-btn i{width:8px; height:8px; border-radius:50%; background:#C48A3A}
.ct-link{font-family:var(--mono); font-size:13px; text-decoration:none; border-bottom:1px solid var(--hair); padding-bottom:2px}
.ct-foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:90px; color:var(--dim); border-top:1px solid var(--hair); padding-top:16px}

/* CASE · light paper */
.case{position:fixed; inset:0; z-index:70; overflow-y:auto; overscroll-behavior:contain; background:var(--paper); color:var(--fg); opacity:0; visibility:hidden; transition:opacity .5s, visibility 0s .6s; color-scheme:light}
.case.open{opacity:1; visibility:visible; transition:opacity .5s}
.cs{padding:0 var(--gr) 0 var(--gl)}
.cs-in{max-width:1180px; margin:0 auto}
.cs-bar{position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px; background:var(--paper)}
.cs-bar .mono{color:var(--muted); display:flex; align-items:center; gap:8px}
.cs-bar .nav{display:flex; gap:6px}
.cs-bar button{border:1px solid var(--line); border-radius:999px; height:36px; min-width:36px; padding:0 14px; font-family:var(--mono); font-size:12px}
.cs-bar button:hover{background:var(--fg); color:var(--paper)}
.cs-cover{margin:18px 0 0; border-radius:16px; overflow:hidden; background:#ddd}
.cs-cover img{width:100%; aspect-ratio:2/1; object-fit:cover}
.cs-head{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:40px; align-items:end; padding:48px 0 40px}
.cs-head h1{font-size:clamp(56px,9vw,150px); line-height:.86; letter-spacing:-.065em}
.cs-head .ln{font-family:var(--serif); font-size:clamp(26px,2.8vw,40px); line-height:1.1; margin-top:20px; max-width:20ch}
.cs-meta div{display:grid; grid-template-columns:90px minmax(0,1fr); gap:12px; border-top:1px solid var(--line); padding:10px 0}
.cs-meta dt{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); padding-top:3px}
.cs-meta dd{font-size:15px}
.cs-row{display:grid; grid-template-columns:220px minmax(0,1fr); gap:32px; padding:40px 0; border-top:1px solid var(--line)}
.cs-row h4{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:400}
.cs-row .big{font-size:clamp(22px,2.4vw,32px); line-height:1.25; letter-spacing:-.02em; max-width:34ch}
.cs-dec{list-style:none; margin:0; padding:0}
.cs-dec li{display:grid; grid-template-columns:40px 140px minmax(0,1fr); gap:16px; padding:16px 0; border-bottom:1px solid var(--line); font-size:19px; align-items:baseline}
.cs-dec li span{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-dec li b{font-weight:500; font-size:13px; font-family:var(--mono); color:#8A5A1E}
.cs-st{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
.cs-st b{display:block; font-family:var(--serif); font-weight:400; font-size:clamp(52px,6vw,92px); line-height:.9}
.cs-st span{color:var(--muted); font-size:14px; display:block; margin-top:8px}
.cs-lim{font-size:19px; max-width:52ch; border-left:2px solid #C48A3A; padding-left:16px}
.cs-slots{display:grid; grid-template-columns:2fr 1fr; grid-auto-rows:180px; gap:12px}
.cs-slots div{border:1px dashed rgba(22,21,20,.25); border-radius:14px; display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; padding:8px}
.cs-slots div:first-child{grid-row:span 2}
.cs-live{font-family:var(--mono); font-size:13px; border-bottom:1px solid var(--fg); text-decoration:none; justify-self:start}
.cs-next{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:end; width:100%; text-align:left; padding:48px 0 120px; border-top:1px solid var(--line)}
.cs-next small{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-next strong{display:block; font-weight:500; font-size:clamp(40px,6vw,96px); line-height:.9; letter-spacing:-.055em; transition:transform .6s var(--out)}
.cs-next:hover strong{transform:translateX(16px)}
.cs-next img{border-radius:10px; aspect-ratio:4/3; object-fit:cover}
.case.open .rv{animation:rise 1s var(--out) both; animation-delay:calc(var(--d,0) * 70ms + 300ms)}
@keyframes rise{from{opacity:0; transform:translateY(46px)}}
.flip{position:fixed; z-index:95; object-fit:cover; pointer-events:none; transition:left .95s var(--ease), top .95s var(--ease), width .95s var(--ease), height .95s var(--ease), border-radius .95s var(--ease)}

@media (max-width:1000px){
  .rail{display:none}
  .ab-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .caps .r{grid-template-columns:1fr; gap:10px}
  .cs-head{grid-template-columns:1fr}
  .cs-row{grid-template-columns:1fr; gap:14px}
  .cs-st{grid-template-columns:1fr}
  .cs-dec li{grid-template-columns:32px minmax(0,1fr)}
  .cs-dec li b, .cs-dec li em{grid-column:2}
  .cs-next{grid-template-columns:1fr}
}
@media (max-width:700px){
  .top{grid-template-columns:1fr auto}
  .where{display:none}
  .brand em{display:none}
  .info, .info.r, .info.l{background:rgba(255,255,255,.97); padding:14px 16px 16px; gap:8px; bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .info h2{font-size:32px}
  .info .ln{font-size:14px}
  .info dl div{grid-template-columns:72px minmax(0,1fr); padding:7px 0}
  .info dd{font-size:13.5px}
  .info .go{padding:9px 16px; font-size:13px}
  .guide li{grid-template-columns:auto 26px minmax(0,1fr) auto; padding:8px 0; font-size:14px}
  .guide li .f, .guide > p{display:none}
  .info.guide{left:var(--gl); right:var(--gr); width:auto; bottom:calc(14px + env(safe-area-inset-bottom,0px)); padding:14px 16px}
  .themes.lang button{padding:5px 9px}
  .cv-chips{display:none}
  .cv-hint{top:calc(58px + env(safe-area-inset-top,0px)); bottom:auto}
  .cv-ctl button{min-width:30px; height:28px; padding:0 8px}
  .cs-bar .rn, .cs-bar .lg{display:none}
  .gal{perspective-origin:50% 34%}
  .gal::before{background:radial-gradient(circle at 50% 34%, rgba(var(--fog),1) 0, rgba(var(--fog),.85) 5%, rgba(var(--fog),0) 22%)}
  .info, .info.r, .info.l{left:var(--gl); right:var(--gr); width:auto; top:auto; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateY(12px); padding:16px; gap:10px}
  .info.show{transform:none}
  .info h2{font-size:36px}
  .info dl div:nth-child(1), .info dl div:nth-child(4){display:none}
  .info.roomc{left:var(--gl); right:var(--gr); width:auto; transform:translateY(10px)}
  .info.roomc.show{transform:none}
  .g-plan, .g-hint, .cv-map{display:none}
  .cv-chips{top:calc(52px + env(safe-area-inset-top,0px))}
  .ab-steps{grid-template-columns:1fr}
  .cs-slots{grid-template-columns:1fr; grid-auto-rows:120px}
  .cs-slots div:first-child{grid-row:auto}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="brand">Katherine Lin <em data-t="brandEm">— selected work</em></a>
  <span class="where mono" id="where"><span class="dot"></span><span id="whereT">Entrance</span></span>
  <div class="themes lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div>
</header>

<div class="intro" id="intro"><div class="c">
  <p class="nm">Katherine Lin</p>
  <div class="ln"><i id="inBar"></i></div>
  <p class="lab mono" id="inLab">Lighting the gallery</p>
</div></div>

<nav class="rail" id="rail" aria-label="Map">
  <button type="button" data-go="g0"><span data-t="railEntrance">Entrance</span><i></i></button>
  <button type="button" data-go="r0"><span data-t="rail0">I · AI & trust</span><i></i></button>
  <button type="button" data-go="r1"><span data-t="rail1">II · UX & recovery</span><i></i></button>
  <button type="button" data-go="r2"><span data-t="rail2">III · Research</span><i></i></button>
  <button type="button" data-go="board"><span data-t="board">The board</span><i></i></button>
  <button type="button" data-go="tail"><span data-t="tail">Process & contact</span><i></i></button>
</nav>

<section class="mode gal on" id="gal" aria-label="Gallery walk">
  <canvas class="g-room" id="gRoom" aria-hidden="true"></canvas>
  <div class="glow" id="glowG" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="g-yaw" id="gYaw"><div class="g-cam" id="gCam"></div></div>
  <div class="g-plan" aria-hidden="true"><div class="lb"><span>I</span><span>II</span><span>III</span><span data-t="planBoard">Board</span></div><div class="bar" id="planBar"></div></div>
  <p class="g-hint mono" id="gHint" data-t="gHint">Scroll · one gesture, one work ↓</p>
</section>

<section class="mode cv" id="cv" aria-label="The board">
  <div class="glow" id="glowC" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="cv-plane" id="cvPlane"></div>
  <div class="cv-chips" id="cvChips"></div>
  <div class="cv-edge topE" id="edgeTop"><span class="mono" data-t="edgeTop">Keep scrolling up · back to the gallery</span><div class="track"><i></i></div></div>

function rail(g){ $$("#rail button").forEach(b => b.classList.toggle("on", b.dataset.go === g)); }
$$("#rail button").forEach(b => b.addEventListener("click", () => { closeCase(); const g = b.dataset.go;
  if (g === "g0" || g.startsWith("r")){ const k = g === "g0" ? 0 : ITEMS.findIndex(it => it.k === "panel" && P[it.i].room === +g.slice(1)); if (mode !== "gal") toGallery(true); galGo(k); return; }
  if (g === "board"){ if (mode === "gal") toBoard(); else if (mode === "tail") toBoard(true); return; }
  if (g === "tail" && mode !== "tail") toTail(); }));
$("#brand").addEventListener("click", e => { e.preventDefault(); closeCase(); if (mode !== "gal") toGallery(true); galGo(0); });

/* ═════════ input: one gesture, one page ═════════ */
let wLast = 0, wAcc = 0, wUsed = false, wStepAt = 0, tailUp = 0, tailUpAt = 0;
function step(dir){
  if (mode === "gal"){
    if (G.pushAnim) return;
    const last = ITEMS.length - 1;
    if (dir > 0 && G.to >= last) return toBoard();
    galGo(G.to + dir);
  } else if (mode === "cv" && C.state === "opening"){
    if (dir > 0) cvReveal(); else toGallery();
  }
}
addEventListener("wheel", e => {
  if (caseIdx >= 0 || !introDone) return;
  if (mode === "tail"){
    const t = $("#tail"), now = performance.now(); if (now - tailUpAt > 300) tailUp = 0; tailUpAt = now;
    if (t.scrollTop <= 0 && e.deltaY < 0){ tailUp += -e.deltaY; if (tailUp > 380){ tailUp = 0; toBoard(true); } } else tailUp = 0; return; }
  e.preventDefault();
  if (mode === "cv" && C.state === "free"){
    if (e.ctrlKey || e.metaKey) return cvZoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .01));
    C.anim = null; return cvPan(e.deltaX, e.deltaY);
  }
  const now = performance.now();
  if (now - wLast > 220){ wAcc = 0; wUsed = false; }
  wLast = now;
  if (wUsed && now - wStepAt < 1250) return;
  wAcc += e.deltaY;
  if (Math.abs(wAcc) > 28){ wUsed = true; wStepAt = now; step(Math.sign(wAcc)); wAcc = 0; }
}, {passive:false});
let tY = null;
addEventListener("touchstart", e => { tY = e.touches[0].clientY; }, {passive:true});
addEventListener("touchend", e => { if (tY == null || caseIdx >= 0 || !introDone) return; const dy = tY - e.changedTouches[0].clientY; tY = null;
  if (mode === "gal" && Math.abs(dy) > 45) step(Math.sign(dy));
  if (mode === "tail" && $("#tail").scrollTop <= 0 && dy < -80) toBoard(true); }, {passive:true});
addEventListener("keydown", e => {
  if (e.key === "Escape") return closeCase();
  if (caseIdx >= 0){ if (e.key === "ArrowRight" || e.key === "ArrowLeft"){ caseIdx = (caseIdx + (e.key === "ArrowRight" ? 1 : 7)) % 8; $("#case").innerHTML = caseHTML(caseIdx); } return; }
  const down = ["ArrowDown","PageDown"," "].includes(e.key), up = ["ArrowUp","PageUp"].includes(e.key);
  if (mode === "gal" || (mode === "cv" && C.state === "opening")){ if (down || up){ e.preventDefault(); step(down ? 1 : -1); } }
  else if (mode === "cv"){ if (down || up){ e.preventDefault(); cvPan(0, (down ? 1 : -1) * vh() * .6); } }
});

/* ═════════ glow ═════════ */
const GL = {};
function glowInit(id, offs){
  const el = $("#" + id); if (!el) return;
  GL[id] = {el, t:{x:innerWidth/2, y:innerHeight*.45, s:Math.min(innerWidth, innerHeight)}, col:null,
    b:[...el.children].map((e, k) => ({e, x:innerWidth/2, y:innerHeight/2, s:600, k:[.14, .28, .42][k], o:offs[k], f:[1, .8, .62][k]}))};
}
function glowColors(id, ri){ const g = GL[id]; if (!g || g.col === ri) return; g.col = ri; const a = (TH.aura || THEMES.aura.aura)[ri]; g.b.forEach((b, k) => b.e.style.setProperty("--c", `rgb(${a[k]})`)); }
function glowFrame(id, now){
  const g = GL[id]; if (!g) return; const t = g.t;
  const pull = fine ? 1 : 0;
  g.b.forEach((b, k) => {
    const tx = t.x + b.o[0] * t.s + (mx - t.x) * b.k * pull, ty = t.y + b.o[1] * t.s + (my - t.y) * b.k * pull;
    const ts = t.s * b.f * (1 + .05 * Math.sin(now / 1400 + k * 2));
    b.x += (tx - b.x) * .05; b.y += (ty - b.y) * .05; b.s += (ts - b.s) * .05;
    b.e.style.transform = `translate(${b.x.toFixed(1)}px,${b.y.toFixed(1)}px) scale(${(b.s / 1000).toFixed(3)})`;
  });
}
let glowTick = 0;
function glowGallery(now){
  const it = ITEMS[Math.round(G.to)], resting = !G.anim && !G.pushAnim;
  const ri = it.k === "panel" ? P[it.i].room : 0; glowColors("glowG", ri);
  const W = innerWidth, H = innerHeight, mob = W < 700, T = GL.glowG.t;
  if (it.k === "panel" && resting){
    if (glowTick++ % 12 === 0){ const r = $("img", G.arts[it.i]).getBoundingClientRect(), side = P[it.i].side;
      // sit behind the work, pushed away from the side card
      T.x = r.left + r.width/2 + (mob ? 0 : side * r.width * .16); T.y = r.top + r.height * .62; T.s = r.width * (mob ? 1.15 : 1.25); }
  } else if (it.k === "entrance" && resting){ T.x = W/2; T.y = H * (mob ? .32 : .4); T.s = Math.min(W, H) * (mob ? 1.1 : .95); }
  else { T.x = W/2; T.y = H * .45; T.s = Math.min(W, H) * .55; }
  glowFrame("glowG", now);
}
function glowBoard(now){
  const W = innerWidth, H = innerHeight, T = GL.glowC.t;
  const f = $("#cv").classList.contains("focusing") && C.focusI >= 0 ? $(`.cb-p[data-i="${C.focusI}"] img`) : null;
  if (f){ const r = f.getBoundingClientRect(); T.x = r.left + r.width/2; T.y = r.top + r.height * .6; T.s = r.width * 1.2; glowColors("glowC", P[C.focusI].room); }
  else { T.x = W * .42; T.y = H * .45; T.s = Math.max(W, H) * .62; glowColors("glowC", C.curRoom || 0); }
  glowFrame("glowC", now);
}

/* ═════════ loop ═════════ */
function loop(now){
  requestAnimationFrame(loop);
  cx += (mx-cx)*.3; cy += (my-cy)*.3; curEl.style.transform = `translate(${cx}px,${cy}px)`;
  galFrame(now); if (mode === "gal"){ galUI(); glowGallery(now); } cvFrame(now); if (mode === "cv") glowBoard(now); if (mode === "tail") glowFrame("glowT", now);
}

/* intro: lights on, flicker, resume */
function runIntro(){
  closeCase(); introDone = false;
  const it = $("#intro"), bar = $("#inBar"), lab = $("#inLab");
  it.classList.remove("out","on","flick"); bar.style.width = "0"; lab.textContent = T.intro1;
  $("#gal").classList.remove("lit");
  const fin = () => { it.classList.add("out"); introDone = true; G.lastK = -1; setTimeout(() => $("#gal").classList.add("lit"), 250); };
  if (reduce){ it.classList.add("on"); bar.style.width = "100%"; setTimeout(fin, 300); return; }
  setTimeout(() => { it.classList.add("on"); bar.style.width = "62%"; }, 150);
  setTimeout(() => { it.classList.add("flick"); lab.textContent = T.intro2; }, 1000);
  setTimeout(() => { it.classList.remove("flick"); lab.textContent = T.intro3; bar.style.width = "100%"; }, 1800);
  setTimeout(fin, 2500);
}
const clock = () => { try { $("#clock").textContent = "Sydney " + new Intl.DateTimeFormat("en-AU", {hour:"2-digit", minute:"2-digit", timeZone:"Australia/Sydney"}).format(new Date()); } catch(e){} };
clock(); setInterval(clock, 30000);

function applyTheme(t, initial){
  if (!THEMES[t]) t = "dark"; TH = THEMES[t]; document.documentElement.dataset.theme = t;
  ROOMS.forEach((r, i) => r.l = TH.rooms[i]);
  $$(".themes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
  if (initial) return;
  const k = G.to; galBuild(); galGo(k, true); G.lastK = -1; G.room = -1;
  const cam = {...C.cam}, st = C.state, fi = C.focusI; cvBuild(); cvDrawMap(); C.cam = cam; C.state = st; C.focusI = fi;
  tailBuild(); if (mode === "gal") setWhere(ITEMS[Math.round(G.to)]);
  try { history.replaceState(null, "", "#" + t); } catch(e){}
}
applyTheme("aura", true);
function applyLang(l, initial){
  LANG = l === "zh" ? "zh" : "en"; T = STR[LANG]; setLangData(); applyStatic();
  try { localStorage.setItem("ks-lang", LANG); } catch(e){}
  if (initial) return;
  const k = G.to; galBuild(); galGo(k, true); G.lastK = -1;
  const cam = {...C.cam}, st = C.state, fi = C.focusI; cvBuild(); cvDrawMap(); C.cam = cam; C.state = st; C.focusI = fi;
  tailBuild();
  if (mode === "gal") setWhere(ITEMS[Math.round(G.to)]); else if (mode === "tail") setWhereText(T.tail, null);
}
$$(".lang button").forEach(b => b.addEventListener("click", () => applyLang(b.dataset.lang)));
{ let l = "en"; try { l = localStorage.getItem("ks-lang") || (location.hash === "#zh" ? "zh" : "en"); } catch(e){ l = location.hash === "#zh" ? "zh" : "en"; } if (location.hash === "#zh" || location.hash === "#en") l = location.hash.slice(1); applyLang(l, true); }
glowInit("glowG", [[-.16,.08],[.18,-.1],[0,0]]); glowInit("glowC", [[-.2,.1],[.22,-.12],[0,0]]);
roomSize(); galBuild(); cvBuild(); cvInput(); tailBuild(); cvDrawMap();
{ const t = C.blocks.find(b => b.b === "title"); C.cam = cvFit(t, .8); }
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { const k = G.to; galBuild(); roomSize(); galGo(k, true); cvLayout(); cvDrawMap(); G.lastK = -1; }, 250); });
requestAnimationFrame(loop);
runIntro();
</script>
