<!doctype html>
<html lang="en" data-world="gallery">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Step Motion Studies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/*
  NEXT STEP · v2 motion studies
  Brief: Heckhoff's spatial camera + Jason Yuan's editorial project layout,
  in light, restrained materials. Quiet palette, loud motion.
  Layout: one flow (Intro → Hero → Work → Case → Process → Contact) rendered by four worlds.
*/
:root{
  --bg:#E9E7E2; --fg:#151515; --muted:#6E6C66; --line:rgba(21,21,21,.12); --paper:#F7F6F3; --accent:#2B3FE0;
  --sans:"Geist", "Helvetica Neue", Arial, sans-serif;
  --serif:"Instrument Serif", "Times New Roman", serif;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.7,0,.2,1); --out:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
html[data-world="gallery"]{--bg:#E9E7E2}
html[data-world="studio"]{--bg:#E6E7E4}
html[data-world="canvas"]{--bg:#F3F3F0}
html[data-world="particles"]{--bg:#F6F6F4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:16px; line-height:1.5; overflow-x:hidden; transition:background .6s}
html.lock body{overflow:hidden}
img{max-width:100%; display:block}
a{color:inherit}
button{font:inherit; color:inherit; cursor:pointer; background:none; border:0; padding:0}
:focus-visible{outline:1.5px solid var(--accent); outline-offset:4px}
h1,h2,h3,h4{margin:0; font-weight:500; text-wrap:balance}
p{margin:0}
em{font-family:var(--serif); font-style:italic; font-weight:400}
.mono{font-family:var(--mono); font-size:12px; letter-spacing:.04em}
.eyebrow{text-transform:uppercase; letter-spacing:.14em; color:var(--muted)}
.wrap{padding-left:var(--gl); padding-right:var(--gr)}
.inner{max-width:1280px; margin:0 auto}

/* ── chrome ───────────────────────────── */
.top{position:fixed; z-index:50; inset:0 0 auto; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:calc(14px + env(safe-area-inset-top,0px)) var(--gr) 14px var(--gl); pointer-events:none}
.top > *{pointer-events:auto}
.brand{font-weight:500; font-size:14px; text-decoration:none; letter-spacing:-.01em}
.brand em{font-size:16px}
.top .mono{color:var(--muted)}
.sw{position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:flex; gap:2px; padding:4px; border-radius:999px;
  background:rgba(255,255,255,.72); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px) saturate(1.4); border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.08); max-width:calc(100vw - 32px); overflow-x:auto}
.sw button{padding:9px 15px; border-radius:999px; font-family:var(--mono); font-size:12px; color:var(--muted); white-space:nowrap; transition:background .3s, color .3s}
.sw button b{font-weight:500; margin-right:6px; opacity:.5}
.sw button[aria-pressed="true"]{background:var(--fg); color:var(--paper)}
.rail{position:fixed; z-index:40; right:calc(18px + env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:grid; gap:12px}
.rail button{display:flex; align-items:center; justify-content:flex-end; gap:10px; font-family:var(--mono); font-size:11px; color:var(--muted)}
.rail button span{opacity:0; transform:translateX(6px); transition:.3s var(--out)}
.rail:hover button span{opacity:1; transform:none}
.rail button i{width:18px; height:1.5px; background:currentColor; opacity:.35; transition:.4s var(--out)}
.rail button.on{color:var(--fg)}
.rail button.on i{width:34px; opacity:1; background:var(--accent)}
.why{position:fixed; z-index:45; left:calc(16px + env(safe-area-inset-left,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:min(330px, calc(100vw - 32px));
  background:rgba(255,255,255,.78); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:16px; font-size:13px; line-height:1.45; overflow:hidden}
.why > button{display:flex; align-items:center; gap:8px; padding:10px 14px; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; width:100%}
.why > button::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 3px rgba(43,63,224,.15)}
.why .wb{padding:0 14px 14px; display:grid; gap:6px}
.why .wb .ch{display:flex; flex-wrap:wrap; gap:4px}
.why .wb s{opacity:.4; font-family:var(--mono); font-size:11px}
.why .wb b{font-family:var(--mono); font-size:11px; font-weight:500; background:var(--fg); color:var(--paper); padding:1px 6px; border-radius:4px}
.why .wb p{color:var(--muted)}
.why.min .wb{display:none}
.cursor{position:fixed; z-index:96; left:0; top:0; width:8px; height:8px; margin:-4px; border-radius:50%; background:var(--fg); pointer-events:none; transition:width .35s var(--out), height .35s var(--out), margin .35s var(--out), background .3s; display:grid; place-items:center; color:var(--paper); font-family:var(--mono); font-size:11px}
.cursor span{opacity:0; transition:opacity .2s}
.cursor.big{width:84px; height:84px; margin:-42px; background:var(--fg)}
.cursor.big span{opacity:1}
@media (pointer:coarse){.cursor{display:none}}

/* intro: load, interrupt, resume */
.intro{position:fixed; inset:0; z-index:100; background:var(--paper); display:grid; place-items:center; clip-path:inset(0 0 0 0); transition:clip-path 1.1s var(--ease)}
.intro.out{clip-path:inset(0 0 100% 0)}
.intro .c{display:grid; gap:18px; justify-items:center; text-align:center; padding:0 16px}
.intro .nm{font-family:var(--serif); font-size:clamp(48px,8vw,104px); line-height:1; overflow:hidden}
.intro .nm span{display:inline-block; transform:translateY(105%); transition:transform 1s var(--out)}
.intro.go .nm span{transform:none}
.intro .ln{width:min(320px,70vw); height:1px; background:var(--line); position:relative}
.intro .ln i{position:absolute; inset:0 auto 0 0; width:0; background:var(--fg); transition:width .7s var(--ease)}
.intro .lab{color:var(--muted); min-height:1.5em}
.intro.cut .ln i{background:var(--accent)}
.veil{position:fixed; inset:0; z-index:90; background:var(--paper); display:grid; place-items:center; clip-path:inset(100% 0 0 0); transition:clip-path .8s var(--ease); pointer-events:none}
.veil.in{clip-path:inset(0 0 0 0)}
.veil.out{clip-path:inset(0 0 100% 0)}
.veil .c{text-align:center; display:grid; gap:12px; padding:0 16px}
.veil h2{font-family:var(--serif); font-size:clamp(56px,10vw,140px); line-height:.9; font-weight:400}
.veil p{color:var(--muted)}

/* shared: process + contact */
.ab{padding-block:clamp(96px,14vw,200px) 80px; position:relative; z-index:2}
.ab-lead{font-size:clamp(28px,4.2vw,60px); line-height:1.06; letter-spacing:-.035em; max-width:20ch; margin-top:24px}
.ab-steps{list-style:none; margin:72px 0 0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:28px}
.ab-steps li{border-top:1px solid var(--fg); padding-top:16px; display:grid; gap:8px; align-content:start}
.ab-steps span{font-family:var(--mono); font-size:12px; color:var(--muted)}
.ab-steps h3{font-size:22px; letter-spacing:-.02em}
.ab-steps p{color:var(--muted); font-size:15px}
.ab-steps small{font-family:var(--mono); font-size:11.5px}
.ct{padding-block:80px 150px; position:relative; z-index:2}
.ct-h{font-size:clamp(52px,10vw,160px); line-height:.9; letter-spacing:-.055em}
.ct-h em{letter-spacing:-.02em}
.ct-row{display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; margin-top:48px}
.ct-btn{display:inline-flex; align-items:center; gap:12px; background:var(--fg); color:var(--paper); text-decoration:none; padding:18px 26px; border-radius:999px; font-size:16px; transition:transform .4s var(--out)}
.ct-btn i{width:8px; height:8px; border-radius:50%; background:var(--accent)}
.ct-link{font-family:var(--mono); font-size:13px; text-decoration:none; border-bottom:1px solid var(--line); padding-bottom:2px}
.ct-foot{display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:96px; color:var(--muted); border-top:1px solid var(--line); padding-top:16px}

/* ═══ A · GALLERY ═══════════════════════ */
.g-scroll{position:relative; height:1000vh}
.g-sticky{position:sticky; top:0; height:100vh; height:100dvh; overflow:hidden; perspective:900px; perspective-origin:50% 44%}
.g-sticky::after{content:""; position:absolute; inset:0; pointer-events:none; background:radial-gradient(circle at 50% 44%, rgba(233,231,226,1) 0, rgba(233,231,226,.85) 6%, rgba(233,231,226,0) 26%)}
.g-yaw{position:absolute; left:50%; top:50%; width:0; height:0; transform-style:preserve-3d}
.g-cam{position:absolute; left:0; top:0; transform-style:preserve-3d; will-change:transform}
.g-cam > *{position:absolute; left:0; top:0}
.g-floor{background:
  linear-gradient(90deg, rgba(0,0,0,.06) 0 1px, transparent 1px) 0 0 / 300px 100%,
  linear-gradient(0deg, rgba(0,0,0,.05) 0 1px, transparent 1px) 0 0 / 100% 600px,
  linear-gradient(90deg,#D5D1C8,#DFDCD5 50%,#D5D1C8)}
.g-ceil{background:
  linear-gradient(0deg, transparent 0 600px, rgba(255,255,255,.75) 600px 630px, transparent 630px) 0 0 / 100% 1300px,
  linear-gradient(90deg,#E3E0DA,#EEECE8 50%,#E3E0DA)}
.g-wall{background:linear-gradient(0deg, #CFCBC2 0 14px, #E6E3DD 14px)}
.g-end{display:grid; place-items:center; background:#EFEDE9; text-align:center}
.g-end p{font-family:var(--serif); font-size:72px; line-height:1}
.g-title{width:1400px; margin-left:-700px; text-align:center; display:grid; gap:18px; justify-items:center}
.g-title h1{font-family:var(--serif); font-weight:400; font-size:190px; line-height:.86; letter-spacing:-.02em}
.g-title p{font-size:26px; color:var(--muted)}
.g-art{width:520px; margin-left:-260px; transform-origin:50% 100%; transform-style:preserve-3d; cursor:pointer}
.g-board{background:#FBFAF8; padding:22px 22px 26px; box-shadow:0 1px 0 rgba(0,0,0,.04), 0 40px 60px -30px rgba(0,0,0,.25); position:relative; transition:transform .6s var(--out)}
.g-art:hover .g-board{transform:translateY(-14px)}
.g-board img{width:100%; aspect-ratio:16/10; object-fit:cover}
.g-cap{display:grid; gap:4px; margin-top:16px}
.g-cap h3{font-family:var(--serif); font-weight:400; font-size:40px; line-height:1}
.g-cap p{color:var(--muted); font-size:15px}
.g-board::before, .g-board::after{content:""; position:absolute; top:100%; width:2px; height:180px; background:#B9B5AD}
.g-board::before{left:22%} .g-board::after{right:22%}
.g-shade{width:640px; height:300px; margin:-150px 0 0 -320px; background:radial-gradient(ellipse at center, rgba(60,50,40,.22), rgba(60,50,40,0) 65%)}
.g-hud{position:absolute; inset:auto var(--gr) calc(84px + env(safe-area-inset-bottom,0px)) var(--gl); display:flex; justify-content:space-between; align-items:end; gap:20px; pointer-events:none; z-index:3}
.g-hud > *{pointer-events:auto}
.g-now{display:grid; gap:6px; margin-left:min(360px, 0px)}
.g-now h2{font-family:var(--serif); font-weight:400; font-size:clamp(40px,5vw,72px); line-height:.95}
.g-now button{justify-self:start; font-family:var(--mono); font-size:12px; border-bottom:1px solid var(--fg); padding-bottom:2px; margin-top:6px}
.g-map{width:72px; height:180px; position:relative; border-left:1px solid var(--line); border-right:1px solid var(--line)}
.g-map b{position:absolute; width:14px; height:2px; background:var(--fg); opacity:.35}
.g-map i{position:absolute; left:50%; width:9px; height:9px; margin:-4.5px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px rgba(43,63,224,.15)}
.g-hint{position:absolute; top:calc(64px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); color:var(--muted); z-index:3; white-space:nowrap}

/* ═══ B · STUDIO ═══════════════════════ */
.s-wrap{position:relative; height:100vh; height:100dvh; min-height:560px; overflow:hidden; background:radial-gradient(ellipse 80% 70% at 50% 34%, #F7F7F5 0, #E6E7E4 70%)}
.s-wrap canvas{position:absolute; inset:0; width:100%; height:100%; touch-action:pan-y; cursor:grab}
.s-wrap canvas:active{cursor:grabbing}
.s-ui{position:absolute; inset:0; pointer-events:none; padding:calc(84px + env(safe-area-inset-top,0px)) var(--gr) calc(90px + env(safe-area-inset-bottom,0px)) var(--gl); display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-rows:auto 1fr auto}
.s-ui > *{pointer-events:auto; transition:opacity .6s, transform .8s var(--out)}
.s-wrap.focus .s-head, .s-wrap.focus .s-list{opacity:0; transform:translateY(-20px); pointer-events:none}
.s-head{grid-column:1; max-width:560px}
.s-head h1{font-size:clamp(40px,5.6vw,84px); line-height:.95; letter-spacing:-.05em}
.s-head p{color:var(--muted); margin-top:14px; max-width:40ch}
.s-list{grid-column:2; grid-row:1 / 3; display:grid; align-content:start; gap:2px; text-align:right}
.s-list button{font-size:15px; padding:3px 0; color:var(--muted); transition:color .3s, transform .4s var(--out); display:flex; justify-content:flex-end; gap:12px}
.s-list button .mono{opacity:.6}
.s-list button.on{color:var(--fg); transform:translateX(-10px)}
.s-foot{grid-column:1 / 3; grid-row:3; display:flex; justify-content:space-between; align-items:end; gap:16px}
.s-foot .big{font-family:var(--serif); font-size:clamp(30px,3.6vw,52px); line-height:1}
.s-label{position:absolute; z-index:4; left:0; top:0; pointer-events:none; transform:translate(-50%,-100%); opacity:0; transition:opacity .25s; text-align:center; white-space:nowrap}
.s-label.on{opacity:1}
.s-label b{display:block; font-family:var(--serif); font-weight:400; font-size:30px; line-height:1}
.s-label span{font-family:var(--mono); font-size:11px; color:var(--muted)}
.s-wrap.nogl canvas{display:none}
.s-fallback{display:none}
.s-wrap.nogl .s-fallback{display:grid; place-items:center; position:absolute; inset:0; color:var(--muted); font-family:var(--mono); font-size:13px}

/* ═══ C · CANVAS ═══════════════════════ */
.cv-view{position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab; background-color:var(--bg);
  background-image:radial-gradient(circle, rgba(21,21,21,.16) 1px, transparent 1.4px)}
.cv-view.drag{cursor:grabbing}
.cv-plane{position:absolute; left:0; top:0; transform-origin:0 0}
.cv-plane.moving{will-change:transform}
.cb{position:absolute}
.cb-title{width:1500px}
.cb-title .mono{font-size:18px}
.cb-title h1{font-size:220px; line-height:.86; letter-spacing:-.065em; margin-top:30px}
.cb-title h1 em{font-size:240px; letter-spacing:-.03em}
.cb-title p.l{font-size:34px; line-height:1.25; color:var(--muted); max-width:30ch; margin-top:44px; letter-spacing:-.01em}
.cb-go{margin-top:48px; display:inline-flex; gap:14px; align-items:center; background:var(--fg); color:var(--paper); border-radius:999px; padding:22px 34px; font-size:24px}
.cb-p{display:flex; gap:64px; align-items:flex-start; cursor:pointer}
.cb-p figure{margin:0; flex:none; border-radius:18px; overflow:hidden; box-shadow:0 50px 80px -50px rgba(0,0,0,.35); transition:box-shadow .6s, transform .8s var(--out)}
.cb-p figure img{width:100%; aspect-ratio:16/10; object-fit:cover}
.cb-p:hover figure{transform:translateY(-12px); box-shadow:0 70px 90px -50px rgba(0,0,0,.4)}
.cb-t{width:480px; flex:none; display:grid; gap:18px}
.cb-t .mono{font-size:15px; color:var(--muted)}
.cb-t h2{font-size:84px; line-height:.92; letter-spacing:-.05em}
.cb-t .ln{font-family:var(--serif); font-size:34px; line-height:1.1}
.cb-t .pr{font-size:19px; color:var(--muted)}
.cb-t ol{list-style:none; margin:0; padding:0; display:grid; gap:0}
.cb-t li{display:grid; grid-template-columns:110px 1fr; gap:12px; font-size:17px; border-top:1px solid var(--line); padding:10px 0}
.cb-t li span{font-family:var(--mono); font-size:13px; color:var(--muted); padding-top:3px}
.cb-st{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--fg); padding-top:14px}
.cb-st b{display:block; font-family:var(--serif); font-weight:400; font-size:52px; line-height:1}
.cb-st span{font-size:13px; color:var(--muted); line-height:1.3; display:block}
.cb-lim{font-size:16px; border-left:2px solid var(--accent); padding-left:14px}
.cb-open{justify-self:start; font-family:var(--mono); font-size:15px; border:1px solid var(--fg); border-radius:999px; padding:12px 20px}
.cb-open:hover{background:var(--fg); color:var(--paper)}
.cb-ab{width:1100px}
.cb-ab .ab-lead{font-size:76px; max-width:none}
.cb-ab .ab-steps{grid-template-columns:repeat(2,1fr); gap:44px}
.cb-ab .ab-steps h3{font-size:36px}
.cb-ab .ab-steps p{font-size:22px}
.cb-ab .ab-steps small, .cb-ab .ab-steps span{font-size:15px}
.cb-ct{width:1200px}
.cb-ct .ct-h{font-size:200px}
.cb-ct .ct-btn{font-size:26px; padding:26px 40px}
.cb-ct .ct-link{font-size:20px}
.cv-ui{position:fixed; z-index:30; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(76px + env(safe-area-inset-bottom,0px)); display:grid; gap:10px; justify-items:end}
.cv-ctl{display:flex; gap:2px; padding:3px; border-radius:999px; background:rgba(255,255,255,.8); border:1px solid var(--line); backdrop-filter:blur(12px)}
.cv-ctl button{min-width:34px; height:30px; border-radius:999px; font-family:var(--mono); font-size:12px; padding:0 10px}
.cv-ctl button:hover{background:var(--fg); color:var(--paper)}
.cv-map{position:relative; width:150px; height:164px; border-radius:12px; background:rgba(255,255,255,.8); border:1px solid var(--line); backdrop-filter:blur(12px); overflow:hidden; cursor:pointer}
.cv-map i{position:absolute; background:rgba(21,21,21,.18); border-radius:2px}
.cv-map i.on{background:var(--accent)}
.cv-map b{position:absolute; border:1.5px solid var(--fg); border-radius:3px}
.cv-hint.gone{opacity:0}
.cv-hint{transition:opacity .6s; position:fixed; z-index:30; top:calc(56px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); color:var(--muted); white-space:nowrap; background:rgba(255,255,255,.7); padding:6px 12px; border-radius:999px; backdrop-filter:blur(10px)}

/* ═══ D · PARTICLES ═══════════════════════ */
.p-cv{position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none}
html[data-world="particles"] main > section{position:relative; z-index:2}
.p-hero{min-height:100vh; min-height:100dvh; display:grid; grid-template-rows:auto 1fr auto; padding-block:calc(76px + env(safe-area-inset-top,0px)) 96px}
.p-slot.hero{min-height:42vh}
.p-bot{display:flex; justify-content:space-between; align-items:end; gap:16px; flex-wrap:wrap}
.p-tag{font-size:clamp(26px,3.4vw,46px); line-height:1.05; letter-spacing:-.035em; max-width:18ch}
.p-work{padding-block:80px 40px}
.p-grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:48px; align-items:start}
.p-list{display:grid; padding-block:10vh 30vh}
.p-row{display:grid; grid-template-columns:44px minmax(0,1fr); gap:4px 12px; text-align:left; padding:2.4vh 0; border-top:1px solid var(--line); transition:opacity .4s, transform .6s var(--out)}
.p-row .t{font-size:clamp(30px,4.2vw,62px); line-height:1; letter-spacing:-.05em}
.p-row .c{grid-column:2; color:var(--muted)}
.p-list.hov .p-row{opacity:.28}
.p-list .p-row.on{opacity:1; transform:translateX(14px)}
.p-stick{position:sticky; top:14vh; display:grid; gap:12px}
.p-slot.img{height:60vh; border-radius:16px; outline:1px solid var(--line); outline-offset:10px}
.p-cap{display:flex; justify-content:space-between; gap:12px; color:var(--muted)}
.p-slot.ct{height:34vh}

/* ═══ CASE (shared, Jason-style editorial) ═══ */
.case{position:fixed; inset:0; z-index:70; overflow-y:auto; overscroll-behavior:contain; background:var(--bg); opacity:0; visibility:hidden; transition:opacity .5s, visibility 0s .6s}
.case.open{opacity:1; visibility:visible; transition:opacity .5s}
.case.split{background:transparent; pointer-events:none}
.case.split .cs{pointer-events:auto; margin-left:auto; width:min(58vw,900px); min-height:100%; background:var(--paper); box-shadow:-40px 0 100px rgba(0,0,0,.08); transform:translateX(102%); transition:transform 1s var(--ease)}
.case.split.open .cs{transform:none}
.cs{padding:0 var(--gr) 0 var(--gl)}
.cs-in{max-width:1180px; margin:0 auto}
.cs-bar{position:sticky; top:0; z-index:3; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top,0px)) 0 14px; background:inherit}
.case:not(.split) .cs-bar{background:var(--bg)}
.case.split .cs-bar{background:var(--paper)}
.cs-bar .nav{display:flex; gap:6px}
.cs-bar button{border:1px solid var(--line); border-radius:999px; height:36px; min-width:36px; padding:0 14px; font-family:var(--mono); font-size:12px; background:rgba(255,255,255,.5)}
.cs-bar button:hover{background:var(--fg); color:var(--paper)}
.cs-cover{margin:18px 0 0; border-radius:16px; overflow:hidden; background:#ddd}
.cs-cover img{width:100%; aspect-ratio:2/1; object-fit:cover}
.case.split .cs-cover{display:none}
.cs-head{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:40px; align-items:end; padding:48px 0 40px}
.case.split .cs-head{grid-template-columns:1fr; padding-top:40px}
.cs-head h1{font-size:clamp(56px,9vw,150px); line-height:.86; letter-spacing:-.065em}
.cs-head .ln{font-family:var(--serif); font-size:clamp(26px,2.8vw,40px); line-height:1.1; margin-top:20px; max-width:20ch}
.cs-meta{display:grid; gap:0; margin:0}
.cs-meta div{display:grid; grid-template-columns:90px minmax(0,1fr); gap:12px; border-top:1px solid var(--line); padding:10px 0}
.cs-meta dt{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); padding-top:3px}
.cs-meta dd{margin:0; font-size:15px}
.cs-row{display:grid; grid-template-columns:220px minmax(0,1fr); gap:32px; padding:40px 0; border-top:1px solid var(--line)}
.case.split .cs-row{grid-template-columns:1fr; gap:16px}
.cs-row h4{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--muted); font-weight:400}
.cs-row .big{font-size:clamp(22px,2.4vw,32px); line-height:1.25; letter-spacing:-.02em; max-width:34ch}
.cs-dec{list-style:none; margin:0; padding:0}
.cs-dec li{display:grid; grid-template-columns:40px 140px minmax(0,1fr); gap:16px; padding:16px 0; border-bottom:1px solid var(--line); font-size:19px; align-items:baseline}
.cs-dec li span{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-dec li b{font-weight:500; font-size:14px; font-family:var(--mono); color:var(--accent)}
.cs-st{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px}
.cs-st b{display:block; font-family:var(--serif); font-weight:400; font-size:clamp(52px,6vw,92px); line-height:.9; font-variant-numeric:tabular-nums}
.cs-st span{color:var(--muted); font-size:14px; display:block; margin-top:8px}
.cs-lim{font-size:19px; max-width:52ch; border-left:2px solid var(--accent); padding-left:16px}
.cs-slots{display:grid; grid-template-columns:2fr 1fr; grid-auto-rows:180px; gap:12px}
.cs-slots div{border:1px dashed rgba(21,21,21,.25); border-radius:14px; display:grid; place-items:center; font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; padding:8px}
.cs-slots div:first-child{grid-row:span 2}
.cs-live{font-family:var(--mono); font-size:13px; border-bottom:1px solid var(--fg); text-decoration:none; justify-self:start}
.cs-next{display:grid; grid-template-columns:minmax(0,1fr) 220px; gap:24px; align-items:end; width:100%; text-align:left; padding:48px 0 140px; border-top:1px solid var(--line)}
.cs-next small{font-family:var(--mono); font-size:12px; color:var(--muted)}
.cs-next strong{display:block; font-weight:500; font-size:clamp(40px,6vw,96px); line-height:.9; letter-spacing:-.055em; transition:transform .6s var(--out)}
.cs-next:hover strong{transform:translateX(16px)}
.cs-next img{border-radius:10px; aspect-ratio:4/3; object-fit:cover}
.case.open .rv{animation:rise 1s var(--out) both; animation-delay:calc(var(--d,0) * 70ms + 300ms)}
@keyframes rise{from{opacity:0; transform:translateY(46px)}}
.flip{position:fixed; z-index:95; object-fit:cover; pointer-events:none; transition:left .95s var(--ease), top .95s var(--ease), width .95s var(--ease), height .95s var(--ease), border-radius .95s var(--ease)}

/* responsive */
@media (max-width:900px){
  .ab-steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{display:none}
  .cs-head{grid-template-columns:1fr}
  .cs-row{grid-template-columns:1fr; gap:14px}
  .cs-st{grid-template-columns:1fr}
  .cs-dec li{grid-template-columns:32px minmax(0,1fr)}
  .cs-dec li b{grid-column:2}
  .cs-dec li em{grid-column:2}
  .cs-next{grid-template-columns:1fr}
  .case.split .cs{width:100%}
  .s-ui{grid-template-columns:1fr}
  .s-list{display:none}
  .p-grid{grid-template-columns:1fr; gap:0}
  .p-stick{top:64px; z-index:0; order:-1}
  .p-slot.img{height:30vh}
  .p-list{padding-block:2vh 20vh}
  .g-map{display:none}
}
@media (max-width:560px){
  .ab-steps{grid-template-columns:1fr}
  .sw button{padding:8px 11px}
  .sw .lb{display:none}
  .why{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  .g-hud{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  .cs-slots{grid-template-columns:1fr; grid-auto-rows:120px}
  .cs-slots div:first-child{grid-row:auto}
  .top .mono{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>

        const p = ps[k];
        if (r && p.t && !exploding){ const tx = r.left + p.t[0]*r.width, ty = r.top + p.t[1]*r.height;
          p.vx += (tx - p.x) * p.k; p.vy += (ty - p.y) * p.k;
          p.r += (p.t[2] - p.r) * .08; p.g += (p.t[3] - p.g) * .08; p.b += (p.t[4] - p.b) * .08; }
        else if (!r){ p.vx += Math.sin(now*.0004 + p.j*20) * .05; p.vy += Math.cos(now*.0003 + p.j*30) * .05; }
        if (fine && !img){ const dx = p.x - mx, dy = p.y - my, d2 = dx*dx + dy*dy; if (d2 < R2){ const f = (1 - d2/R2) * 3.2; const d = Math.sqrt(d2) || 1; p.vx += dx/d*f; p.vy += dy/d*f; } }
        p.vx *= exploding ? .96 : .78; p.vy *= exploding ? .96 : .78; p.x += p.vx; p.y += p.vy;
        if (p.y < -20 || p.y > VH + 20) continue;
        ctx.fillStyle = `rgb(${p.r|0},${p.g|0},${p.b|0})`;
        const s = img ? dot : dot;
        ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
      }
      ctx.globalAlpha = 1;
    };
    raf = requestAnimationFrame(frame);
    const api = { enter(){ entered = true; mode = ""; }, destroy(){ cancelAnimationFrame(raf); }, openFirst(){ openCase(active, {rect: slots.work.getBoundingClientRect(), radius:16}); }, focus(i){ setActive(i); } };
    if (introDone) api.enter();
    return api;
  }
};

/* clock */
const clock = () => { try { $("#clock").textContent = "Sydney " + new Intl.DateTimeFormat("en-AU", {hour:"2-digit", minute:"2-digit", timeZone:"Australia/Sydney"}).format(new Date()); } catch(e){} };
clock(); setInterval(clock, 30000);

/* start */
const h0 = location.hash.slice(1); if (WORLDS[h0]) world = h0;
mount(); runIntro();
</script>
